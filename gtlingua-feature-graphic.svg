<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient matching GTLingua theme -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Globe wireframe (matching GTLingua.com style) -->
  <g transform="translate(180,250)">
    <!-- Main globe -->
    <circle r="120" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Meridian lines -->
    <ellipse rx="30" ry="120" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <ellipse rx="60" ry="120" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <ellipse rx="90" ry="120" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Latitude lines -->
    <ellipse rx="120" ry="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <ellipse rx="120" ry="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <ellipse rx="120" ry="90" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Primary equator and meridian -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    
    <!-- Connection nodes -->
    <circle cx="0" cy="-60" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="60" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-60" cy="0" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="0" r="3" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Central communication hub -->
    <circle r="6" fill="#FFFFFF" opacity="0.95"/>
    <circle r="3" fill="#4F46E5"/>
  </g>
  
  <!-- Main branding (based on GTLingua.com) -->
  <text x="380" y="140" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)">LinguaLink</text>
  <text x="380" y="170" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="normal" fill="#FFFFFF" opacity="0.7">(beta)</text>
  
  <!-- Main headline from GTLingua.com -->
  <text x="380" y="220" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" opacity="0.95">Real-time speech translation</text>
  <text x="380" y="250" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" opacity="0.95">for seamless communication</text>
  
  <!-- Supporting text from GTLingua.com -->
  <text x="380" y="290" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.8">Supporting 36 languages with advanced</text>
  <text x="380" y="315" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.8">speech recognition and synthesis</text>
  
  <!-- Key features -->
  <g transform="translate(380,350)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
    <text x="70" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Speech Recognition</text>
  </g>
  
  <g transform="translate(530,350)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
    <text x="50" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">36 Languages</text>
  </g>
  
  <g transform="translate(640,350)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
    <text x="60" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Natural Speech</text>
  </g>
  
  <!-- Microphone icon (representing speech input) -->
  <g transform="translate(320,200)">
    <rect x="-8" y="-20" width="16" height="32" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="12" x2="0" y2="25" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="-10" y1="25" x2="10" y2="25" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <path d="M -12 0 Q -12 12 0 12 Q 12 12 12 0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Sound waves emanating from microphone -->
  <g transform="translate(320,200)">
    <path d="M 20 -10 Q 30 -5 30 0 Q 30 5 20 10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <path d="M 25 -15 Q 40 -8 40 0 Q 40 8 25 15" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="80" r="2" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="950" cy="100" r="3" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="900" cy="420" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="80" cy="420" r="2" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Beta badge in corner -->
  <g transform="translate(950,50)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#FFFFFF" opacity="0.2"/>
    <text x="30" y="16" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">BETA</text>
  </g>
</svg>