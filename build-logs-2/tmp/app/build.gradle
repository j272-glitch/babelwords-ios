// app/build.gradle - TestRigor compatible configuration with Conversation Mode support
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.lingualink.linguagt'

    compileSdk rootProject.ext.compile_sdk
    buildToolsVersion rootProject.ext.build_tools_version

    defaultConfig {
        applicationId "com.lingualink.linguagt"
        minSdk rootProject.ext.min_sdk
        targetSdk rootProject.ext.target_sdk
        versionCode 17
        versionName "17.0.0"

        // MultiDex support
        multiDexEnabled true

        // Test instrumentation
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vector drawable support
        vectorDrawables {
            useSupportLibrary true
        }

        // Build config fields
        buildConfigField "boolean", "DEBUG_MODE", "true"
        buildConfigField "String", "BASE_URL", "\"https://linguagt.com\""
        buildConfigField "String", "WEBSOCKET_URL", "\"wss://linguagt.com/ws\""

        // Resource configs - include all 36 Deepgram languages
        resConfigs "en", "es", "fr", "de", "zh", "ja", "ko", "hi", "pt", "ru", 
                   "ar", "it", "nl", "pl", "tr", "sv", "da", "no", "fi", "id",
                   "ms", "th", "vi", "cs", "el", "he", "hu", "ro", "sk", "uk",
                   "ca", "hr", "sr", "sl", "tl", "ta"

        // Manifest placeholders if needed
        manifestPlaceholders = [
            appLabel: "@string/app_name"
        ]
    }

    // Signing configurations
    signingConfigs {
        debug {
            // Use default debug keystore if custom one doesn't exist
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            // Check if we're in CI/CD environment (GitHub Actions)
            if (System.getenv("ANDROID_KEYSTORE_BASE64") != null) {
                // Decode base64 keystore and save to temp file
                def keystoreBytes = System.getenv("ANDROID_KEYSTORE_BASE64").decodeBase64()
                def keystoreFile = File.createTempFile("keystore", ".jks")
                keystoreFile.deleteOnExit()
                keystoreFile.bytes = keystoreBytes

                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                // Alternative: Use gradle.properties for local builds
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            } else {
                // Fallback to debug signing if no release config available
                // This allows builds to complete even without signing config
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            debuggable true
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false  // Disabled for TestRigor

            // Use debug signing
            signingConfig signingConfigs.debug

            // Build config for debug
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "true"  // Only for local development

            // Manifest placeholders for debug
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Still enforce HTTPS in debug
            ]
        }

        release {
            debuggable false
            minifyEnabled false  // Keep disabled for TestRigor
            shrinkResources false
            zipAlignEnabled true

            // Use release signing configuration
            signingConfig signingConfigs.release

            // ProGuard files (but minify is disabled)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Build config for release
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "false"  // Strictly enforce HTTPS

            // Manifest placeholders for release
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Never allow cleartext in production
            ]
        }
    }

    // Java compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin options
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }

    // Build features
    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
        compose false
    }

    // CRITICAL: Packaging options for TestRigor (AGP 8.0.2 compatible syntax)
    packagingOptions {
        // Don't strip native libraries
        doNotStrip '**/*.so'

        // Legacy packaging for JNI libs
        jniLibs {
            useLegacyPackaging = true
        }

        // Resource handling
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/gradle/incremental.annotation.processors'

        // Pick first for duplicate files
        pickFirst 'META-INF/MANIFEST.MF'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    // Lint options (AGP 8.0.2 syntax)
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage', 'MissingTranslation'
        quiet true
    }

    // Disable splits for TestRigor
    splits {
        abi { 
            enable false 
        }
        density { 
            enable false 
        }
        language { 
            enable false 
        }
    }

    // Test options
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled = true
    }
}

dependencies {
    // AndroidX Core - REQUIRED FOR CONVERSATION MODE
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Activity and Fragment - REQUIRED FOR PERMISSIONS
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'  // Required for ProcessLifecycleOwner

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView (for conversation history display)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Navigation (if using)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'

    // ========== CONVERSATION MODE SPECIFIC DEPENDENCIES ==========

    // WebView enhancements (for better WebView support)
    implementation 'androidx.webkit:webkit:1.9.0'

    // Network - HTTP and WebSocket support
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // WebSocket client for real-time conversation mode
    // Note: WebSocket support is built into okhttp:4.12.0, no separate okhttp-ws needed
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Speech/Audio - CRITICAL FOR CONVERSATION MODE
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Permissions handling - REQUIRED FOR MICROPHONE ACCESS
    implementation 'pub.devrel:easypermissions:3.0.0'

    // Optional: Google Speech Recognition (if you want native speech support)
    // implementation 'com.google.android.gms:play-services-speech:20.0.0'

    // Optional: Deepgram SDK (if available for Android)
    // implementation 'com.deepgram:sdk-android:1.0.0'

    // Browser/WebView utilities
    implementation 'androidx.browser:browser:1.7.0'

    // Work Manager (for background audio processing if needed)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Preference/Settings (for language preferences)
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Security (for secure WebSocket connections)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ========== ADMOB AD INTEGRATION ==========

    // Google Mobile Ads SDK (AdMob)
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // User Messaging Platform (GDPR/CCPA Consent)
    implementation 'com.google.android.ump:user-messaging-platform:2.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to check APK after build
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy {
            println "\n========================================="
            println "DEBUG APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Conversation Mode: ENABLED"
                println "✓ WebSocket Support: YES"
                println "✓ Ready for TestRigor upload"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }

    if (task.name == 'assembleRelease') {
        task.finalizedBy {
            println "\n========================================="
            println "RELEASE APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/release/app-release.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Signed: YES"
                println "✓ Conversation Mode: ENABLED"
                println "✓ Ready for deployment"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }
}

// Apply additional TestRigor compatibility settings
// FIXED: Using AGP 8.x compatible API for renaming APK outputs
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            // Ensure APK name is standard
            output.outputFileName.set("app-${variant.name}.apk")
        }
    }
}
