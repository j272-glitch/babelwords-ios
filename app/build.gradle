// app/build.gradle - TestRigor compatible configuration
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.lingualink.translator'

    compileSdk rootProject.ext.compile_sdk
    buildToolsVersion rootProject.ext.build_tools_version

    defaultConfig {
        applicationId "com.lingualink.translator"
        minSdk rootProject.ext.min_sdk
        targetSdk rootProject.ext.target_sdk
        versionCode 62
        versionName "1.0.62"

        // MultiDex support
        multiDexEnabled true

        // Test instrumentation
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vector drawable support
        vectorDrawables {
            useSupportLibrary true
        }

        // Build config fields
        buildConfigField "boolean", "DEBUG_MODE", "true"
        buildConfigField "String", "BASE_URL", "\"https://api.lingualink.com\""

        // Resource configs - only include necessary languages
        resourceConfigurations += ['en', 'es', 'fr', 'de', 'zh', 'ja', 'ko']

        // Manifest placeholders if needed
        manifestPlaceholders = [
            appLabel: "@string/app_name"
        ]
    }

    // Signing configurations
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Add release config if you have a release keystore
        /*
        release {
            storeFile file('release.keystore')
            storePassword 'your_password'
            keyAlias 'your_alias'
            keyPassword 'your_password'
        }
        */
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            debuggable true
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false  // Disabled for TestRigor

            // Use debug signing
            signingConfig signingConfigs.debug

            // ProGuard disabled
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Build config for debug
            buildConfigField "boolean", "ENABLE_LOGGING", "true"

            // TestRigor specific - disable all optimizations
            crunchPngs false

            // Manifest placeholders for debug
            manifestPlaceholders += [
                usesCleartextTraffic: "true"
            ]
        }

        release {
            debuggable false
            minifyEnabled false  // Keep disabled for TestRigor
            shrinkResources false
            zipAlignEnabled true

            // Signing (uncomment if you have release keystore)
            // signingConfig signingConfigs.release
            signingConfig signingConfigs.debug  // Use debug for now

            // ProGuard disabled for TestRigor
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Build config for release
            buildConfigField "boolean", "ENABLE_LOGGING", "false"

            // TestRigor specific
            crunchPngs false

            // Manifest placeholders for release
            manifestPlaceholders += [
                usesCleartextTraffic: "false"
            ]
        }
    }

    // Java compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin options
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }

    // Build features
    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
        compose false
    }

    // CRITICAL: Packaging options for TestRigor
    packagingOptions {
        // Don't strip native libraries
        doNotStrip '**/*.so'

        // Legacy packaging
        dex {
            useLegacyPackaging = true
        }

        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }

        // Resource handling
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.kotlin_module',
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/gradle/incremental.annotation.processors'
            ]

            // Pick first for duplicate files
            pickFirsts += [
                'META-INF/MANIFEST.MF',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so'
            ]
        }
    }

    // AAPT options - CRITICAL for TestRigor
    aaptOptions {
        noCompress '.apk', '.so', '.xml', '.arsc', '.png', '.jpg', '.jpeg', '.webp', '.gif'
        cruncherEnabled = false
        additionalParameters '--no-version-vectors', '--no-version-transitions', '--legacy'
    }

    // Dex options
    dexOptions {
        preDexLibraries true
        jumboMode true
        javaMaxHeapSize "4g"
        additionalParameters += ['--no-optimize', '--multi-dex']
    }

    // Lint options
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage', 'MissingTranslation'
        quiet true
    }

    // Disable splits for TestRigor
    splits {
        abi { enable false }
        density { enable false }
        language { enable false }
    }

    // Disable bundle splits
    bundle {
        abi { enableSplit false }
        density { enableSplit false }
        language { enableSplit false }
    }

    // Test options
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled = true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Activity and Fragment
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Navigation (if using)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'

    // Network (example - adjust to your needs)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Speech/Audio (for translation app)
    implementation 'androidx.media:media:1.7.0'

    // Permissions handling
    implementation 'pub.devrel:easypermissions:3.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to check APK after build
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy {
            println "\n========================================="
            println "DEBUG APK BUILD COMPLETE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Ready for TestRigor upload"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }
}

// Apply additional TestRigor compatibility settings
afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Ensure APK name is standard
            outputFileName = "app-${variant.name}.apk"
        }

        // Disable optimizations for all variants
        variant.javaCompileOptions.annotationProcessorOptions.arguments += [
            "room.schemaLocation": "$projectDir/schemas",
            "room.incremental": "false"
        ]
    }
}
