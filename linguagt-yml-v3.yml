name: LinguaGT Android Build - v3

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release
      version_code:
        description: 'Version Code (leave empty for auto-increment)'
        required: false
        type: string
      version_name:
        description: 'Version Name (e.g., 3.0.0)'
        required: false
        default: '3.0.0'
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: true
        type: boolean
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Fix Critical Issue #1: Add write permissions for creating releases
permissions:
  contents: write
  packages: write
  actions: read
  checks: read

env:
  GRADLE_OPTS: -Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
  ORG_GRADLE_PROJECT_android_useLegacyPackaging: true
  WEBVIEW_URL: "https://linguagt.com"
  # Build configuration
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'all' }}
  VERSION_CODE: ${{ github.event.inputs.version_code || '3' }}
  VERSION_NAME: ${{ github.event.inputs.version_name || '3.0.0' }}
  CREATE_RELEASE: ${{ github.event.inputs.create_release || 'true' }}
  # Signing environment variables from GitHub secrets
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build-android:
    name: Build LinguaGT Android App v3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      debug_apk_path: ${{ steps.build_outputs.outputs.debug_apk }}
      release_apk_path: ${{ steps.build_outputs.outputs.release_apk }}
      release_aab_path: ${{ steps.build_outputs.outputs.release_aab }}
      build_status: ${{ steps.build_outputs.outputs.status }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better version tracking

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "=== SETTING UP ANDROID SDK ==="
          
          # Use Android SDK from GitHub Actions environment if available
          if [ -d "$ANDROID_SDK_ROOT" ]; then
              echo "Using existing Android SDK at $ANDROID_SDK_ROOT"
              export ANDROID_HOME=$ANDROID_SDK_ROOT
          else
              # Install Android SDK command line tools
              SDK_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
              wget -q $SDK_TOOLS_URL -O android-sdk-tools.zip
              
              # Create Android SDK directory
              export ANDROID_HOME=$HOME/android-sdk
              mkdir -p $ANDROID_HOME/cmdline-tools
              
              # Extract command line tools
              unzip -q android-sdk-tools.zip -d $ANDROID_HOME/cmdline-tools
              mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          
          # Add to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Fix Minor Issue #1: Suppress broken pipe error
          # Accept licenses silently without broken pipe error
          echo "Accepting Android SDK licenses..."
          yes 2>/dev/null | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install required packages with retry logic
          echo "Installing required SDK packages..."
          for i in 1 2 3; do
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                "platform-tools" \
                "platforms;android-34" \
                "build-tools;34.0.0" && break
              echo "Retry $i/3 for SDK package installation"
              sleep 5
          done
          
          echo "✅ Android SDK setup complete"

      - name: Create Project Structure
        run: |
          echo "=== CREATING PROJECT STRUCTURE ==="
          mkdir -p app/src/main/java/com/lingualink/linguagt
          mkdir -p app/src/main/res/{layout,values,drawable,xml,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper
          echo "✅ Project structure created"

      - name: Create Root Build Files
        run: |
          echo "=== CREATING ROOT BUILD FILES ==="
          
          # Create root build.gradle with updated AGP version
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Create settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LinguaGT"
          include ':app'
          EOF
          
          # Create gradle.properties with optimizations
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          android.defaults.buildfeatures.buildconfig=true
          android.nonFinalResIds=false
          android.enableR8.fullMode=false
          EOF
          
          # Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "✅ Root build files created"

      - name: Create Signing Configuration
        run: |
          echo "=== CREATING SIGNING CONFIGURATION ==="
          
          # Create a debug keystore for signing
          mkdir -p app
          
          # Generate a debug keystore
          keytool -genkey -v \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          echo "✅ Debug keystore created"
          
          # Check if release signing secrets are available
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "⚠️ WARNING: Missing GitHub secrets for release signing"
              echo "HAS_VALID_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
          else
              echo "=== CREATING RELEASE KEYSTORE FROM GITHUB SECRETS ==="
              
              # Decode base64 keystore
              echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
              
              # Verify the keystore
              if [ ! -f app/release.keystore ] || [ ! -s app/release.keystore ]; then
                  echo "❌ ERROR: Failed to create release keystore"
                  echo "HAS_VALID_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
              else
                  echo "✅ Release keystore created"
                  echo "HAS_VALID_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
              fi
          fi

      - name: Create App Build File with Enhanced Configuration
        run: |
          echo "=== CREATING APP BUILD.GRADLE WITH ENHANCED CONFIGURATION ==="
          
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          def getVersionCode = { ->
              def code = System.getenv("VERSION_CODE")
              return code ? code.toInteger() : 3
          }
          
          def getVersionName = { ->
              def name = System.getenv("VERSION_NAME")
              return name ?: "3.0.0"
          }
          
          android {
              namespace 'com.lingualink.linguagt'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.lingualink.linguagt"
                  minSdk 21
                  targetSdk 34
                  versionCode getVersionCode()
                  versionName getVersionName()
                  
                  // Build config fields
                  buildConfigField "String", "WEB_URL", '"https://linguagt.com"'
                  buildConfigField "long", "BUILD_TIME", System.currentTimeMillis() + "L"
                  
                  // Support for multiple architectures
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }
                  
                  // Resource configurations
                  resourceConfigurations += ['en', 'es', 'fr', 'de', 'it', 'pt', 'zh', 'ja', 'ko']
              }
              
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      if (file('release.keystore').exists() && 
                          System.getenv("ANDROID_KEYSTORE_PASSWORD") != null &&
                          System.getenv("ANDROID_KEY_ALIAS") != null &&
                          System.getenv("ANDROID_KEY_PASSWORD") != null) {
                          
                          storeFile file('release.keystore')
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                          v1SigningEnabled true
                          v2SigningEnabled true
                      } else {
                          storeFile file('debug.keystore')
                          storePassword 'android'
                          keyAlias 'androiddebugkey'
                          keyPassword 'android'
                      }
                  }
              }
              
              buildTypes {
                  release {
                      // Keep minification disabled to avoid R8 issues
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                      debuggable false
                      jniDebuggable false
                      renderscriptDebuggable false
                      zipAlignEnabled true
                      
                      // Optimize APK
                      crunchPngs true
                  }
                  debug {
                      debuggable true
                      signingConfig signingConfigs.debug
                      applicationIdSuffix ".debug"
                      versionNameSuffix "-debug"
                  }
              }
              
              bundle {
                  language {
                      enableSplit = true
                  }
                  density {
                      enableSplit = true
                  }
                  abi {
                      enableSplit = true
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
              
              buildFeatures {
                  buildConfig true
                  viewBinding true
              }
              
              packagingOptions {
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                      excludes += '/META-INF/DEPENDENCIES'
                      excludes += '/META-INF/LICENSE'
                      excludes += '/META-INF/LICENSE.txt'
                      excludes += '/META-INF/NOTICE'
                      excludes += '/META-INF/NOTICE.txt'
                      excludes += '/META-INF/ASL2.0'
                      excludes += '/META-INF/*.kotlin_module'
                  }
              }
              
              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
                  disable 'MissingTranslation', 'ExtraTranslation'
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.browser:browser:1.7.0'
          }
          
          // Task to print build information
          task printBuildInfo {
              doLast {
                  println "=== BUILD INFORMATION ==="
                  println "Version Code: ${getVersionCode()}"
                  println "Version Name: ${getVersionName()}"
                  println "Build Time: ${new Date()}"
                  println "========================="
              }
          }
          
          tasks.whenTaskAdded { task ->
              if (task.name.contains('assemble') || task.name.contains('bundle')) {
                  task.dependsOn printBuildInfo
              }
          }
          EOF
          
          echo "✅ Enhanced app build.gradle created"

      - name: Setup Gradle Wrapper
        run: |
          echo "=== SETTING UP GRADLE WRAPPER ==="
          
          # Create gradle wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=30000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Download gradle wrapper jar
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
               -O gradle/wrapper/gradle-wrapper.jar || {
              echo "Downloading from alternative source..."
              curl -L https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
                   -o gradle/wrapper/gradle-wrapper.jar
          }
          
          # Create gradlew script
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          
          ##############################################################################
          ##
          ##  Gradle start up script for UN*X
          ##
          ##############################################################################
          
          # Attempt to set APP_HOME
          PRG="$0"
          while [ -h "$PRG" ] ; do
              ls=`ls -ld "$PRG"`
              link=`expr "$ls" : '.*-> \(.*\)$'`
              if expr "$link" : '/.*' > /dev/null; then
                  PRG="$link"
              else
                  PRG=`dirname "$PRG"`"/$link"
              fi
          done
          SAVED="`pwd`"
          cd "`dirname \"$PRG\"`/" >/dev/null
          APP_HOME="`pwd -P`"
          cd "$SAVED" >/dev/null
          
          APP_NAME="Gradle"
          APP_BASE_NAME=`basename "$0"`
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          MAX_FD="maximum"
          
          warn () {
              echo "$*"
          }
          
          die () {
              echo
              echo "$*"
              echo
              exit 1
          }
          
          # OS specific support
          cygwin=false
          msys=false
          darwin=false
          nonstop=false
          case "`uname`" in
            CYGWIN* )
              cygwin=true
              ;;
            Darwin* )
              darwin=true
              ;;
            MINGW* )
              msys=false
              ;;
            NONSTOP* )
              nonstop=true
              ;;
          esac
          
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          
          # Determine the Java command to use to start the JVM
          if [ -n "$JAVA_HOME" ] ; then
              if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                  JAVACMD="$JAVA_HOME/jre/sh/java"
              else
                  JAVACMD="$JAVA_HOME/bin/java"
              fi
              if [ ! -x "$JAVACMD" ] ; then
                  die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME"
              fi
          else
              JAVACMD="java"
              which java >/dev/null 2>&1 || die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH."
          fi
          
          # Increase the maximum file descriptors if we can
          if [ "$cygwin" = "false" -a "$darwin" = "false" -a "$nonstop" = "false" ] ; then
              MAX_FD_LIMIT=`ulimit -H -n`
              if [ $? -eq 0 ] ; then
                  if [ "$MAX_FD" = "maximum" -o "$MAX_FD" = "max" ] ; then
                      MAX_FD="$MAX_FD_LIMIT"
                  fi
                  ulimit -n $MAX_FD
                  if [ $? -ne 0 ] ; then
                      warn "Could not set maximum file descriptor limit: $MAX_FD"
                  fi
              else
                  warn "Could not query maximum file descriptor limit: $MAX_FD_LIMIT"
              fi
          fi
          
          # For Darwin, add options to specify how the application appears in the dock
          if $darwin; then
              GRADLE_OPTS="$GRADLE_OPTS \"-Xdock:name=$APP_NAME\" \"-Xdock:icon=$APP_HOME/media/gradle.icns\""
          fi
          
          # For Cygwin or MSYS, switch paths to Windows format before running java
          if [ "$cygwin" = "true" -o "$msys" = "true" ] ; then
              APP_HOME=`cygpath --path --mixed "$APP_HOME"`
              CLASSPATH=`cygpath --path --mixed "$CLASSPATH"`
              JAVACMD=`cygpath --unix "$JAVACMD"`
          fi
          
          # Collect all arguments for the java command
          eval set -- $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS "\"-Dorg.gradle.appname=$APP_BASE_NAME\"" -classpath "\"$CLASSPATH\"" org.gradle.wrapper.GradleWrapperMain "$@"
          
          exec "$JAVACMD" "$@"
          GRADLEW
          
          chmod +x gradlew
          echo "✅ Gradle wrapper setup complete"

      - name: Create AndroidManifest
        run: |
          echo "=== CREATING ANDROIDMANIFEST.XML ==="
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:supportsRtl="true"
                  tools:targetApi="31">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|locale|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      
                      <!-- Deep linking for LinguaGT -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="linguagt.com" />
                      </intent-filter>
                  </activity>
                  
                  <!-- FileProvider for file sharing -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.lingualink.linguagt.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
          
          echo "✅ AndroidManifest.xml created"

      - name: Create MainActivity with TestRigor Compatibility
        run: |
          echo "=== CREATING MAINACTIVITY WITH TESTRIGOR COMPATIBILITY ==="
          
          cat > app/src/main/java/com/lingualink/linguagt/MainActivity.java << 'JAVA_EOF'
          package com.lingualink.linguagt;
          
          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.ConsoleMessage;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          
          import java.io.ByteArrayInputStream;
          import java.util.Arrays;
          
          public class MainActivity extends AppCompatActivity {
          
              private static final String TAG = "LinguaGT";
              private static final String HOME_URL = "https://linguagt.com";
              private static final int PERMISSION_REQUEST_CODE = 100;
              
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              private Handler mainHandler;
              
              // TestRigor specific flags
              private boolean isTestMode = false;
              private boolean bypassAuth = false;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Initialize handler
                  mainHandler = new Handler(Looper.getMainLooper());
                  
                  // Detect test mode
                  String packageName = getPackageName();
                  isTestMode = packageName.contains("debug") || 
                              packageName.contains("test") ||
                              getIntent().getBooleanExtra("test_mode", false);
                  
                  // Enable auth bypass in test mode
                  bypassAuth = isTestMode || getIntent().getBooleanExtra("bypass_auth", false);
                  
                  Log.d(TAG, "Test mode: " + isTestMode + ", Auth bypass: " + bypassAuth);
                  
                  // Create the layout programmatically
                  createLayout();
                  
                  // Setup WebView
                  setupWebView();
                  
                  // Request permissions
                  requestPermissions();
                  
                  // Load the app
                  String url = HOME_URL;
                  if (bypassAuth) {
                      url += "?guest=true&test_mode=true";
                  }
                  
                  Log.d(TAG, "Loading URL: " + url);
                  webView.loadUrl(url);
              }
              
              private void createLayout() {
                  // Create main layout
                  swipeRefreshLayout = new SwipeRefreshLayout(this);
                  
                  // Create progress bar
                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setProgress(0);
                  
                  // Create WebView
                  webView = new WebView(this);
                  
                  // Add views to layout
                  android.widget.LinearLayout layout = new android.widget.LinearLayout(this);
                  layout.setOrientation(android.widget.LinearLayout.VERTICAL);
                  
                  layout.addView(progressBar, new android.widget.LinearLayout.LayoutParams(
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      8
                  ));
                  
                  swipeRefreshLayout.addView(webView, new SwipeRefreshLayout.LayoutParams(
                      SwipeRefreshLayout.LayoutParams.MATCH_PARENT,
                      SwipeRefreshLayout.LayoutParams.MATCH_PARENT
                  ));
                  
                  layout.addView(swipeRefreshLayout, new android.widget.LinearLayout.LayoutParams(
                      android.widget.LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1.0f
                  ));
                  
                  setContentView(layout);
                  
                  // Setup swipe refresh
                  swipeRefreshLayout.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() {
                      @Override
                      public void onRefresh() {
                          webView.reload();
                      }
                  });
              }
              
              private void setupWebView() {
                  WebSettings webSettings = webView.getSettings();
                  
                  // Enable JavaScript
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAppCacheEnabled(true);
                  
                  // Enhanced WebView settings for LinguaGT
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  
                  // Media and permissions
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  
                  // User agent
                  String userAgent = webSettings.getUserAgentString();
                  webSettings.setUserAgentString(userAgent + " LinguaGT/3.0.0 (Android)");
                  
                  // Set clients
                  webView.setWebViewClient(new CustomWebViewClient());
                  webView.setWebChromeClient(new CustomWebChromeClient());
                  
                  // Add JavaScript interfaces
                  webView.addJavascriptInterface(new WebAppInterface(this), "Android");
                  webView.addJavascriptInterface(new TestInterface(this), "AndroidTest");
                  
                  // Enable debugging in debug builds
                  if (BuildConfig.DEBUG || isTestMode) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }
              }
              
              // Authentication bypass script for TestRigor
              private void injectAuthBypassScript() {
                  String authBypassScript = 
                      "(function() {" +
                      "console.log('Injecting authentication bypass for testing');" +
                      
                      // Set localStorage items for guest mode
                      "localStorage.setItem('guest_mode', 'true');" +
                      "localStorage.setItem('test_mode', 'true');" +
                      "localStorage.setItem('authenticated', 'true');" +
                      "localStorage.setItem('user_type', 'guest');" +
                      
                      // Override authentication functions
                      "window.isAuthenticated = function() { return true; };" +
                      "window.requireAuth = function() { return true; };" +
                      "window.checkAuth = function() { return Promise.resolve(true); };" +
                      
                      // Hide login/signup buttons and show app content
                      "var observer = new MutationObserver(function(mutations) {" +
                          "mutations.forEach(function(mutation) {" +
                              "var loginBtns = document.querySelectorAll('[class*=\"login\"], [class*=\"signin\"], [id*=\"login\"], [id*=\"signin\"]');" +
                              "loginBtns.forEach(function(btn) {" +
                                  "if (btn.style.display !== 'none') {" +
                                      "btn.style.display = 'none';" +
                                      "console.log('Hid login button:', btn);" +
                                  "}" +
                              "});" +
                              
                              "var signupBtns = document.querySelectorAll('[class*=\"signup\"], [class*=\"register\"], [id*=\"signup\"], [id*=\"register\"]');" +
                              "signupBtns.forEach(function(btn) {" +
                                  "if (btn.style.display !== 'none') {" +
                                      "btn.style.display = 'none';" +
                                      "console.log('Hid signup button:', btn);" +
                                  "}" +
                              "});" +
                              
                              // Show main app content
                              "var appContent = document.querySelectorAll('[class*=\"app\"], [class*=\"main\"], [class*=\"content\"], [id*=\"app\"], [id*=\"main\"]');" +
                              "appContent.forEach(function(content) {" +
                                  "if (content.style.display === 'none') {" +
                                      "content.style.display = 'block';" +
                                      "console.log('Showed app content:', content);" +
                                  "}" +
                              "});" +
                          "});" +
                      "});" +
                      
                      "observer.observe(document.body, { childList: true, subtree: true });" +
                      
                      "console.log('Authentication bypass injected');" +
                      "window.AndroidTest && window.AndroidTest.onAuthBypassed();" +
                      "})();";
                  
                  webView.evaluateJavascript(authBypassScript, null);
              }
              
              // JavaScript Interface for testing
              public class TestInterface {
                  Context mContext;
                  
                  TestInterface(Context c) {
                      mContext = c;
                  }
                  
                  @JavascriptInterface
                  public void onAuthBypassed() {
                      Log.d(TAG, "Authentication bypassed successfully");
                  }
                  
                  @JavascriptInterface
                  public void enterGuestMode() {
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              // Force guest mode
                              String script = "localStorage.setItem('guest_mode', 'true'); " +
                                            "window.location.reload();";
                              webView.evaluateJavascript(script, null);
                          }
                      });
                  }
                  
                  @JavascriptInterface
                  public boolean isAuthenticated() {
                      // Always return true in test mode
                      return isTestMode || bypassAuth;
                  }
                  
                  @JavascriptInterface
                  public void skipLogin() {
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              injectAuthBypassScript();
                          }
                      });
                  }
              }
              
              // JavaScript Interface for app communication
              public class WebAppInterface {
                  Context mContext;
                  
                  WebAppInterface(Context c) {
                      mContext = c;
                  }
                  
                  @JavascriptInterface
