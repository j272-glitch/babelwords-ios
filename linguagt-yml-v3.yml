              fi
              
              if [ -n "${{ steps.build_outputs.outputs.release_aab }}" ]; then
                  echo "📦 Release AAB: ${{ steps.build_outputs.outputs.release_aab }}"
              fi
              
              echo ""
              echo "🎯 Next Steps:"
              echo "1. Download artifacts from this workflow run"
              echo "2. Test the APK on Android devices"
              echo "3. Upload AAB to Google Play Console"
              echo "4. Configure TestRigor with the debug APK"
          else
              echo "❌ Build failed - check the logs above"
              exit 1
          fi