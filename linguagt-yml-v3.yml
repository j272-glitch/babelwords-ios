                  }
                  
                  @JavascriptInterface
                  public boolean isTestMode() {
                      return isTestMode;
                  }
                  
                  @JavascriptInterface
                  public boolean isGuestMode() {
                      return true; // Always allow guest mode for testing
                  }
              }
              
              // Custom WebViewClient with auth interception
              private class CustomWebViewClient extends WebViewClient {
                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          String url = request.getUrl().toString();
                          
                          // Intercept authentication endpoints in test mode
                          if ((isTestMode || bypassAuth) && 
                              (url.contains("/login") || url.contains("/signin") || 
                               url.contains("/auth") || url.contains("/oauth"))) {
                              
                              Log.d(TAG, "Intercepting auth request: " + url);
                              
                              // Return a mock successful authentication response
                              String mockResponse = "{\"authenticated\": true, \"mode\": \"guest\", \"user\": \"test_user\"}";
                              return new WebResourceResponse(
                                  "application/json",
                                  "UTF-8",
                                  new ByteArrayInputStream(mockResponse.getBytes())
                              );
                          }
                      }
                      return super.shouldInterceptRequest(view, request);
                  }
                  
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                      Log.d(TAG, "Loading URL: " + url);
                      
                      // Skip authentication URLs in test mode
                      if ((isTestMode || bypassAuth) && 
                          (url.contains("/login") || url.contains("/signin") || 
                           url.contains("/auth") || url.contains("/oauth"))) {
                          Log.d(TAG, "Skipping auth URL, redirecting to home");
                          view.loadUrl(HOME_URL + "?guest=true");
                          return true;
                      }
                      
                      return false;
                  }
                  
                  @Override
                  public void onPageFinished(WebView view, String url) {
                      super.onPageFinished(view, url);
                      swipeRefreshLayout.setRefreshing(false);
                      progressBar.setVisibility(View.GONE);
                      Log.d(TAG, "Page loaded: " + url);
                      
                      // Inject auth bypass script
                      if (isTestMode || bypassAuth) {
                          mainHandler.postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  injectAuthBypassScript();
                              }
                          }, 500);
                      }
                  }
                  
                  @Override
                  public void onPageStarted(WebView view, String url, Bitmap favicon) {
                      super.onPageStarted(view, url, favicon);
                      progressBar.setVisibility(View.VISIBLE);
                      progressBar.setProgress(0);
                      
                      // Preemptively inject auth bypass for login pages
                      if ((isTestMode || bypassAuth) && 
                          (url.contains("login") || url.contains("signin"))) {
                          injectAuthBypassScript();
                      }
                  }
              }
              
              // Custom WebChromeClient
              private class CustomWebChromeClient extends WebChromeClient {
                  @Override
                  public void onProgressChanged(WebView view, int newProgress) {
                      super.onProgressChanged(view, newProgress);
                      progressBar.setProgress(newProgress);
                  }
                  
                  @Override
                  public void onPermissionRequest(final PermissionRequest request) {
                      Log.d(TAG, "Permission requested: " + Arrays.toString(request.getResources()));
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              request.grant(request.getResources());
                          }
                      });
                  }
                  
                  @Override
                  public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                      Log.d(TAG, "Console [" + consoleMessage.messageLevel() + "]: " + 
                                 consoleMessage.message() + " (Line: " + consoleMessage.lineNumber() + ")");
                      return true;
                  }
              }
              
              private void requestPermissions() {
                  String[] permissions = {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.MODIFY_AUDIO_SETTINGS
                  };
                  
                  boolean needsPermission = false;
                  for (String permission : permissions) {
                      if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                          needsPermission = true;
                          break;
                      }
                  }
                  
                  if (needsPermission) {
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQUEST_CODE);
                  }
              }
              
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      boolean allGranted = true;
                      for (int result : grantResults) {
                          if (result != PackageManager.PERMISSION_GRANTED) {
                              allGranted = false;
                              break;
                          }
                      }
                      if (!allGranted) {
                          Toast.makeText(this, "Some features may not work without permissions", Toast.LENGTH_LONG).show();
                      } else {
                          Log.d(TAG, "All permissions granted");
                      }
                  }
              }
              
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
              
              @Override
              protected void onPause() {
                  super.onPause();
                  webView.onPause();
              }
              
              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }
              
              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("Android");
                      webView.removeJavascriptInterface("AndroidTest");
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
