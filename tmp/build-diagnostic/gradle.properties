# Project-wide Gradle settings for AGP 8.7.2 with TestRigor compatibility
# Last Updated: November 2024 for AGP 8.7.2 / Gradle 8.10

# ===========================
# JVM and Memory Configuration
# ===========================
# Configured for large Android projects with conversation mode and ad SDKs
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ===========================
# Gradle Build Settings - TestRigor Compatible
# ===========================
# CRITICAL: These settings prevent APK corruption for TestRigor uploads

# Disable daemon for CI/CD consistency (will be overridden by workflow if needed)
org.gradle.daemon=false

# CRITICAL: Disable parallel execution to prevent TestRigor APK corruption
org.gradle.parallel=false

# CRITICAL: Disable build caching to ensure clean builds for TestRigor
org.gradle.caching=false

# CRITICAL: Disable configuration on demand
org.gradle.configureondemand=false

# ===========================
# Android Build Configuration
# ===========================
# Use AndroidX libraries
android.useAndroidX=true

# Enable Jetifier for legacy library compatibility
android.enableJetifier=true

# CRITICAL: Use legacy packaging (prevents TestRigor manifest corruption)
android.useLegacyPackaging=true

# ===========================
# AGP 8.7.2 Specific Settings
# ===========================
# Non-transitive R class settings for AGP 8.7 compatibility
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Enable BuildConfig generation by default
android.defaults.buildfeatures.buildconfig=true

# Disable R8 full mode for better TestRigor compatibility
android.enableR8.fullMode=false

# ===========================
# Resource Processing
# ===========================
# Disable PNG crunching in release builds (faster builds, TestRigor compatible)
android.enablePngCrunchInReleaseBuilds=false

# ===========================
# Build Features Configuration (AGP 8.7+)
# ===========================
# Default build features (can be overridden in app/build.gradle)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ===========================
# Kotlin Configuration
# ===========================
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.incremental.usePreciseJavaTracking=true

# Disable parallel Kotlin tasks for TestRigor compatibility
kotlin.parallel.tasks.in.project=false

# Kotlin compiler daemon memory
kotlin.daemon.jvmargs=-Xmx3072m

# ===========================
# Dependency Management
# ===========================
# Suppress warnings for using SDK 35 (latest)
android.suppressUnsupportedCompileSdk=35

# Suppress option warnings (keeps build logs clean)
android.suppressUnsupportedOptionWarnings=true

# ===========================
# Network Configuration
# ===========================
# HTTP/HTTPS settings for dependency downloads
systemProp.http.keepAlive=true
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Maven repository timeouts
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# ===========================
# Logging and Console Output
# ===========================
# Show all warnings
org.gradle.warning.mode=all

# Auto console output
org.gradle.console=auto

# ===========================
# CRITICAL TestRigor Compatibility Summary
# ===========================
# These settings ensure TestRigor compatibility with AGP 8.7.2:
#
# MUST REMAIN FALSE (prevents APK corruption):
# ✓ org.gradle.parallel=false
# ✓ org.gradle.caching=false
# ✓ org.gradle.configureondemand=false
# ✓ android.nonTransitiveRClass=false
# ✓ android.enableR8.fullMode=false
#
# MUST REMAIN TRUE (required for TestRigor):
# ✓ android.useAndroidX=true
# ✓ android.enableJetifier=true
# ✓ android.useLegacyPackaging=true (CRITICAL!)
#
# Additional TestRigor requirements handled in app/build.gradle:
# - packaging { jniLibs { useLegacyPackaging = true } }
# - packaging { dex { useLegacyPackaging = true } }
# - bundle { abi/density/language { enableSplit = false } }
# - Standard APK naming: app-debug.apk, app-release.apk
