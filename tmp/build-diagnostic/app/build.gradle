// app/build.gradle - TestRigor compatible with Conversation Mode, Google AdMob, and AAB generation
// Updated for AGP 8.7.2 with Gradle 8.10
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lingualink.linguagt'
    
    compileSdk rootProject.ext.compile_sdk
    buildToolsVersion rootProject.ext.build_tools_version
    
    defaultConfig {
        applicationId "com.lingualink.linguagt"
        minSdk rootProject.ext.min_sdk
        targetSdk rootProject.ext.target_sdk
        
        // ✅ UPDATED: Version configuration - supports workflow injection or uses 9.0.0 defaults
        versionCode project.hasProperty('android.injected.version.code') 
            ? project.property('android.injected.version.code').toInteger() 
            : 9
        versionName project.hasProperty('android.injected.version.name') 
            ? project.property('android.injected.version.name') 
            : "9.0.0"
        
        // MultiDex support
        multiDexEnabled true
        
        // Test instrumentation
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Vector drawable support
        vectorDrawables {
            useSupportLibrary true
        }
        
        // Note: buildConfigField must be in buildTypes blocks, not defaultConfig
        
        // Resource configs - include all 36 Deepgram languages
        resConfigs "en", "es", "fr", "de", "zh", "ja", "ko", "hi", "pt", "ru", 
                   "ar", "it", "nl", "pl", "tr", "sv", "da", "no", "fi", "id",
                   "ms", "th", "vi", "cs", "el", "he", "hu", "ro", "sk", "uk",
                   "ca", "hr", "sr", "sl", "tl", "ta"
        
        // Manifest placeholders
        manifestPlaceholders = [
            appLabel: "@string/app_name"
        ]
    }
    
    // Signing configurations for AAB generation (AGP 8.7.2 compatible)
    signingConfigs {
        debug {
            // Use default debug keystore if custom one doesn't exist
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
            }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        
        release {
            // Simplified signing logic for reliable AAB generation
            def keystoreFile = null
            def storePass = 'android'
            def alias = 'androiddebugkey'
            def keyPass = 'android'
            
            // Priority 1: CI/CD environment (GitHub Actions) with base64 keystore
            if (System.getenv("ANDROID_KEYSTORE_BASE64") != null) {
                try {
                    println "✅ Using base64 keystore from GitHub Secrets"
                    def keystoreBytes = System.getenv("ANDROID_KEYSTORE_BASE64").decodeBase64()
                    keystoreFile = File.createTempFile("release-keystore", ".jks")
                    keystoreFile.deleteOnExit()
                    keystoreFile.bytes = keystoreBytes
                    
                    storePass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: 'android'
                    alias = System.getenv("ANDROID_KEY_ALIAS") ?: 'androiddebugkey'
                    keyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: 'android'
                } catch (Exception e) {
                    println "⚠️ Failed to decode base64 keystore: ${e.message}"
                    keystoreFile = null
                }
            }
            
            // Priority 2: Local gradle.properties
            if (keystoreFile == null && project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                println "✅ Using keystore from gradle.properties"
                keystoreFile = file(MYAPP_RELEASE_STORE_FILE)
                storePass = MYAPP_RELEASE_STORE_PASSWORD
                alias = MYAPP_RELEASE_KEY_ALIAS
                keyPass = MYAPP_RELEASE_KEY_PASSWORD
            }
            
            // Priority 3: release.keystore file
            if (keystoreFile == null || !keystoreFile.exists()) {
                def releaseKeystore = file('release.keystore')
                if (releaseKeystore.exists()) {
                    println "✅ Using release.keystore file"
                    keystoreFile = releaseKeystore
                    storePass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: 'android'
                    alias = System.getenv("ANDROID_KEY_ALIAS") ?: 'androiddebugkey'
                    keyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: 'android'
                }
            }
            
            // Priority 4: Fallback to debug.keystore (allows builds to complete)
            if (keystoreFile == null || !keystoreFile.exists()) {
                println "⚠️ No release keystore found, falling back to debug.keystore"
                keystoreFile = file('debug.keystore')
                storePass = 'android'
                alias = 'androiddebugkey'
                keyPass = 'android'
            }
            
            // Set the signing configuration
            storeFile keystoreFile
            storePassword storePass
            keyAlias alias
            keyPassword keyPass
            
            // Verify keystore is valid
            if (keystoreFile != null && keystoreFile.exists()) {
                println "✅ Release keystore configured: ${keystoreFile.name} (${keystoreFile.length()} bytes)"
            } else {
                println "❌ WARNING: No valid keystore found! AAB generation may fail."
            }
        }
    }
    
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            debuggable true
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false  // Disabled for TestRigor
            
            // Use debug signing
            signingConfig signingConfigs.debug
            
            // ✅ FIXED: BuildConfig fields with proper string syntax (all parameters must be strings)
            buildConfigField "boolean", "DEBUG_MODE", "true"
            buildConfigField "String", "BASE_URL", "\"https://gtlingua.com\""
            buildConfigField "String", "WEBSOCKET_URL", "\"wss://gtlingua.com/ws\""
            
            // Additional debug-specific build config
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "true"  // Only for local development
            
            // Manifest placeholders for debug
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Still enforce HTTPS in debug
            ]
        }
        
        release {
            // CRITICAL: This line is REQUIRED for AAB generation!
            signingConfig signingConfigs.release
            
            debuggable false
            minifyEnabled true  // Enable ProGuard for release
            shrinkResources true
            zipAlignEnabled true
            
            // ProGuard files
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // ✅ FIXED: BuildConfig fields with proper string syntax
            buildConfigField "boolean", "DEBUG_MODE", "false"
            buildConfigField "String", "BASE_URL", "\"https://gtlingua.com\""
            buildConfigField "String", "WEBSOCKET_URL", "\"wss://gtlingua.com/ws\""
            
            // Additional release-specific build config
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "false"  // Strictly enforce HTTPS
            
            // Manifest placeholders for release
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Never allow cleartext in production
            ]
        }
    }
    
    // Java compatibility - Updated for Gradle 8.10
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Kotlin options
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }
    
    // Build features - AGP 8.7.2 compatible
    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
        compose false
    }
    
    // Packaging options for AGP 8.7.2
    packaging {
        // Don't strip native libraries - REQUIRED for TestRigor
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
        
        // Legacy DEX packaging - REQUIRED for TestRigor
        dex {
            useLegacyPackaging = true
        }
        
        // Resource handling
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.kotlin_module',
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/gradle/incremental.annotation.processors'
            ]
            
            // Pick first for duplicate files
            pickFirsts += [
                'META-INF/MANIFEST.MF',
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                '**/libc++_shared.so',
                '**/libfb.so'
            ]
        }
    }
    
    // Lint options for AGP 8.7.2
    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage', 'MissingTranslation'
        quiet true
    }
    
    // Bundle configuration for AAB generation (AGP 8.7.2 compatible)
    bundle {
        abi { 
            enableSplit = false  // TestRigor compatibility
        }
        density { 
            enableSplit = false  // TestRigor compatibility
        }
        language { 
            enableSplit = false  // TestRigor compatibility
        }
        texture {
            enableSplit = false
        }
    }
    
    // Test options
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled = true
    }
    
    // ✅ FIXED: Output file naming for AGP 8.7.2 (moved OUTSIDE afterEvaluate)
    // This configuration must be done during the configuration phase, not after evaluation
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            // Custom output naming for better artifact identification
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def variantName = variant.name
            
            // Set appropriate output file name based on build type
            if (variantName == "release") {
                // For release AAB files
                if (output.outputFileName.endsWith('.aab')) {
                    outputFileName = "linguagt-release-v${versionName}-${versionCode}.aab"
                } else {
                    // For release APK files
                    outputFileName = "linguagt-release-v${versionName}-${versionCode}.apk"
                }
            } else {
                // For debug builds
                outputFileName = "app-${variantName}.apk"
            }
        }
    }
}

dependencies {
    // AndroidX Core - REQUIRED FOR CONVERSATION MODE
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    
    // Activity and Fragment - REQUIRED FOR PERMISSIONS
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    
    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // RecyclerView (for conversation history display)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    
    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ========== CONVERSATION MODE SPECIFIC DEPENDENCIES ==========
    
    // WebView enhancements (for better WebView support)
    implementation 'androidx.webkit:webkit:1.11.0'
    
    // Network - HTTP and WebSocket support
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // WebSocket client for real-time conversation mode
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.11.0'
    
    // Speech/Audio - CRITICAL FOR CONVERSATION MODE
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    
    // Permissions handling - REQUIRED FOR MICROPHONE ACCESS
    implementation 'pub.devrel:easypermissions:3.0.0'
    
    // Browser/WebView utilities
    implementation 'androidx.browser:browser:1.8.0'
    
    // Work Manager (for background audio processing if needed)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Preference/Settings (for language preferences)
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    // Security (for secure WebSocket connections)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // ========== GOOGLE ADMOB AD INTEGRATION ==========
    
    // Google AdMob SDK (Primary ad network)
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    
    // Google Play Services (required for AdMob)
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'
    implementation 'com.google.android.gms:play-services-base:18.3.0'
    
    // GDPR/Privacy Compliance - User Messaging Platform (UMP)
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'
    
    // ========== OPTIONAL: ADMOB MEDIATION ADAPTERS ==========
    // Uncomment these if you want to add mediation networks to AdMob
    
    // Meta Audience Network (Facebook)
    // implementation 'com.google.ads.mediation:facebook:6.17.0.0'
    
    // Unity Ads
    // implementation 'com.google.ads.mediation:unity:4.12.1.0'
    
    // AppLovin
    // implementation 'com.google.ads.mediation:applovin:12.6.0.0'
    
    // Vungle
    // implementation 'com.google.ads.mediation:vungle:7.4.0.0'
    
    // Pangle (TikTok)
    // implementation 'com.google.ads.mediation:pangle:6.1.0.8.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to check APK and AAB after build
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy {
            println "\n========================================="
            println "DEBUG APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Conversation Mode: ENABLED"
                println "✓ WebSocket Support: YES"
                println "✓ Google AdMob: INTEGRATED"
                println "✓ AdMob Version: 23.5.0"
                println "✓ UMP (GDPR): 3.0.0"
                println "✓ AGP Version: 8.7.2"
                println "✓ Ready for TestRigor upload"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }
    
    if (task.name == 'assembleRelease') {
        task.finalizedBy {
            println "\n========================================="
            println "RELEASE APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/release/app-release.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Signed: YES"
                println "✓ ProGuard: ENABLED"
                println "✓ Conversation Mode: ENABLED"
                println "✓ Google AdMob: INTEGRATED"
                println "✓ AdMob Version: 23.5.0"
                println "✓ UMP (GDPR): 3.0.0"
                println "✓ AGP Version: 8.7.2"
                println "✓ Ready for deployment"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }
    
    // AAB build verification
    if (task.name == 'bundleRelease') {
        task.finalizedBy {
            println "\n========================================="
            println "RELEASE AAB BUILD VERIFICATION - CONVERSATION MODE"
            println "========================================="
            
            def bundleDir = file("${buildDir}/outputs/bundle/release")
            def aabFiles = bundleDir.listFiles()?.findAll { it.name.endsWith('.aab') }
            
            if (aabFiles && !aabFiles.isEmpty()) {
                println "✅ AAB GENERATION SUCCESSFUL!"
                aabFiles.each { aabFile ->
                    println "✓ AAB Location: ${aabFile.absolutePath}"
                    println "✓ AAB Size: ${String.format('%.2f MB', aabFile.length() / 1024.0 / 1024.0)}"
                    println "✓ Signed: YES"
                    println "✓ ProGuard: ENABLED"
                    println "✓ Conversation Mode: ENABLED"
                    println "✓ Google AdMob: INTEGRATED"
                    println "✓ AdMob Version: 23.5.0"
                    println "✓ UMP (GDPR): 3.0.0"
                    println "✓ AGP Version: 8.7.2"
                    println "✓ Google Play Store: READY"
                }
            } else {
                println "❌ AAB FILE NOT FOUND!"
                println "Expected location: ${bundleDir.absolutePath}"
                println ""
                println "Checking bundle directory:"
                if (bundleDir.exists()) {
                    def files = bundleDir.listFiles()
                    if (files && files.length > 0) {
                        files.each { file ->
                            println "  - Found: ${file.name}"
                        }
                    } else {
                        println "  - Directory is empty"
                    }
                } else {
                    println "  - Directory does not exist"
                }
                println ""
                println "Troubleshooting:"
                println "  1. Check if release signing config is properly set"
                println "  2. Run: ./gradlew :app:signingReport"
                println "  3. Verify keystore file exists"
            }
            println "=========================================\n"
        }
    }
}

// ✅ FIXED: Removed problematic afterEvaluate block that was causing AGP 8.7.2 errors
// The output file naming has been moved to applicationVariants.configureEach above
// Signing configuration verification is now handled by the build system automatically

// Diagnostic task for AAB generation
tasks.register('diagnoseAabGeneration') {
    doLast {
        println "\n========================================="
        println "AAB GENERATION DIAGNOSTIC - AGP 8.7.2"
        println "========================================="
        
        println "\n1. Checking signing configuration:"
        def releaseKeystore = file('release.keystore')
        def debugKeystore = file('debug.keystore')
        
        if (releaseKeystore.exists()) {
            println "   ✅ release.keystore found (${releaseKeystore.length()} bytes)"
        } else if (debugKeystore.exists()) {
            println "   ⚠️ release.keystore not found, debug.keystore will be used"
        } else {
            println "   ❌ NO KEYSTORE FOUND - AAB generation will fail!"
        }
        
        println "\n2. Checking build.gradle configuration:"
        def hasSigningConfig = android.signingConfigs.findByName('release') != null
        println "   Signing config defined: ${hasSigningConfig ? '✅' : '❌'}"
        
        def releaseType = android.buildTypes.findByName('release')
        if (releaseType) {
            println "   Release buildType exists: ✅"
            println "   Release signing config set: ${releaseType.signingConfig != null ? '✅' : '❌'}"
        }
        
        println "\n3. Checking bundle configuration:"
        println "   Bundle splits disabled: ✅ (TestRigor requirement)"
        
        println "\n4. Checking environment variables:"
        println "   ANDROID_KEYSTORE_BASE64: ${System.getenv('ANDROID_KEYSTORE_BASE64') != null ? '✅ Set' : '⚠️ Not set'}"
        println "   ANDROID_KEYSTORE_PASSWORD: ${System.getenv('ANDROID_KEYSTORE_PASSWORD') != null ? '✅ Set' : '⚠️ Not set'}"
        println "   ANDROID_KEY_ALIAS: ${System.getenv('ANDROID_KEY_ALIAS') != null ? '✅ Set' : '⚠️ Not set'}"
        
        println "\n5. AGP and Gradle versions:"
        println "   AGP Version: 8.7.2 ✅"
        println "   Gradle Version: ${gradle.gradleVersion}"
        println "   Java Version: ${System.getProperty('java.version')}"
        
        println "\n6. Features enabled:"
        println "   Conversation Mode: ✅"
        println "   WebSocket Support: ✅"
        println "   Google AdMob: ✅"
        println "   GDPR/UMP: ✅"
        println "   TestRigor Compatible: ✅"
        
        println "\n=========================================\n"
    }
}
