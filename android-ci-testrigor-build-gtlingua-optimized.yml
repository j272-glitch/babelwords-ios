      - name: Create Network and Security Configuration
        run: |
          echo "=== CREATING NETWORK AND SECURITY CONFIGURATION ==="
          
          # Create network security config optimized for GTLingua
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- GTLingua and Deepgram domains -->
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="true">gtlingua.com</domain>
                  <domain includeSubdomains="true">www.gtlingua.com</domain>
                  <domain includeSubdomains="true">api.deepgram.com</domain>
                  <domain includeSubdomains="true">deepgram.com</domain>
                  <domain includeSubdomains="true">googleapis.com</domain>
                  <domain includeSubdomains="true">google.com</domain>
                  <domain includeSubdomains="true">translate.google.com</domain>
              </domain-config>
              
              <!-- Development domains (if needed) -->
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
              </domain-config>
          </network-security-config>
          EOF
          
          # Create file paths for sharing
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="."/>
              <cache-path name="cache" path="."/>
              <files-path name="internal_files" path="."/>
          </paths>
          EOF
          
          # Create backup rules
          cat > app/src/main/res/xml/backup_rules.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <!-- Include GTLingua preferences -->
              <include domain="sharedpref" path="gtlingua_prefs.xml"/>
              
              <!-- Exclude cache and temp files -->
              <exclude domain="cache" />
              <exclude domain="external" path="tmp" />
              <exclude domain="external" path="cache" />
          </full-backup-content>
          EOF
          
          # Create data extraction rules
          cat > app/src/main/res/xml/data_extraction_rules.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="sharedpref" path="gtlingua_prefs.xml"/>
                  <exclude domain="cache" />
                  <exclude domain="external" path="tmp" />
              </cloud-backup>
              <device-transfer>
                  <include domain="sharedpref" path="gtlingua_prefs.xml"/>
                  <exclude domain="cache" />
                  <exclude domain="external" path="tmp" />
              </device-transfer>
          </data-extraction-rules>
          EOF
          
          echo "✅ Network and security configuration created"

      - name: Create App Build Configuration
        run: |
          echo "=== CREATING APP BUILD CONFIGURATION ==="
          
          # Create optimized app/build.gradle for GTLingua integration
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          
          android {
              namespace "com.lingualink.gtlingua"
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.lingualink.gtlingua"
                  minSdk 24
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
                  
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  
                  // WebView and Deepgram optimizations
                  manifestPlaceholders = [
                      gtlinguaUrl: "https://gtlingua.com",
                      deepgramEnabled: true
                  ]
                  
                  vectorDrawables.useSupportLibrary = true
              }
              
              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                      debuggable true
                      
                      // Development configurations for GTLingua testing
                      buildConfigField "String", "GTLINGUA_URL", '"https://gtlingua.com"'
                      buildConfigField "boolean", "DEEPGRAM_ENABLED", "true"
                      buildConfigField "boolean", "DEBUG_WEBVIEW", "true"
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      
                      // Production configurations
                      buildConfigField "String", "GTLINGUA_URL", '"https://gtlingua.com"'
                      buildConfigField "boolean", "DEEPGRAM_ENABLED", "true"
                      buildConfigField "boolean", "DEBUG_WEBVIEW", "false"
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = '17'
              }
              
              buildFeatures {
                  viewBinding true
                  buildConfig true
              }
              
              packaging {
                  resources {
                      excludes += ['/META-INF/{AL2.0,LGPL2.1}']
                  }
              }
              
              // Lint options to prevent build failures
              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
                  disable 'MissingTranslation'
              }
          }
          
          dependencies {
              // Core Android dependencies
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              
              // Coroutines for async operations
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              
              // Enhanced WebView support for GTLingua
              implementation 'androidx.webkit:webkit:1.8.0'
              
              // JSON processing for GTLingua bridge
              implementation 'org.json:json:20231013'
              
              // Permissions handling
              implementation 'com.karumi:dexter:6.2.3'
              
              // Image processing for OCR
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              
              // Preferences
              implementation 'androidx.preference:preference-ktx:1.2.1'
              
              // Testing dependencies
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.1.5'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
              androidTestImplementation 'androidx.test.espresso:espresso-web:3.5.1'
          }
          EOF
          
          echo "✅ App build configuration created for GTLingua integration"

      - name: Create ProGuard Rules
        run: |
          echo "=== CREATING PROGUARD RULES ==="
          
          cat > app/proguard-rules.pro << 'EOF'
          # GTLingua Android App ProGuard Rules
          
          # Keep GTLingua bridge classes
          -keep class com.lingualink.gtlingua.bridge.** { *; }
          -keepclassmembers class com.lingualink.gtlingua.bridge.** {
              @android.webkit.JavascriptInterface <methods>;
          }
          
          # Keep WebView JavaScript interface methods
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          
          # Keep GTLingua activity classes
          -keep class com.lingualink.gtlingua.activity.** { *; }
          
          # Keep utility classes
          -keep class com.lingualink.gtlingua.utils.** { *; }
          
          # Keep JSON classes for GTLingua bridge
          -keep class org.json.** { *; }
          -dontwarn org.json.**
          
          # Keep WebView classes
          -keep class android.webkit.** { *; }
          -dontwarn android.webkit.**
          
          # Keep coroutines
          -keepnames class kotlinx.coroutines.internal.MainDispatcherFactory {}
          -keepnames class kotlinx.coroutines.CoroutineExceptionHandler {}
          
          # Keep native methods
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          
          # Keep enums
          -keepclassmembers enum * {
              public static **[] values();
              public static ** valueOf(java.lang.String);
          }
          
          # Keep Parcelable implementations
          -keep class * implements android.os.Parcelable {
              public static final android.os.Parcelable$Creator *;
          }
          
          # Preserve line numbers for debugging
          -keepattributes SourceFile,LineNumberTable
          
          # Keep GTLingua preferences
          -keep class androidx.preference.** { *; }
          -dontwarn androidx.preference.**
          EOF
          
          echo "✅ ProGuard rules created"

      - name: Validate GTLingua Project Structure
        run: |
          echo "=== VALIDATING GTLINGUA PROJECT STRUCTURE ==="
          
          echo "Checking essential GTLingua files:"
          [ -f "build.gradle" ] && echo "✅ Root build.gradle exists" || echo "❌ Root build.gradle missing"
          [ -f "app/build.gradle" ] && echo "✅ App build.gradle exists" || echo "❌ App build.gradle missing"
          [ -f "app/src/main/AndroidManifest.xml" ] && echo "✅ AndroidManifest.xml exists" || echo "❌ AndroidManifest.xml missing"
          
          echo "Checking GTLingua activities:"
          [ -f "app/src/main/java/com/lingualink/gtlingua/activity/LauncherActivity.kt" ] && echo "✅ LauncherActivity.kt exists" || echo "❌ LauncherActivity.kt missing"
          [ -f "app/src/main/java/com/lingualink/gtlingua/activity/GTLinguaActivity.kt" ] && echo "✅ GTLinguaActivity.kt exists" || echo "❌ GTLinguaActivity.kt missing"
          [ -f "app/src/main/java/com/lingualink/gtlingua/activity/CameraOCRActivity.kt" ] && echo "✅ CameraOCRActivity.kt exists" || echo "❌ CameraOCRActivity.kt missing"
          
          echo "Checking GTLingua bridge and utilities:"
          [ -f "app/src/main/java/com/lingualink/gtlingua/bridge/GTLinguaBridge.kt" ] && echo "✅ GTLinguaBridge.kt exists" || echo "❌ GTLinguaBridge.kt missing"
          [ -f "app/src/main/java/com/lingualink/gtlingua/utils/PreferencesManager.kt" ] && echo "✅ PreferencesManager.kt exists" || echo "❌ PreferencesManager.kt missing"
          
          echo "Checking GTLingua layouts:"
          [ -f "app/src/main/res/layout/activity_launcher.xml" ] && echo "✅ activity_launcher.xml exists" || echo "❌ activity_launcher.xml missing"
          [ -f "app/src/main/res/layout/activity_gtlingua.xml" ] && echo "✅ activity_gtlingua.xml exists" || echo "❌ activity_gtlingua.xml missing"
          [ -f "app/src/main/res/layout/activity_camera_ocr.xml" ] && echo "✅ activity_camera_ocr.xml exists" || echo "❌ activity_camera_ocr.xml missing"
          
          echo "Checking GTLingua resources:"
          [ -f "app/src/main/res/values/strings.xml" ] && echo "✅ strings.xml exists" || echo "❌ strings.xml missing"
          [ -f "app/src/main/res/values/colors.xml" ] && echo "✅ colors.xml exists" || echo "❌ colors.xml missing"
          [ -f "app/src/main/res/values/themes.xml" ] && echo "✅ themes.xml exists" || echo "❌ themes.xml missing"
          
          echo "Checking GTLingua drawables:"
          [ -f "app/src/main/res/drawable/gradient_background.xml" ] && echo "✅ gradient_background.xml exists" || echo "❌ gradient_background.xml missing"
          [ -f "app/src/main/res/drawable/voice_button_background.xml" ] && echo "✅ voice_button_background.xml exists" || echo "❌ voice_button_background.xml missing"
          
          echo "Checking configuration files:"
          [ -f "app/src/main/res/xml/network_security_config.xml" ] && echo "✅ network_security_config.xml exists" || echo "❌ network_security_config.xml missing"
          [ -f "app/proguard-rules.pro" ] && echo "✅ proguard-rules.pro exists" || echo "❌ proguard-rules.pro missing"
          
          echo "Checking icon files:"
          find app/src/main/res/mipmap-* -name "*.png" 2>/dev/null | wc -l | xargs echo "Icon files found:"
          
          echo "GTLingua project structure summary:"
          echo "Kotlin files:"
          find app/src/main/java -name "*.kt" 2>/dev/null | wc -l | xargs echo "  Kotlin files:"
          echo "Layout files:"
          find app/src/main/res/layout -name "*.xml" 2>/dev/null | wc -l | xargs echo "  Layout files:"
          echo "Resource files:"
          find app/src/main/res -name "*.xml" -not -path "*/layout/*" 2>/dev/null | wc -l | xargs echo "  Resource files:"
          
          echo "✅ GTLingua project structure validation completed"

      - name: Build GTLingua-Optimized APK
        run: |
          echo "=== BUILDING GTLINGUA-OPTIMIZED APK ==="
          
          # Clean any previous builds
          rm -rf .gradle build app/build
          
          # Initialize Gradle
          ./gradlew --version
          
          echo "Building GTLingua APK with Deepgram integration..."
          
          # Build the APK with detailed logging
          ./gradlew clean app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all || {
              echo "Build failed. Showing configuration for debugging..."
              echo "--- build.gradle ---"
              cat build.gradle
              echo "--- app/build.gradle ---"
              cat app/build.gradle
              echo "--- settings.gradle ---"
              cat settings.gradle
              echo "--- gradle.properties ---"
              cat gradle.properties
              echo "--- AndroidManifest.xml (first 50 lines) ---"
              head -50 app/src/main/AndroidManifest.xml
              echo "--- LauncherActivity.kt (first 30 lines) ---"
              head -30 app/src/main/java/com/lingualink/gtlingua/activity/LauncherActivity.kt
              exit 1
            }
          
          # Find and verify the built APK
          DEBUG_APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "./gtlingua-mobile-debug.apk"
            echo "✅ GTLingua Mobile APK created successfully!"
            echo "  Size: $(du -h gtlingua-mobile-debug.apk | cut -f1)"
            echo "  Path: $DEBUG_APK"
            
            # Verify APK contents
            echo "APK contents preview:"
            unzip -l gtlingua-mobile-debug.apk | head -20
            
            # Check for GTLingua-specific components
            echo "Checking for GTLingua components:"
            unzip -l gtlingua-mobile-debug.apk | grep -i gtlingua || echo "GTLingua components found"
            
            echo "Checking for WebView components:"
            unzip -l gtlingua-mobile-debug.apk | grep -i webkit | head -3 || echo "WebView components found"
            
            # Check APK package info if available
            if command -v aapt >/dev/null 2>&1; then
              echo "APK Package Info:"
              aapt dump badging gtlingua-mobile-debug.apk | head -10
            fi
            
          else
            echo "❌ APK not found in app/build/outputs"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi

      - name: Upload GTLingua Mobile APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gtlingua-mobile-apk-${{ github.run_number }}
          path: gtlingua-mobile-debug.apk
          retention-days: 30

      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gtlingua-build-logs-${{ github.run_number }}
          path: |
            build.gradle
            build.gradle.original
            app/build.gradle
            gradle.properties
            settings.gradle
            gradle/wrapper/
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/lingualink/gtlingua/activity/LauncherActivity.kt
            app/src/main/java/com/lingualink/gtlingua/activity/GTLinguaActivity.kt
            app/src/main/java/com/lingualink/gtlingua/bridge/GTLinguaBridge.kt
            app/src/main/res/layout/activity_launcher.xml
            app/src/main/res/layout/activity_gtlingua.xml
            app/src/main/res/values/strings.xml
            app/src/main/res/values/colors.xml
          retention-days: 7