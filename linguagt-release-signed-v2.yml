      - name: Create Launcher Icons with LinguaGT Branding
        run: |
          echo "=== CREATING LAUNCHER ICONS WITH LINGUAGT BRANDING ==="
          
          # Install ImageMagick for icon generation
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Create base icon using SVG-like approach with ImageMagick
          # LinguaGT theme: Globe with gradient background (#4F46E5 to #7C3AED)
          
          for size in 48 72 96 144 192; do
              density=""
              case $size in
                  48) density="mdpi" ;;
                  72) density="hdpi" ;;
                  96) density="xhdpi" ;;
                  144) density="xxhdpi" ;;
                  192) density="xxxhdpi" ;;
              esac
              
              # Create icon with globe design
              convert -size ${size}x${size} gradient:'#4F46E5-#7C3AED' \
                      \( -size $((size-20))x$((size-20)) xc:none \
                         -stroke white -strokewidth 2 -fill none \
                         -draw "circle $((size/2-10)),$((size/2-10)) $((size/2-10)),$((size/4))" \
                         -draw "ellipse $((size/2-10)),$((size/2-10)) $((size/3)),$((size/2-20))" \
                         -draw "line $((size/4)),$((size/2-10)) $((size*3/4-20)),$((size/2-10))" \
                         -draw "line $((size/2-10)),$((size/4)) $((size/2-10)),$((size*3/4-20))" \
                      \) -gravity center -composite \
                      app/src/main/res/mipmap-${density}/ic_launcher.png
              
              echo "✅ Created ${density} launcher icon (${size}x${size})"
          done
          
          # Create adaptive icon background and foreground for API 26+
          convert -size 108x108 gradient:'#4F46E5-#7C3AED' \
                  app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          
          convert -size 108x108 xc:none \
                  -stroke white -strokewidth 3 -fill none \
                  -draw "circle 54,54 54,27" \
                  -draw "ellipse 54,54 36,54" \
                  -draw "line 27,54 81,54" \
                  -draw "line 54,27 54,81" \
                  app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          
          echo "✅ Created adaptive launcher icons"
          
          # Create splash screen background
          convert -size 320x480 gradient:'#4F46E5-#7C3AED' \
                  app/src/main/res/drawable/splash_background.png
          
          echo "✅ Launcher icons created with LinguaGT branding"

