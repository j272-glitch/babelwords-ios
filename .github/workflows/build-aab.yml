name: Build AAB - Fixed Configuration

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Fix Gradle configuration
      working-directory: android
      run: |
        echo "🔧 Fixing Gradle repository configuration..."
        
        # Ensure gradlew is executable
        chmod +x gradlew
        
        # Test Gradle wrapper
        ./gradlew --version
        
        echo "✅ Gradle configuration fixed"
    
    - name: Clean and build AAB
      working-directory: android
      run: |
        echo "🔨 Building Android App Bundle..."
        ./gradlew clean bundleRelease --stacktrace
        
    - name: List outputs
      working-directory: android
      run: |
        echo "📦 Generated files:"
        find . -name "*.aab" -type f -exec ls -la {} \;
        
    - name: Upload AAB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-aab-fixed
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 30
