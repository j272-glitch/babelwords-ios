name: Fix Gradle Wrapper

on:
  workflow_dispatch:
 # push:
 #   paths:
 #     - '.github/workflows/fix-gradle-wrapper.yml'
 #     - 'android/**'

jobs:
  fix-wrapper:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17 for Android Gradle Plugin
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Resolve Container Java Path Conflicts
      run: |
        echo "=== CONTAINER ENVIRONMENT ANALYSIS ==="
        echo "JAVA_HOME from setup-java: $JAVA_HOME"
        echo "Java version: $(java -version 2>&1 | head -1)"
        echo "Java executable location: $(which java)"
        echo ""
        
        echo "=== PATH CONFLICT DETECTION ==="
        HARDCODED_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
        echo "Expected hardcoded path: $HARDCODED_PATH"
        echo "Actual setup-java path: $JAVA_HOME"
        
        if [ "$HARDCODED_PATH" = "$JAVA_HOME" ]; then
            echo "✅ No path conflict detected"
        else
            echo "⚠️  PATH CONFLICT: Hardcoded vs actual Java paths differ"
            echo "   Hardcoded exists: $([ -d "$HARDCODED_PATH" ] && echo 'YES' || echo 'NO')"
            echo "   Setup-java exists: $([ -d "$JAVA_HOME" ] && echo 'YES' || echo 'NO')"
        fi
        
        echo ""
        echo "=== GRADLE OPTS CONFIGURATION ==="
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Xmx4g"
        echo "GRADLE_OPTS=$GRADLE_OPTS" >> $GITHUB_ENV
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "✅ Container path conflict resolution configured"
        
    - name: Test Classpath Resolution
      working-directory: android
      run: |
        echo "=== CLASSPATH RESOLUTION TESTING ==="
        echo "Testing Gradle Wrapper classpath integrity..."
        
        # Verify gradle-wrapper.jar exists and is valid
        if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar found, checking integrity..."
            jar tvf gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain.class || {
                echo "❌ GradleWrapperMain.class missing in JAR"
                echo "REGENERATE_WRAPPER=true" >> $GITHUB_ENV
            }
            echo "✅ GradleWrapperMain.class found in JAR"
        else
            echo "❌ gradle-wrapper.jar missing"
            echo "REGENERATE_WRAPPER=true" >> $GITHUB_ENV
        fi
        
        # Test JAR extraction
        echo "Testing JAR extraction..."
        mkdir -p /tmp/gradle-wrapper-test
        if unzip -q gradle/wrapper/gradle-wrapper.jar -d /tmp/gradle-wrapper-test; then
            echo "✅ JAR extraction successful"
        else
            echo "❌ JAR extraction failed"
            echo "REGENERATE_WRAPPER=true" >> $GITHUB_ENV
        fi
        rm -rf /tmp/gradle-wrapper-test
        
        echo "✅ Classpath resolution test completed"
      
    - name: Download and Install Working Gradle Wrapper
      if: env.REGENERATE_WRAPPER == 'true'
      working-directory: android
      run: |
        echo "Removing corrupted wrapper files..."
        rm -rf gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
        
        echo "Creating wrapper directory..."
        mkdir -p gradle/wrapper
        
        echo "Downloading gradle-wrapper.jar from official source..."
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.3.0/gradle/wrapper/gradle-wrapper.jar"
        
        echo "Creating gradle-wrapper.properties..."
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "networkTimeout=30000" >> gradle/wrapper/gradle-wrapper.properties
        echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
        echo "Making gradlew executable..."
        chmod +x gradlew
        
        echo "Verifying wrapper files..."
        ls -la gradle/wrapper/
        file gradle/wrapper/gradle-wrapper.jar
        
    - name: Network Resilience Testing
      working-directory: android
      run: |
        echo "=== NETWORK RESILIENCE TESTING ==="
        
        # Test network connectivity with retry logic
        MAX_RETRIES=3
        RETRY_COUNT=0
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Network test attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            if timeout 60 ./gradlew --version --no-daemon --refresh-dependencies; then
                echo "✅ Network connectivity successful"
                break
            else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "⏱️ Waiting 10 seconds before retry..."
                    sleep 10
                fi
            fi
        done
        
        if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ All network attempts failed"
            exit 1
        fi
        
        echo "✅ Network resilience test passed"
        
    - name: Build Production Android APK
      working-directory: android
      run: |
        echo "=== PRODUCTION ANDROID APK BUILD ==="
        
        echo "Build environment:"
        echo "- Java Home: $JAVA_HOME"
        echo "- Gradle Opts: $GRADLE_OPTS"
        
        # Build with comprehensive error handling
        if timeout 600 ./gradlew assembleRelease --no-daemon --stacktrace --info; then
            echo "✅ APK BUILD SUCCESSFUL"
            
            # Find APK and copy to standard name
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
                cp "$APK_PATH" "lingualink-fixed-wrapper.apk"
                echo "APK ready: lingualink-fixed-wrapper.apk"
                echo "Size: $(stat -c%s "$APK_PATH") bytes"
            else
                echo "⚠️ APK not found, searching..."
                find . -name "*.apk" -type f || echo "No APK files generated"
            fi
        else
            echo "❌ APK BUILD FAILED"
            exit 1
        fi
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-fixed-wrapper-apk
        path: android/lingualink-fixed-wrapper.apk
        retention-days: 30
        
    - name: Build Summary
      if: always()
      run: |
        echo ""
        echo "🎉 GRADLE WRAPPER SOLUTION COMPLETE"
        echo "=================================="
        echo ""
        echo "Solution Coverage:"
        echo "✅ Classpath Resolution with JAR integrity testing"
        echo "✅ Container Path Conflicts with Java 17 environment"
        echo "✅ Network Dependencies with retry logic"
        echo "✅ Wrapper Regeneration from official sources"
        echo ""
        if [ -f "android/lingualink-fixed-wrapper.apk" ]; then
            echo "✅ Production APK: Successfully generated"
            echo "✅ Artifact: lingualink-fixed-wrapper-apk uploaded"
        else
            echo "❌ Production APK: Build failed - check logs"
        fi
        echo ""
        echo "Next Steps:"
        echo "1. Download lingualink-fixed-wrapper-apk artifact"
        echo "2. Test APK on Android devices/emulators"
        echo "3. Verify Testrigor automation compatibility"
