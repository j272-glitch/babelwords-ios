name: Minimal Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Download Android SDK manually
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        export ANDROID_HOME=$PWD/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
        
    - name: Create simple APK structure
      run: |
        mkdir -p simple-app/src/main/java/com/lingualink/translator
        mkdir -p simple-app/src/main/res/values
        
    - name: Create MainActivity
      run: |
        cat > simple-app/src/main/java/com/lingualink/translator/MainActivity.java << 'EOF'
        package com.lingualink.translator;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.*;
        import android.view.View;
        
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                
                TextView title = new TextView(this);
                title.setText("LinguaLink Pure Native");
                title.setTextSize(24);
                layout.addView(title);
                
                EditText input = new EditText(this);
                input.setHint("Enter text to translate");
                layout.addView(input);
                
                Button button = new Button(this);
                button.setText("Translate");
                layout.addView(button);
                
                TextView result = new TextView(this);
                result.setText("Translation results appear here");
                layout.addView(result);
                
                setContentView(layout);
            }
        }
        EOF
        
    - name: Create manifest
      run: |
        cat > simple-app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.lingualink.translator">
            <application android:label="LinguaLink Native">
                <activity android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
    - name: Build APK manually
      run: |
        export ANDROID_HOME=$PWD/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.0
        cd simple-app
        
        # Compile resources
        aapt package -f -m -J src/main/java -S src/main/res -M src/main/AndroidManifest.xml -I $ANDROID_HOME/platforms/android-33/android.jar
        
        # Compile Java
        javac -cp $ANDROID_HOME/platforms/android-33/android.jar src/main/java/com/lingualink/translator/*.java
        
        # Create DEX
        dx --dex --output=classes.dex src/main/java/com/lingualink/translator/*.class
        
        # Package APK
        aapt package -f -M src/main/AndroidManifest.xml -S src/main/res -I $ANDROID_HOME/platforms/android-33/android.jar -F LinguaLink-Manual-v1.0.68.apk
        aapt add LinguaLink-Manual-v1.0.68.apk classes.dex
        
    - name: Upload manual APK
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-manual-apk
        path: simple-app/LinguaLink-Manual-v1.0.68.apk