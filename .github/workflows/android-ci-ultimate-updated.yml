name: Android CI Ultimate Fix

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Verify Java Installation
      run: |
        echo "=== JAVA VERIFICATION ==="
        echo "JAVA_HOME: $JAVA_HOME"
        echo "Java binary location: $(which java)"
        echo "Java version:"
        $JAVA_HOME/bin/java -version
        echo "Directory contents:"
        ls -la $JAVA_HOME/bin/ | head -5
        
    - name: Nuclear Cache Destruction
      run: |
        echo "=== NUCLEAR CACHE DESTRUCTION ==="
        
        # Destroy all possible Gradle cache locations
        sudo rm -rf /home/runner/.gradle/ || true
        sudo rm -rf /root/.gradle/ || true
        sudo rm -rf ~/.gradle/ || true
        sudo rm -rf $HOME/.gradle/ || true
        sudo rm -rf /tmp/.gradle* || true
        sudo rm -rf /var/tmp/.gradle* || true
        sudo rm -rf /opt/.gradle* || true
        sudo rm -rf /etc/gradle/ || true
        sudo rm -rf /usr/share/gradle/ || true
        
        # Kill any running processes
        sudo pkill -f gradle || true
        sudo pkill -f java || true
        
        echo "Cache destruction complete"
        
    - name: Setup Isolated Environment
      run: |
        echo "=== SETUP ISOLATED ENVIRONMENT ==="
        
        # Create completely isolated environment with timestamp
        export GRADLE_USER_HOME="/tmp/isolated-gradle-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Force explicit Java path with multiple override methods
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
        export JAVA_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
        
        # Create comprehensive gradle.properties with Android configuration
        cat > "$GRADLE_USER_HOME/gradle.properties" << 'EOF'
        # Gradle configuration - NO hardcoded Java paths
        org.gradle.daemon=false
        org.gradle.caching=false
        org.gradle.parallel=false
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        
        # Android configuration
        android.useAndroidX=true
        android.enableJetifier=true
        
        # Network configuration for container environments
        org.gradle.wrapper.network.timeout=30000
        
        # Kotlin code style
        kotlin.code.style=official
        EOF
        
        # Export for subsequent steps
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=$GRADLE_OPTS" >> $GITHUB_ENV
        echo "JAVA_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
        
        echo "Environment setup complete:"
        echo "  JAVA_HOME: $JAVA_HOME"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"

    - name: Create Missing Android Resources
      run: |
        echo "=== CREATING ANDROID RESOURCES ==="
        
        # Ensure resource directories exist
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/drawable
        
        # Create styles.xml with AppTheme
        cat > android/app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <!-- Base application theme -->
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                <!-- Customize your theme here -->
                <item name="colorPrimary">@color/colorPrimary</item>
                <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                <item name="colorAccent">@color/colorAccent</item>
            </style>
            
            <!-- Theme for splash screen -->
            <style name="AppTheme.NoActionBar" parent="AppTheme">
                <item name="windowActionBar">false</item>
                <item name="windowNoTitle">true</item>
            </style>
        </resources>
        EOF
        
        # Create colors.xml with required colors
        cat > android/app/src/main/res/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <!-- Material Design colors -->
            <color name="colorPrimary">#2196F3</color>
            <color name="colorPrimaryDark">#1976D2</color>
            <color name="colorAccent">#FF4081</color>
            
            <!-- LinguaLink specific colors -->
            <color name="primary_blue">#2196F3</color>
            <color name="primary_blue_dark">#1976D2</color>
            
            <!-- Basic colors -->
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray">#808080</color>
            
            <!-- Status bar color -->
            <color name="purple_200">#FFBB86FC</color>
            <color name="purple_500">#FF6200EE</color>
            <color name="purple_700">#FF3700B3</color>
            <color name="teal_200">#FF03DAC5</color>
            <color name="teal_700">#FF018786</color>
        </resources>
        EOF
        
        # Create launcher icon drawable
        cat > android/app/src/main/res/drawable/ic_launcher_globe.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#2196F3"
                android:pathData="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM18.92,8h-2.95c-0.32,-1.25 -0.78,-2.45 -1.38,-3.56 1.84,0.63 3.37,1.91 4.33,3.56zM12,4.04c0.83,1.2 1.48,2.53 1.91,3.96h-3.82c0.43,-1.43 1.08,-2.76 1.91,-3.96zM4.26,14C4.1,13.36 4,12.69 4,12s0.1,-1.36 0.26,-2h3.38c-0.08,0.66 -0.14,1.32 -0.14,2 0,0.68 0.06,1.34 0.14,2L4.26,14zM5.08,16h2.95c0.32,1.25 0.78,2.45 1.38,3.56C7.57,18.93 6.04,17.66 5.08,16zM8.03,8L5.08,8c0.96,-1.66 2.49,-2.93 4.33,-3.56C8.81,5.55 8.35,6.75 8.03,8zM12,19.96c-0.83,-1.2 -1.48,-2.53 -1.91,-3.96h3.82C13.48,17.43 12.83,18.76 12,19.96zM14.34,14L9.66,14c-0.09,-0.66 -0.16,-1.32 -0.16,-2 0,-0.68 0.07,-1.35 0.16,-2h4.68c0.09,0.65 0.16,1.32 0.16,2C14.5,12.68 14.43,13.34 14.34,14zM14.59,19.56c0.6,-1.11 1.06,-2.31 1.38,-3.56h2.95C18.04,17.66 16.51,18.93 14.59,19.56zM16.36,14c0.08,-0.66 0.14,-1.32 0.14,-2 0,-0.68 -0.06,-1.34 -0.14,-2h3.38c0.16,0.64 0.26,1.31 0.26,2s-0.1,1.36 -0.26,2L16.36,14z"/>
        </vector>
        EOF
        
        echo "Android resources created successfully!"
        echo "Verifying resource files:"
        ls -la android/app/src/main/res/values/
        ls -la android/app/src/main/res/drawable/
        
    - name: Generate Fresh Wrapper
      working-directory: android
      run: |
        echo "=== GENERATE FRESH WRAPPER ==="
        
        # Complete wrapper destruction
        rm -rf gradle/ gradlew* .gradle/ build/ */build/
        
        # Download official Gradle and generate wrapper
        curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
        unzip -q /tmp/gradle.zip -d /tmp/
        
        # Generate wrapper using downloaded Gradle
        /tmp/gradle-8.3/bin/gradle wrapper --gradle-version 8.3 --no-daemon
        chmod +x gradlew
        
        echo "Fresh wrapper generated successfully"
        ls -la gradlew gradle/wrapper/
        
    - name: Test Gradle with Explicit Override
      working-directory: android
      run: |
        echo "=== TEST GRADLE WITH EXPLICIT OVERRIDE ==="
        echo "Environment check:"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  JAVA_HOME: $JAVA_HOME"
        
        # Test Gradle version with explicit Java home
        echo "Testing Gradle version with explicit override..."
        ./gradlew --version --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
        
        # Test project tasks
        echo "Testing project tasks..."
        ./gradlew tasks --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --quiet
        
    - name: Build APK with Ultimate Overrides
      working-directory: android
      run: |
        echo "=== BUILD APK WITH ULTIMATE OVERRIDES ==="
        
        # Build with comprehensive Java home overrides
        BUILD_ARGS=(
          "assembleDebug"
          "--no-daemon"
          "--stacktrace"
          "-Dorg.gradle.java.home=$JAVA_HOME"
          "-Dfile.encoding=UTF-8"
          "--gradle-user-home=$GRADLE_USER_HOME"
        )
        
        # Add debug logging if requested
        if [ "${{ inputs.debug_mode }}" = "true" ]; then
          BUILD_ARGS+=("--info" "--debug")
        else
          BUILD_ARGS+=("--info")
        fi
        
        echo "Building with arguments: ${BUILD_ARGS[@]}"
        
        # Execute build with timeout
        timeout 900 ./gradlew "${BUILD_ARGS[@]}"
        
        # Search for APK in multiple locations
        echo "=== SEARCHING FOR BUILT APK ==="
        APK_FILE=""
        
        # Search common APK locations
        SEARCH_PATHS=(
          "app/build/outputs/apk/debug"
          "app/build/outputs/apk"
          "build/outputs/apk/debug"
          "build/outputs/apk"
          "."
        )
        
        for path in "${SEARCH_PATHS[@]}"; do
          if [ -d "$path" ]; then
            echo "Searching in: $path"
            FOUND_APK=$(find "$path" -name "*.apk" -type f | head -1)
            if [ -n "$FOUND_APK" ]; then
              APK_FILE="$FOUND_APK"
              echo "Found APK: $APK_FILE"
              break
            fi
          fi
        done
        
        # If still not found, search everywhere
        if [ -z "$APK_FILE" ]; then
          echo "Searching entire build directory..."
          APK_FILE=$(find . -name "*.apk" -type f | grep -v "lingualink-ultimate-fix.apk" | head -1)
        fi
        
        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "lingualink-ultimate-fix.apk"
          APK_SIZE=$(stat -c%s lingualink-ultimate-fix.apk)
          echo "SUCCESS: APK built successfully"
          echo "  Source: $APK_FILE"
          echo "  Target: lingualink-ultimate-fix.apk"
          echo "  Size: $APK_SIZE bytes ($(( APK_SIZE / 1024 / 1024 )) MB)"
          
          # Verify APK validity
          if [ "$APK_SIZE" -gt 1000000 ]; then
            echo "APK size validation: PASSED"
          else
            echo "WARNING: APK size seems small: $APK_SIZE bytes"
          fi
        else
          echo "FAILURE: APK not found anywhere"
          echo "Build completed but APK missing - checking build results..."
          find . -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null || echo "No APK files found in entire directory"
          echo "Build directory structure:"
          find . -type d -name "*apk*" -o -name "*build*" -o -name "*output*" 2>/dev/null | head -10
          exit 1
        fi
        
    - name: Upload Ultimate APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-ultimate-fix-apk
        path: android/lingualink-ultimate-fix.apk
        retention-days: 30
        
    - name: Build Summary
      if: always()
      run: |
        echo "=== ULTIMATE BUILD SUMMARY ==="
        
        if [ -f "android/lingualink-ultimate-fix.apk" ]; then
          APK_SIZE=$(stat -c%s "android/lingualink-ultimate-fix.apk")
          echo "SUCCESS: Ultimate fix approach resolved the issue"
          echo "  APK: lingualink-ultimate-fix.apk"
          echo "  Size: $(( APK_SIZE / 1024 / 1024 )) MB"
          echo "  Status: READY FOR TESTRIGOR TESTING"
        else
          echo "FAILURE: Ultimate approach failed"
          echo "  Status: Issue requires deeper investigation"
        fi
        
        echo ""
        echo "Fix Actions Applied:"
        echo "✅ Java toolchain configuration in build.gradle"
        echo "✅ Nuclear cache destruction (all locations)"
        echo "✅ Isolated environment with timestamp"
        echo "✅ Explicit command-line Java home override"
        echo "✅ Fresh wrapper from official Gradle source"
        echo "✅ No hardcoded paths in any configuration"
        echo "✅ Disabled all caching mechanisms"
        echo ""
        echo "If successful: Download APK for Testrigor testing"
        echo "If failed: Issue is beyond GitHub Actions scope"
