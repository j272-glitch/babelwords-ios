name: Android CI - Optimized APK Search & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-search-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create Android directories
      run: |
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/gradle/wrapper
        
    - name: Generate required Android resources
      run: |
        cat > android/app/src/main/res/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <!-- LinguaLink Brand Colors -->
            <color name="primary_blue">#2196F3</color>
            <color name="primary_blue_dark">#1976D2</color>
            <color name="accent_green">#4CAF50</color>
            
            <!-- Material Design Colors -->
            <color name="colorPrimary">#2196F3</color>
            <color name="colorPrimaryDark">#1976D2</color>
            <color name="colorAccent">#FF4081</color>
            
            <!-- Standard Colors -->
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray">#808080</color>
            <color name="light_gray">#F5F5F5</color>
        </resources>
        EOF
        
    - name: Generate styles and themes
      run: |
        cat > android/app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                <item name="colorPrimary">@color/primary_blue</item>
                <item name="colorPrimaryDark">@color/primary_blue_dark</item>
                <item name="colorAccent">@color/accent_green</item>
            </style>
            
            <style name="SplashTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowBackground">@color/primary_blue</item>
            </style>
        </resources>
        EOF
        
    - name: Verify Android manifest
      run: |
        if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.lingualink.translator">
            
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="LinguaLink"
                android:theme="@style/AppTheme">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        fi
        
    - name: Setup build.gradle with APK optimization
      run: |
        if [ ! -f android/app/build.gradle ]; then
          cat > android/app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        
        android {
            compileSdkVersion 34
            
            defaultConfig {
                applicationId "com.lingualink.translator"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 1
                versionName "1.0.67"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
                debug {
                    debuggable true
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF
        fi
        
    - name: Generate Gradle wrapper with network fixes
      run: |
        if [ ! -f android/gradlew ]; then
          cd android
          # Create wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          
          # Create gradlew script
          cat > gradlew << 'EOF'
        #!/usr/bin/env sh
        APP_NAME="Gradle"
        APP_BASE_NAME=`basename "$0"`
        GRADLE_OPTS="$GRADLE_OPTS \"-Xdock:name=$APP_NAME\" \"-Xdock:icon=$APP_HOME/media/gradle.icns\""
        exec "$JAVACMD" $JAVA_OPTS $GRADLE_OPTS "\"-Dorg.gradle.appname=$APP_BASE_NAME\"" -classpath "\"$CLASSPATH\"" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
          chmod +x gradlew
          cd ..
        fi
        
    - name: Build APK with enhanced search
      run: |
        cd android
        chmod +x gradlew
        
        # Set environment variables for build optimization
        export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m"
        export JAVA_OPTS="-Xmx4g"
        
        # Build debug APK first
        ./gradlew assembleDebug --stacktrace --info
        
        # Build release APK
        ./gradlew assembleRelease --stacktrace --info
        
    - name: Advanced APK Search & Collection
      run: |
        echo "=== ADVANCED APK SEARCH INITIATED ==="
        
        # Create collection directory
        mkdir -p apk-collection
        
        # Search strategy 1: Standard locations
        echo "Searching standard Android build paths..."
        find android/ -name "*.apk" -type f -exec echo "Found APK: {}" \; -exec cp {} apk-collection/ \;
        
        # Search strategy 2: Deep recursive search
        echo "Performing deep recursive search..."
        find . -name "*.apk" -type f -not -path "./apk-collection/*" -exec echo "Deep search found: {}" \; -exec cp {} apk-collection/ \;
        
        # Search strategy 3: Build output directories
        echo "Checking build output directories..."
        for dir in android/app/build/outputs/apk/debug android/app/build/outputs/apk/release android/build/outputs; do
          if [ -d "$dir" ]; then
            find "$dir" -name "*.apk" -exec echo "Build output: {}" \; -exec cp {} apk-collection/ \;
          fi
        done
        
        # Search strategy 4: Gradle cache and temp directories
        echo "Searching Gradle cache and temp directories..."
        find ~/.gradle -name "*.apk" -type f -exec echo "Gradle cache: {}" \; -exec cp {} apk-collection/ \; 2>/dev/null || true
        
        # Search strategy 5: System-wide APK search (limited)
        echo "Limited system search for APK files..."
        find /tmp -name "*.apk" -type f -exec echo "Temp directory: {}" \; -exec cp {} apk-collection/ \; 2>/dev/null || true
        
    - name: APK Validation & Optimization
      run: |
        echo "=== APK VALIDATION & OPTIMIZATION ==="
        
        cd apk-collection
        
        # Count and list all found APKs
        apk_count=$(ls -1 *.apk 2>/dev/null | wc -l)
        echo "Total APK files found: $apk_count"
        
        if [ $apk_count -eq 0 ]; then
          echo "ERROR: No APK files found despite build completion"
          echo "Creating emergency APK placeholder..."
          echo "APK_SEARCH_FAILED" > no-apk-found.txt
          exit 1
        fi
        
        # Analyze each APK
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            echo "=== Analyzing: $apk ==="
            ls -la "$apk"
            
            # Check file size
            size=$(stat -f%z "$apk" 2>/dev/null || stat -c%s "$apk" 2>/dev/null || echo "unknown")
            echo "Size: $size bytes"
            
            # Rename for clarity
            if [[ "$apk" == *"debug"* ]]; then
              mv "$apk" "LinguaLink-Debug-v1.0.67.apk"
            elif [[ "$apk" == *"release"* ]]; then
              mv "$apk" "LinguaLink-Release-v1.0.67.apk"
            else
              mv "$apk" "LinguaLink-Optimized-v1.0.67.apk"
            fi
          fi
        done
        
        # Create final optimized APK
        latest_apk=$(ls -t *.apk | head -1)
        if [ -n "$latest_apk" ]; then
          cp "$latest_apk" "LinguaLink-APK-Search-Optimized.apk"
          echo "✅ Final optimized APK: LinguaLink-APK-Search-Optimized.apk"
        fi
        
    - name: Upload APK artifacts with search results
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-optimized-apk-collection
        path: apk-collection/
        retention-days: 30
        
    - name: Build Summary with Search Results
      run: |
        echo "=== BUILD & SEARCH SUMMARY ==="
        echo "Repository: lingualink-android2"
        echo "Workflow: Android CI - Optimized APK Search & Build"
        echo "Date: $(date)"
        echo ""
        echo "APK Search Results:"
        echo "==================="
        ls -la apk-collection/ || echo "No APK collection directory found"
        echo ""
        echo "Build Status: SUCCESS ✅"
        echo "APK Search: ENHANCED ✅"
        echo "Artifacts: UPLOADED ✅"
        echo ""
        echo "Ready for Testrigor testing compatibility"
