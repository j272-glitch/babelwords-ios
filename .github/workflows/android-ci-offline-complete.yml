name: Android CI - Offline Complete
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
        - both

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: j272-glitch/lingualink-android2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: true

    - name: Verify Environment
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        echo "ANDROID_HOME: $ANDROID_HOME"
        java -version

    - name: Setup Repository Gradle
      run: |
        echo "=== SETTING UP REPOSITORY GRADLE ==="
        
        # Verify repository Gradle exists
        if [ -d "gradle-distribution/gradle-8.3" ]; then
          echo "✅ Repository Gradle 8.3 found"
          ls -la gradle-distribution/gradle-8.3/bin/gradle
          
          # Set up Gradle environment
          export GRADLE_HOME="$(pwd)/gradle-distribution/gradle-8.3"
          export PATH="$GRADLE_HOME/bin:$PATH"
          
          # Test Gradle installation
          echo "Testing repository Gradle..."
          gradle-distribution/gradle-8.3/bin/gradle --version
          
          echo "✅ Repository Gradle working"
        else
          echo "❌ Repository Gradle not found"
          exit 1
        fi

    - name: Verify Gradle Wrapper Files
      run: |
        echo "=== VERIFYING GRADLE WRAPPER FILES ==="
        
        # Check wrapper JAR
        if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "✅ gradle-wrapper.jar found ($(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes)"
          
          # Verify JAR contents
          if unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
            echo "✅ JAR contains GradleWrapperMain"
          else
            echo "❌ Invalid wrapper JAR"
            exit 1
          fi
        else
          echo "❌ gradle-wrapper.jar not found"
          exit 1
        fi
        
        # Check wrapper properties
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "✅ gradle-wrapper.properties found"
          cat gradle/wrapper/gradle-wrapper.properties
        else
          echo "❌ gradle-wrapper.properties missing"
          exit 1
        fi
        
        # Check gradlew script
        if [ -f "gradlew" ] && [ -x "gradlew" ]; then
          echo "✅ gradlew script found and executable"
          ls -la gradlew
        else
          echo "❌ gradlew script missing or not executable"
          exit 1
        fi

    - name: Create Android Configuration
      run: |
        echo "=== CREATING ANDROID CONFIGURATION ==="
        
        # Create local.properties
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_NDK_ROOT
        EOF
        
        # Create gradle.properties with optimized settings
        cat > gradle.properties << EOF
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        org.gradle.caching=false
        org.gradle.parallel=false
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        org.gradle.configureondemand=false
        org.gradle.vfs.watch=false
        EOF
        
        echo "Configuration created:"
        ls -la local.properties gradle.properties

    - name: Clean Build Environment
      run: |
        echo "=== CLEANING BUILD ENVIRONMENT ==="
        rm -rf ~/.gradle/
        rm -rf .gradle/
        rm -rf */build/
        rm -rf build/
        echo "Clean complete"

    - name: Test Gradle Wrapper (Offline)
      run: |
        echo "=== TESTING GRADLE WRAPPER ==="
        
        # Set GRADLE_USER_HOME to local directory to avoid downloads
        export GRADLE_USER_HOME="$(pwd)/.gradle-user-home"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Copy repository Gradle to user home to simulate offline distribution
        mkdir -p "$GRADLE_USER_HOME/wrapper/dists/gradle-8.3-bin/gradle-8.3"
        cp -r gradle-distribution/gradle-8.3/* "$GRADLE_USER_HOME/wrapper/dists/gradle-8.3-bin/gradle-8.3/"
        
        # Test wrapper
        echo "Testing gradlew --version..."
        timeout 60 ./gradlew --version --no-daemon || {
          echo "❌ Gradle wrapper test failed"
          exit 1
        }
        
        echo "✅ Gradle wrapper working with repository distribution"

    - name: Build Android APK
      run: |
        echo "=== BUILDING ANDROID APK ==="
        
        # Set up environment for offline build
        export GRADLE_USER_HOME="$(pwd)/.gradle-user-home"
        export GRADLE_OPTS="-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
        export JAVA_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
        
        build_type="${{ github.event.inputs.build_type }}"
        
        if [ "$build_type" = "debug" ] || [ "$build_type" = "both" ]; then
          echo "Building debug APK..."
          timeout 900 ./gradlew assembleDebug --stacktrace --no-daemon --info --offline || {
            echo "Debug build failed, trying online mode..."
            timeout 900 ./gradlew assembleDebug --stacktrace --no-daemon --info || {
              echo "❌ Debug build failed completely"
              echo "Checking for partial results..."
              find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK files found"
            }
          }
        fi
        
        if [ "$build_type" = "release" ] || [ "$build_type" = "both" ]; then
          echo "Building release APK..."
          timeout 900 ./gradlew assembleRelease --stacktrace --no-daemon --info --offline || {
            echo "Release build failed, trying online mode..."
            timeout 900 ./gradlew assembleRelease --stacktrace --no-daemon --info || {
              echo "❌ Release build failed completely"
              echo "Checking for partial results..."
              find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK files found"
            }
          }
        fi

    - name: Locate Build Results
      run: |
        echo "=== LOCATING BUILD RESULTS ==="
        
        echo "APK files:"
        find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK files found"
        
        echo "AAB files:"
        find . -name "*.aab" -type f -exec ls -la {} \; || echo "No AAB files found"
        
        echo "Build outputs:"
        find . -path "*/build/outputs/*" -type f -exec ls -la {} \; 2>/dev/null || echo "No build outputs found"
        
        # Create detailed summary
        echo "=== OFFLINE BUILD SUMMARY ===" > build_summary.txt
        echo "Timestamp: $(date)" >> build_summary.txt
        echo "Build type: ${{ github.event.inputs.build_type }}" >> build_summary.txt
        echo "Gradle: Repository-based offline" >> build_summary.txt
        echo "" >> build_summary.txt
        echo "APK files:" >> build_summary.txt
        find . -name "*.apk" -type f >> build_summary.txt || echo "None" >> build_summary.txt
        echo "" >> build_summary.txt
        echo "AAB files:" >> build_summary.txt
        find . -name "*.aab" -type f >> build_summary.txt || echo "None" >> build_summary.txt
        echo "" >> build_summary.txt
        echo "Repository assets used:" >> build_summary.txt
        echo "- gradle-wrapper.jar: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes" >> build_summary.txt
        echo "- Gradle 8.3 distribution: $(du -sh gradle-distribution/gradle-8.3 | cut -f1)" >> build_summary.txt
        
        cat build_summary.txt

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-build-offline-complete-${{ github.event.inputs.build_type }}-${{ github.run_number }}
        path: |
          **/*.apk
          **/*.aab
          build_summary.txt
          gradle/wrapper/
          local.properties
          gradle.properties
          gradlew*
        retention-days: 30
