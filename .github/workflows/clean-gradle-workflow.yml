name: Clean Gradle Workflow

on:
  workflow_dispatch:
 # push:
 #   paths:
 #     - 'android/**'

jobs:
  clean-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Clear All Caches
      run: |
        echo "=== CLEARING ALL CACHES ==="
        
        # Remove GitHub Actions cache
        rm -rf ~/.gradle/
        rm -rf $HOME/.gradle/
        
        # Clear Android project caches
        cd android
        rm -rf .gradle/
        rm -rf build/
        rm -rf app/build/
        rm -rf */build/
        
        echo "All caches cleared"
        
    - name: Setup Fresh Environment
      run: |
        echo "=== SETUP FRESH ENVIRONMENT ==="
        
        # Create isolated Gradle environment
        export GRADLE_USER_HOME="/tmp/fresh-gradle"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Create gradle.properties with correct Java path
        cat > "$GRADLE_USER_HOME/gradle.properties" << 'EOF'
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        org.gradle.caching=false
        EOF
        
        # Set environment for subsequent steps
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false" >> $GITHUB_ENV
        
        echo "Fresh environment ready"
        echo "JAVA_HOME: $JAVA_HOME"
        
    - name: Regenerate Wrapper
      working-directory: android
      run: |
        echo "=== REGENERATE WRAPPER ==="
        
        # Remove old wrapper
        rm -rf gradle/
        rm -rf gradlew*
        
        # Download and use Gradle to create wrapper
        curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
        unzip -q /tmp/gradle.zip -d /tmp/
        
        # Create fresh wrapper
        /tmp/gradle-8.3/bin/gradle wrapper --gradle-version 8.3
        chmod +x gradlew
        
        echo "Fresh wrapper created"
        
    - name: Build APK
      working-directory: android
      env:
        GRADLE_USER_HOME: "/tmp/fresh-gradle"
      run: |
        echo "=== BUILD APK ==="
        echo "Environment:"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  JAVA_HOME: $JAVA_HOME"
        
        # Test Gradle setup
        ./gradlew --version --no-daemon
        
        # Build debug APK
        ./gradlew assembleDebug --no-daemon --stacktrace --info
        
        # Copy APK
        APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "lingualink-clean-build.apk"
          echo "APK built: lingualink-clean-build.apk"
          echo "Size: $(stat -c%s lingualink-clean-build.apk) bytes"
        else
          echo "APK not found"
          exit 1
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-clean-apk
        path: android/lingualink-clean-build.apk
        retention-days: 30
