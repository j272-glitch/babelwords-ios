name: BabelWords Android Build - AAB with Full Diagnostics (Linux)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (leave empty to auto-increment from the build number; must be higher than the last Play upload)'
        required: false
        type: string
      version_name:
        description: 'Version Name (e.g., 53.1.0)'
        required: false
        default: '53.1.0'
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: true
        type: boolean
      debug_mode:
        description: 'Enable Debug Mode (verbose output)'
        required: true
        default: true
        type: boolean
      run_firebase_test:
        description: 'Run Firebase Test Lab cloud-device test (needs Blaze billing + GCP_SA_KEY/GCP_PROJECT_ID secrets)'
        required: false
        default: false
        type: boolean
      real_ads_on_test_lab:
        description: 'REAL creatives on Test Lab (one-off fill check only; default false = test creatives)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  actions: read
  checks: read

env:
  GRADLE_OPTS: "-Xmx8192m -Dfile.encoding=UTF-8"
  ORG_GRADLE_PROJECT_android_useLegacyPackaging: true
  WEBVIEW_URL: "https://linguagt.com"
  # If you leave the version_code field blank, it auto-increments from the build number
  # plus a 100 offset, so every build is unique, always increases, and stays above the old
  # code 25. Google Play requires a strictly higher code on each upload. Type a value to override.
  VERSION_CODE: ${{ github.event.inputs.version_code || (github.run_number + 100) }}
  VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
  CREATE_RELEASE: ${{ github.event.inputs.create_release || 'true' }}
  DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'true' }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  BABELWORDS_ACCESS_TOKEN: ${{ secrets.BABELWORDS_ACCESS_TOKEN }}
  # Firebase client config (base64 of android/app/google-services.json). Optional:
  # if unset, the build still succeeds but ships without Crashlytics/Analytics.
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  build-android-aab:
    name: Build BabelWords Android AAB with Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    outputs:
      release_aab_path: ${{ steps.build_outputs.outputs.release_aab }}
      release_apk_path: ${{ steps.build_outputs.outputs.release_apk }}
      build_status: ${{ steps.build_outputs.outputs.status }}
      error_summary: ${{ steps.build_outputs.outputs.error_summary }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK Environment
        run: |
          echo "=== VERIFYING ANDROID SDK ENVIRONMENT ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          
          if [ -z "$ANDROID_HOME" ]; then
            echo "❌ ERROR: ANDROID_HOME is not set"
            exit 1
          fi
          
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "❌ ERROR: ANDROID_HOME directory does not exist: $ANDROID_HOME"
            exit 1
          fi
          
          echo "✅ ANDROID_HOME is set and directory exists"
          
          # List available build tools
          echo ""
          echo "Available Build Tools:"
          ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | head -5 || echo "No build tools found"

      - name: Setup Android SDK with API 35
        run: |
          echo "=== SETTING UP ANDROID SDK WITH API 35 ==="
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install API 35 and build tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "extras;android;m2repository" \
            "extras;google;m2repository"
          
          echo "✅ Android SDK setup complete"

      - name: Initial Project Structure Diagnostic
        run: |
          echo "=== INITIAL PROJECT DIAGNOSTIC ==="
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Debug Mode: $DEBUG_MODE"
          echo ""
          
          # Check if android directory exists
          if [ ! -d android ]; then
            echo "❌ CRITICAL ERROR: android/ directory not found!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          
          echo "✅ android/ directory exists"
          
          # List critical files and their status
          echo ""
          echo "Critical Build Files Status:"
          echo "=============================="
          
          FILES_TO_CHECK=(
            "android/build.gradle"
            "android/settings.gradle"
            "android/app/build.gradle"
            "android/gradle.properties"
            "android/gradle/wrapper/gradle-wrapper.jar"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/gradlew"
            "android/app/src/main/AndroidManifest.xml"
          )
          
          MISSING_FILES=0
          for file in "${FILES_TO_CHECK[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(ls -lh "$file" | awk '{print $5}')
              echo "✅ $file (Size: $SIZE)"
            else
              echo "❌ $file - MISSING!"
              ((MISSING_FILES++))
            fi
          done
          
          if [ $MISSING_FILES -gt 0 ]; then
            echo ""
            echo "⚠️ WARNING: $MISSING_FILES critical files are missing!"
          fi
          
          echo ""
          echo "✅ Initial diagnostic complete"

      - name: Deep Configuration Analysis
        run: |
          echo "=== DEEP CONFIGURATION ANALYSIS ==="
          
          cd android
          
          # 1. Namespace and Package Analysis
          echo "1. NAMESPACE AND PACKAGE CONFIGURATION"
          echo "======================================="
          
          # Extract namespace from build.gradle (macOS compatible)
          if [ -f app/build.gradle ]; then
            # Use sed instead of grep -oP for macOS compatibility
            NAMESPACE=$(sed -n "s/.*namespace ['\"]\\([^'\"]*\\)['\"].*/\\1/p" app/build.gradle | head -1)
            
            if [ -z "$NAMESPACE" ]; then
              # Try without quotes (for cases like: namespace com.example.app)
              NAMESPACE=$(sed -n "s/.*namespace \\([^[:space:]]*\\).*/\\1/p" app/build.gradle | head -1)
            fi
            
            if [ -z "$NAMESPACE" ]; then
              NAMESPACE="NOT_FOUND"
            fi
            
            echo "Namespace in app/build.gradle: $NAMESPACE"
            
            if [ "$NAMESPACE" = "NOT_FOUND" ]; then
              echo "❌ CRITICAL: Namespace not found in app/build.gradle!"
              echo "   AGP 8.x requires namespace to be defined"
              echo ""
              echo "   Add this to android/app/build.gradle:"
              echo "   android {"
              echo "       namespace 'com.babelwords.app'"
              echo "       ..."
              echo "   }"
            else
              echo "✅ Namespace found: $NAMESPACE"
            fi
          else
            echo "❌ app/build.gradle not found!"
            NAMESPACE="NOT_FOUND"
          fi
          
          # Extract package from AndroidManifest.xml (macOS compatible)
          if [ -f app/src/main/AndroidManifest.xml ]; then
            # Use sed to extract package attribute
            MANIFEST_PACKAGE=$(sed -n 's/.*package="\([^"]*\)".*/\1/p' app/src/main/AndroidManifest.xml | head -1)
            
            if [ -z "$MANIFEST_PACKAGE" ]; then
              MANIFEST_PACKAGE="NOT_FOUND"
            fi
            
            echo "Package in AndroidManifest.xml: $MANIFEST_PACKAGE"
          else
            echo "❌ AndroidManifest.xml not found!"
            MANIFEST_PACKAGE="NOT_FOUND"
          fi
          
          # Extract applicationId from build.gradle (macOS compatible)
          if [ -f app/build.gradle ]; then
            # Use sed to extract applicationId
            APP_ID=$(sed -n "s/.*applicationId ['\"]\\([^'\"]*\\)['\"].*/\\1/p" app/build.gradle | head -1)
            
            if [ -z "$APP_ID" ]; then
              APP_ID="NOT_SPECIFIED"
            fi
            
            echo "ApplicationId in build.gradle: $APP_ID"
          else
            APP_ID="NOT_SPECIFIED"
          fi
          
          # Check alignment
          if [ "$NAMESPACE" != "NOT_FOUND" ] && [ "$MANIFEST_PACKAGE" != "NOT_FOUND" ]; then
            if [ "$NAMESPACE" != "$MANIFEST_PACKAGE" ]; then
              echo "❌ CRITICAL: Package name mismatch!"
              echo "   Namespace: $NAMESPACE"
              echo "   Manifest:  $MANIFEST_PACKAGE"
              echo "   These MUST match for the build to succeed"
            else
              echo "✅ Package names are aligned"
            fi
          fi
          
          # 2. Source Directory Structure
          echo ""
          echo "2. SOURCE DIRECTORY STRUCTURE"
          echo "=============================="
          
          if [ "$NAMESPACE" != "NOT_FOUND" ]; then
            EXPECTED_PATH="app/src/main/java/$(echo $NAMESPACE | tr '.' '/')"
            echo "Expected source path: $EXPECTED_PATH"
            
            if [ -d "$EXPECTED_PATH" ]; then
              echo "✅ Source directory exists"
              echo "Files in directory:"
              ls -la "$EXPECTED_PATH" 2>/dev/null | head -5 || echo "   Directory is empty"
            else
              echo "❌ Source directory does NOT exist!"
              echo "Available directories under app/src/main/java:"
              find app/src/main/java -type d -maxdepth 3 2>/dev/null || echo "   No directories found"
            fi
          fi
          
          # 3. Build Configuration Syntax Check
          echo ""
          echo "3. BUILD CONFIGURATION SYNTAX CHECK"
          echo "===================================="
          
          # Check for syntax issues in app/build.gradle
          if [ -f app/build.gradle ]; then
            echo "Checking app/build.gradle for common issues..."
            
            # Check for unclosed braces
            OPEN_BRACES=$(grep -o '{' app/build.gradle | wc -l)
            CLOSE_BRACES=$(grep -o '}' app/build.gradle | wc -l)
            
            if [ "$OPEN_BRACES" -ne "$CLOSE_BRACES" ]; then
              echo "❌ ERROR: Mismatched braces in app/build.gradle!"
              echo "   Open braces: $OPEN_BRACES"
              echo "   Close braces: $CLOSE_BRACES"
            else
              echo "✅ Braces are balanced"
            fi
            
            # Check for buildConfigField issues
            if grep -q "buildConfigField" app/build.gradle; then
              echo ""
              echo "BuildConfigField declarations found:"
              grep -n "buildConfigField" app/build.gradle | while read -r line; do
                echo "   $line"
                # Check for common syntax error (unescaped quotes)
                if echo "$line" | grep -q 'buildConfigField.*"[^"]*"[[:space:]]*"[^"\\]*"[[:space:]]*$'; then
                  echo "   ⚠️ WARNING: This line may have unescaped quotes in the value"
                fi
              done
            fi
          fi
          
          # 4. Gradle Properties Validation
          echo ""
          echo "4. GRADLE PROPERTIES VALIDATION"
          echo "================================"
          
          if [ -f gradle.properties ]; then
            echo "Validating gradle.properties format..."
            
            INVALID_LINES=0
            while IFS= read -r line; do
              # Skip comments and empty lines
              if [[ "$line" =~ ^[[:space:]]*# ]] || [[ -z "${line// }" ]]; then
                continue
              fi
              
              # Check if line has proper key=value format
              if [[ ! "$line" =~ ^[^=]+=.*$ ]]; then
                echo "❌ Invalid line: $line"
                ((INVALID_LINES++))
              fi
            done < gradle.properties
            
            if [ $INVALID_LINES -eq 0 ]; then
              echo "✅ All non-comment lines are valid"
            else
              echo "❌ Found $INVALID_LINES invalid lines in gradle.properties"
            fi
            
            # Show key properties
            echo ""
            echo "Key properties configured:"
            grep -E "org.gradle.jvmargs|android.useAndroidX|android.enableJetifier" gradle.properties | head -5 || echo "No key properties found"
          else
            echo "❌ gradle.properties not found!"
          fi

      - name: Setup Gradle Wrapper with Validation
        run: |
          echo "=== GRADLE WRAPPER SETUP AND VALIDATION ==="
          
          cd android
          
          # Ensure gradle wrapper directory exists
          mkdir -p gradle/wrapper
          
          # Check and fix gradle-wrapper.jar
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "✅ gradle-wrapper.jar exists"
            # Validate size (should be > 50KB)
            JAR_SIZE=$(stat -f%z gradle/wrapper/gradle-wrapper.jar 2>/dev/null || stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0)
            if [ $JAR_SIZE -lt 50000 ]; then
              echo "⚠️ gradle-wrapper.jar seems corrupted (size: $JAR_SIZE bytes)"
              echo "Downloading fresh copy..."
              wget -q https://github.com/gradle/gradle/raw/v8.10.0/gradle/wrapper/gradle-wrapper.jar \
                   -O gradle/wrapper/gradle-wrapper.jar || {
                echo "❌ Failed to download gradle-wrapper.jar"
                exit 1
              }
            fi
          else
            echo "⚠️ gradle-wrapper.jar missing, downloading Gradle 8.10 wrapper..."
            wget -q https://github.com/gradle/gradle/raw/v8.10.0/gradle/wrapper/gradle-wrapper.jar \
                 -O gradle/wrapper/gradle-wrapper.jar || {
              echo "❌ Failed to download gradle-wrapper.jar"
              exit 1
            }
            echo "✅ gradle-wrapper.jar downloaded successfully"
          fi
          
          # Ensure gradle-wrapper.properties is correct
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Creating gradle-wrapper.properties for Gradle 8.10..."
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
          networkTimeout=30000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          else
            echo "✅ gradle-wrapper.properties exists"
            # Verify Gradle version
            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
            echo "Configured Gradle version: $GRADLE_VERSION"
          fi
          
          # Ensure gradlew is executable
          chmod +x gradlew 2>/dev/null || true
          
          # Test Gradle wrapper
          echo ""
          echo "Testing Gradle wrapper..."
          ./gradlew --version 2>&1 | head -10 || {
            echo "❌ Gradle wrapper test failed!"
            echo "Attempting to diagnose..."
            java -version
            echo "JAVA_HOME: $JAVA_HOME"
            exit 1
          }
          
          echo "✅ Gradle wrapper setup complete"

      - name: Pre-Build Gradle Diagnostic
        run: |
          echo "=== PRE-BUILD GRADLE DIAGNOSTIC ==="
          
          cd android
          
          # Test 1: Can Gradle even start?
          echo "Test 1: Gradle Version Check"
          echo "============================="
          ./gradlew --version || {
            echo "❌ CRITICAL: Gradle cannot start!"
            echo "This indicates a fundamental configuration problem."
            exit 1
          }
          
          # Test 2: Can Gradle parse the build files?
          echo ""
          echo "Test 2: Task List (tests build file parsing)"
          echo "=============================================="
          ./gradlew tasks 2>&1 | tee gradle-tasks.log || {
            echo "❌ CRITICAL: Gradle cannot parse build files!"
            echo ""
            echo "Extracting error from output:"
            grep -i "error\|exception\|failed\|could not" gradle-tasks.log | head -20
            
            # Common error patterns
            if grep -q "Could not compile build file" gradle-tasks.log; then
              echo ""
              echo "BUILD FILE COMPILATION ERROR DETECTED"
              grep -B5 -A5 "Could not compile build file" gradle-tasks.log
            fi
            
            if grep -q "Namespace not specified" gradle-tasks.log; then
              echo ""
              echo "NAMESPACE ERROR DETECTED"
              echo "Add namespace to android/app/build.gradle:"
              echo "android {"
              echo "    namespace 'com.babelwords.app'"
              echo "    ..."
              echo "}"
            fi
            
            exit 1
          }
          
          # Test 3: Check dependencies
          echo ""
          echo "Test 3: Dependency Resolution Check"
          echo "===================================="
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath 2>&1 | head -100 || {
            echo "⚠️ WARNING: Could not resolve dependencies"
            echo "This might indicate repository or network issues"
          }
          
          echo ""
          echo "✅ Pre-build diagnostic complete"

      - name: Setup Signing Configuration
        run: |
          echo "=== SETTING UP SIGNING CONFIGURATION ==="
          
          cd android/app
          
          # Handle release keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Creating release keystore from GitHub secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore && {
              echo "✅ Release keystore created from secret"
              
              # Verify keystore is valid
              keytool -list -v -keystore release.keystore \
                      -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                      -alias "$ANDROID_KEY_ALIAS" 2>&1 | head -10 && \
                echo "✅ Release keystore verified" || \
                echo "⚠️ Could not verify keystore - may cause signing issues"
            } || {
              echo "❌ Failed to decode keystore from secret"
              exit 1
            }
          else
            echo "❌ No release keystore secret found - release build will fail"
            echo "Please add ANDROID_KEYSTORE_BASE64 secret to repository"
            exit 1
          fi
          
          # Verify keystores
          echo ""
          echo "Keystore files:"
          ls -lh *.keystore 2>/dev/null || echo "No keystore files found"
          
          echo "✅ Signing configuration complete"

      - name: Setup Firebase google-services.json
        run: |
          echo "=== SETTING UP FIREBASE CONFIG ==="
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json && {
              BYTES=$(wc -c < android/app/google-services.json)
              echo "✅ Wrote android/app/google-services.json ($BYTES bytes) — Firebase will be ENABLED"
              # Sanity check: must be valid JSON containing the expected package name.
              if grep -q '"package_name": "com.babelwords.app"' android/app/google-services.json; then
                echo "✅ google-services.json references com.babelwords.app"
              else
                echo "⚠️ google-services.json does NOT list com.babelwords.app — Firebase config may be wrong."
              fi
            } || {
              echo "❌ Failed to decode GOOGLE_SERVICES_JSON_BASE64"
              exit 1
            }
          else
            echo "ℹ️ GOOGLE_SERVICES_JSON_BASE64 not set — building WITHOUT Firebase (Crashlytics/Analytics)."
            echo "   Add the secret to enable Firebase. The build will still succeed without it."
          fi

      - name: Clean Previous Builds and Refresh Dependencies
        run: |
          echo "=== CLEANING PREVIOUS BUILDS AND REFRESHING DEPENDENCIES ==="
          cd android
          
          # Clean build directories
          rm -rf app/build/outputs/bundle 2>/dev/null || true
          rm -rf app/build/intermediates/bundle 2>/dev/null || true
          
          # Clean Gradle caches for play-services to force fresh download
          echo "Cleaning cached play-services dependencies..."
          find ~/.gradle/caches -name "*play-services-measurement*" -type d -exec rm -rf {} + 2>/dev/null || true
          find ~/.gradle/caches -name "*play-services-ads*" -type d -exec rm -rf {} + 2>/dev/null || true
          find ~/.gradle/caches/transforms-* -name "*play-services*" -type d -exec rm -rf {} + 2>/dev/null || true
          
          ./gradlew clean --no-daemon --stacktrace --refresh-dependencies || echo "Clean completed with warnings"
          echo "✅ Build cleaned and dependencies refreshed"

      - name: Build Release AAB with Enhanced Diagnostics
        id: build_aab
        run: |
          echo "=== BUILDING RELEASE AAB WITH ENHANCED DIAGNOSTICS ==="
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Debug Mode: $DEBUG_MODE"
          echo ""
          
          # Export keystore credentials
          export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
          export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
          
          cd android
          
          # Determine verbosity based on debug mode
          if [ "$DEBUG_MODE" = "true" ]; then
            GRADLE_FLAGS="--info --stacktrace"
            echo "Running in DEBUG mode with verbose output"
          else
            GRADLE_FLAGS="--stacktrace"
            echo "Running in NORMAL mode"
          fi
          
          # Run the bundle build with comprehensive error capture
          echo "Executing: ./gradlew bundleRelease assembleRelease $GRADLE_FLAGS"
          echo ""
          
          # Pass REAL_ADS_ON_TEST_LAB if the workflow input is set (one-off fill check only)
          if [ "${{ github.event.inputs.real_ads_on_test_lab }}" = "true" ]; then
            echo "⚠️ REAL_ADS_ON_TEST_LAB=true — Test Lab will use REAL creatives (not test). One-off only."
            EXTRA_PROPS="-PREAL_ADS_ON_TEST_LAB=true"
          else
            EXTRA_PROPS=""
          fi

          ./gradlew bundleRelease assembleRelease \
            --no-daemon \
            --no-build-cache \
            --no-parallel \
            --refresh-dependencies \
            $GRADLE_FLAGS \
            -Pandroid.injected.version.code=$VERSION_CODE \
            -Pandroid.injected.version.name=$VERSION_NAME \
            $EXTRA_PROPS \
            2>&1 | tee build-output.log || BUILD_FAILED=true
          
          if [ "$BUILD_FAILED" = "true" ]; then
            echo ""
            echo "❌ BUILD FAILED - Analyzing output..."
            echo ""
            
            # Extract error information
            echo "=== ERROR ANALYSIS ==="
            
            # Look for specific error patterns
            if grep -q "Could not compile build file" build-output.log; then
              echo "🔴 BUILD FILE COMPILATION ERROR:"
              grep -B3 -A3 "Could not compile build file" build-output.log
            fi
            
            if grep -q "buildConfigField" build-output.log && grep -q "expecting" build-output.log; then
              echo "🔴 BUILDCONFIGFIELD SYNTAX ERROR:"
              grep -B2 -A2 "buildConfigField" build-output.log | head -15
            fi
            
            if grep -q "Namespace not specified" build-output.log; then
              echo "🔴 NAMESPACE ERROR:"
              grep -B2 -A2 "Namespace not specified" build-output.log
            fi
            
            if grep -q "package does not exist" build-output.log; then
              echo "🔴 PACKAGE STRUCTURE ERROR:"
              grep -B2 -A2 "package does not exist" build-output.log | head -15
            fi
            
            # General error search
            echo ""
            echo "=== ALL ERRORS FOUND ==="
            grep -i "error\|failed\|exception" build-output.log | grep -v "Error Prone" | head -30
            
            echo ""
            echo "=== LAST 100 LINES OF OUTPUT ==="
            tail -100 build-output.log
            
            exit 1
          fi
          
          # Verify AAB was created
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
          
          if [ -n "$AAB_PATH" ]; then
            echo ""
            echo "✅ Release AAB build successful!"
            echo "Location: $AAB_PATH"
            echo "Size: $(du -h "$AAB_PATH" | cut -f1)"
            
            # Verify AAB contents if bundletool is available
            if [ -f $ANDROID_HOME/build-tools/35.0.0/lib/bundletool-all*.jar ]; then
              echo ""
              echo "Verifying AAB contents..."
              java -jar $ANDROID_HOME/build-tools/35.0.0/lib/bundletool-all*.jar validate --bundle="$AAB_PATH" 2>/dev/null && \
                echo "✅ AAB validation passed" || \
                echo "⚠️ Could not validate AAB with bundletool"
            fi
          else
            echo "❌ Release AAB not found in expected location"
            echo "Checking entire build directory:"
            find app/build -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No output files found"
            exit 1
          fi

          # Verify release APK was created
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)

          if [ -n "$APK_PATH" ]; then
            echo ""
            echo "✅ Release APK build successful!"
            echo "Location: $APK_PATH"
            echo "Size: $(du -h "$APK_PATH" | cut -f1)"
          else
            echo "❌ Release APK not found in expected location"
            echo "Checking for any APKs:"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi

      - name: Verify AdMob App ID in Compiled Manifest
        if: success()
        run: |
          echo "=== VERIFYING ADMOB APP ID IN COMPILED MANIFEST ==="
          
          cd android
          
          # Build a debug APK to verify the manifest (faster than extracting from AAB)
          echo "Building debug APK for manifest verification..."
          ./gradlew assembleDebug --no-daemon -q 2>/dev/null || true
          
          # Find the debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          
          if [ -n "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            echo ""
            echo "=== AdMob Application ID Check ==="
            
            # Use aapt to dump the manifest and check for AdMob App ID
            AAPT_PATH="$ANDROID_HOME/build-tools/34.0.0/aapt"
            if [ ! -f "$AAPT_PATH" ]; then
              AAPT_PATH="$ANDROID_HOME/build-tools/35.0.0/aapt"
            fi
            
            if [ -f "$AAPT_PATH" ]; then
              echo "Using aapt: $AAPT_PATH"
              echo ""
              
              # Extract and display AdMob meta-data
              ADMOB_CHECK=$("$AAPT_PATH" dump xmltree "$DEBUG_APK" AndroidManifest.xml 2>/dev/null | grep -A2 "com.google.android.gms.ads.APPLICATION_ID" || echo "NOT_FOUND")
              
              if [ "$ADMOB_CHECK" != "NOT_FOUND" ]; then
                echo "✅ AdMob Application ID found in compiled manifest:"
                echo "$ADMOB_CHECK"
                echo ""
                
                # Verify the actual value
                if echo "$ADMOB_CHECK" | grep -q "ca-app-pub-9991891515643313"; then
                  echo "✅ AdMob App ID correctly set to: ca-app-pub-9991891515643313~9480266747"
                else
                  echo "⚠️ WARNING: AdMob App ID may not be the expected value!"
                  echo "Expected: ca-app-pub-9991891515643313~9480266747"
                fi
              else
                echo "❌ AdMob Application ID NOT found in compiled manifest!"
                echo "This may cause ad loading failures."
                echo ""
                echo "Full manifest meta-data entries:"
                "$AAPT_PATH" dump xmltree "$DEBUG_APK" AndroidManifest.xml 2>/dev/null | grep -A2 "meta-data" | head -30
              fi
            else
              echo "⚠️ aapt not found, skipping manifest verification"
            fi
          else
            echo "⚠️ Debug APK not found, skipping manifest verification"
          fi
          
          echo ""
          echo "✅ AdMob verification step complete"

      - name: Verify ANR Prevention Flags in Merged Manifest
        if: success()
        run: |
          echo "=== VERIFYING ANR PREVENTION FLAGS ==="
          cd android
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::Merged manifest not found at $MANIFEST (skipping flag verification)"
            exit 0
          fi
          if ! grep -q 'OPTIMIZE_INITIALIZATION' "$MANIFEST"; then
            echo "::error::OPTIMIZE_INITIALIZATION flag missing from manifest"
            exit 1
          fi
          if ! grep -q 'OPTIMIZE_AD_LOADING' "$MANIFEST"; then
            echo "::error::OPTIMIZE_AD_LOADING flag missing from manifest"
            exit 1
          fi
          echo "✅ ANR prevention flags verified in merged manifest"

      - name: Post-Build Diagnostic (On Failure)
        if: failure()
        run: |
          echo "=== POST-BUILD FAILURE DIAGNOSTIC ==="
          
          cd android
          
          echo "1. Checking for partial build artifacts..."
          find app/build -type f -name "*.class" 2>/dev/null | head -5 && echo "Some classes were compiled" || echo "No compiled classes found"
          
          echo ""
          echo "2. Checking for generated files..."
          if [ -d app/build/generated ]; then
            echo "Generated files found:"
            find app/build/generated -type f | head -10
          else
            echo "No generated files - build failed early"
          fi
          
          echo ""
          echo "3. Checking Gradle cache for issues..."
          if [ -d .gradle ]; then
            find .gradle -name "*.lock" -o -name "*.log" 2>/dev/null | head -10
          fi
          
          echo ""
          echo "4. System resources at failure time..."
          df -h | head -5
          echo ""
          
          if command -v free &> /dev/null; then
            free -h
          else
            vm_stat | head -10
          fi
          
          echo ""
          echo "5. Creating diagnostic archive..."
          tar -czf /tmp/build-diagnostic.tar.gz \
            app/build.gradle \
            build.gradle \
            gradle.properties \
            settings.gradle \
            app/src/main/AndroidManifest.xml \
            build-output.log \
            gradle-tasks.log \
            2>/dev/null || echo "Could not create diagnostic archive"
          
          echo ""
          echo "=== DIAGNOSTIC SUMMARY ==="
          echo "Build failed at: $(date)"
          echo "Version attempted: $VERSION_NAME ($VERSION_CODE)"
          echo "Diagnostic archive: /tmp/build-diagnostic.tar.gz"
          echo ""
          echo "Common fixes to try:"
          echo "1. Check namespace is defined in app/build.gradle"
          echo "2. Verify all buildConfigField values have escaped quotes"
          echo "3. Ensure package names match across all files"
          echo "4. Check gradle.properties for syntax errors"
          echo "5. Verify source files are in correct package directory"

      - name: Collect Build Outputs
        if: always()
        id: build_outputs
        run: |
          echo "=== COLLECTING BUILD OUTPUTS ==="
          
          # Search for AAB in android/app/build/outputs
          RELEASE_AAB=$(find android/app/build/outputs -name "*.aab" -type f 2>/dev/null | head -n 1 || echo "")
          
          if [ -n "$RELEASE_AAB" ]; then
              # Copy AAB to a standardized BabelWords name and publish that path
              STD_AAB="android/app/build/outputs/bundle/release/babelwords-v${VERSION_NAME}-${VERSION_CODE}.aab"
              cp "$RELEASE_AAB" "$STD_AAB" 2>/dev/null || STD_AAB="$RELEASE_AAB"
              echo "✅ Found AAB: $STD_AAB"
              echo "release_aab=$STD_AAB" >> $GITHUB_OUTPUT
              echo "status=success" >> $GITHUB_OUTPUT
              echo "error_summary=Build successful" >> $GITHUB_OUTPUT
          else
              echo "❌ No AAB found"
              echo "release_aab=" >> $GITHUB_OUTPUT
              echo "status=failed" >> $GITHUB_OUTPUT
              
              # Try to extract error summary
              if [ -f android/build-output.log ]; then
                ERROR_SUMMARY=$(grep -i "error\|failed" android/build-output.log | head -1 || echo "Unknown build error")
                echo "error_summary=$ERROR_SUMMARY" >> $GITHUB_OUTPUT
              else
                echo "error_summary=Build failed - no output captured" >> $GITHUB_OUTPUT
              fi
          fi

          # Search for release APK and publish a standardized BabelWords name
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -n 1 || echo "")

          if [ -n "$RELEASE_APK" ]; then
              STD_APK="android/app/build/outputs/apk/release/babelwords-v${VERSION_NAME}-${VERSION_CODE}.apk"
              cp "$RELEASE_APK" "$STD_APK" 2>/dev/null || STD_APK="$RELEASE_APK"
              echo "✅ Found APK: $STD_APK"
              echo "release_apk=$STD_APK" >> $GITHUB_OUTPUT
          else
              echo "❌ No release APK found"
              echo "release_apk=" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release AAB
        if: always() && steps.build_outputs.outputs.release_aab != ''
        uses: actions/upload-artifact@v4
        with:
          name: babelwords-bundle-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ steps.build_outputs.outputs.release_aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: always() && steps.build_outputs.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: babelwords-apk-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ steps.build_outputs.outputs.release_apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            android/build-output.log
            android/gradle-tasks.log
            /tmp/build-diagnostic.tar.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: env.CREATE_RELEASE == 'true' && steps.build_outputs.outputs.release_aab != '' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: BabelWords v${{ env.VERSION_NAME }} - Build ${{ github.run_number }}
          body: |
            ## BabelWords v${{ env.VERSION_NAME }}
            
            - **Build**: #${{ github.run_number }} | Code ${{ env.VERSION_CODE }}
            - **AAB**: Ready for Play Store upload
            - **APK**: Direct-install / sideload build
            - Voice translation (36+ languages), AdMob ads, GDPR compliant
          files: |
            ${{ steps.build_outputs.outputs.release_aab }}
            ${{ steps.build_outputs.outputs.release_apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Build Summary
        if: always()
        run: |
          echo ""
          echo "========================================="
          echo "         BUILD SUMMARY REPORT"
          echo "========================================="
          echo ""
          echo "Build Status: ${{ steps.build_outputs.outputs.status }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "Version: ${{ env.VERSION_NAME }} (Code: ${{ env.VERSION_CODE }})"
          echo "Debug Mode: ${{ env.DEBUG_MODE }}"
          echo ""
          
          if [ "${{ steps.build_outputs.outputs.status }}" = "success" ]; then
            echo "✅ BUILD SUCCESSFUL"
            echo ""
            echo "AAB Location:"
            echo "  ${{ steps.build_outputs.outputs.release_aab }}"
            echo "APK Location:"
            echo "  ${{ steps.build_outputs.outputs.release_apk }}"
            echo ""
            echo "Next Steps:"
            echo "  1. Download AAB artifact from GitHub Actions"
            echo "  2. Upload to Google Play Console"
            echo "  3. Play Store will generate optimized APKs"
          else
            echo "❌ BUILD FAILED"
            echo ""
            echo "Error Summary: ${{ steps.build_outputs.outputs.error_summary }}"
            echo ""
            echo "Diagnostic Information:"
            echo "  - Check the 'Deep Configuration Analysis' step for misconfigurations"
            echo "  - Review 'Pre-Build Gradle Diagnostic' for parsing errors"
            echo "  - Look at 'Build Release AAB' for the actual error"
            echo ""
            echo "Common Solutions:"
            echo "  1. Ensure namespace is defined in app/build.gradle"
            echo "  2. Fix buildConfigField string escaping"
            echo "  3. Align package names across all files"
            echo "  4. Check gradle.properties syntax"
            echo "  5. Verify Java source file locations"
          fi
          echo ""
          echo "========================================="

  # ---------------------------------------------------------------------------
  # Firebase Test Lab — runs the release APK on a real Google cloud phone,
  # records video + Logcat, and uploads them as a downloadable artifact.
  # Gated: only runs on manual dispatch with run_firebase_test = true.
  # Requires repo secrets GCP_SA_KEY (service-account JSON) and GCP_PROJECT_ID,
  # plus Blaze billing on the GCP project (Test Lab free quota is console-only).
  # ---------------------------------------------------------------------------
  firebase-test-lab:
    name: Firebase Test Lab (Robo + Logcat + Video)
    needs: build-android-aab
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_firebase_test == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download Release APK
        id: download_apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: babelwords-apk-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: firebase-apk

      - name: Locate APK
        id: locate_apk
        run: |
          APK=$(find firebase-apk -name "*.apk" -type f 2>/dev/null | head -n 1 || echo "")
          if [ -z "$APK" ]; then
            echo "⚠️ No APK artifact found — skipping Firebase Test Lab. The AAB build is unaffected."
            echo "apk=" >> "$GITHUB_OUTPUT"
          else
            echo "✅ APK located: $APK"
            echo "apk=$APK" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.locate_apk.outputs.apk != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.locate_apk.outputs.apk != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Robo test (auto-launches app, records video)
        if: steps.locate_apk.outputs.apk != ''
        run: |
          set +e
          APK="${{ steps.locate_apk.outputs.apk }}"
          echo "Running Firebase Test Lab Robo test on: $APK"
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=MediumPhone.arm,version=33,locale=en_US,orientation=portrait \
            --timeout 180s \
            --record-video \
            --project "${{ secrets.GCP_PROJECT_ID }}" 2>&1 | tee firebase-run.log
          echo "gcloud exit handled; results parsed in next step."

      - name: Pull Logcat + video from results bucket
        if: always() && steps.locate_apk.outputs.apk != ''
        run: |
          # IMPORTANT: do NOT pass --results-bucket. Test Lab auto-creates a writable
          # test-lab-* bucket; we parse its gs:// path out of gcloud's own output.
          RAW=$(grep -oE 'storage/browser/[^[:space:]"]+' firebase-run.log | head -n 1 || echo "")
          if [ -z "$RAW" ]; then
            echo "⚠️ Could not parse a results-bucket path from gcloud output."
            exit 0
          fi
          # gcloud prints the URL wrapped in brackets ("...qtNd/]"), so strip a trailing
          # ']' (and anything after) and any query string before building the gs:// path —
          # otherwise the path is malformed and nothing copies.
          GS_PATH="gs://$(echo "$RAW" | sed 's#storage/browser/##; s#].*##; s#?.*##; s#/*$##')"
          echo "Results path: $GS_PATH"
          mkdir -p firebase-results
          gsutil -m cp -r "${GS_PATH}/**" firebase-results/ 2>/dev/null \
            || gsutil -m cp -r "${GS_PATH}/*" firebase-results/ 2>/dev/null \
            || echo "⚠️ Could not copy results (check service-account storage permissions)."

      - name: Scan Logcat for the ad funnel
        if: always() && steps.locate_apk.outputs.apk != ''
        run: |
          LOGCAT=$(find firebase-results -name "logcat*" -type f 2>/dev/null | head -n 1 || echo "")
          echo "==================== AD FUNNEL ===================="
          if [ -n "$LOGCAT" ]; then
            echo "--- Test Lab detection ---"
            grep -E "Firebase Test Lab detected|test-device registration FAILED" "$LOGCAT" || echo "(none)"
            echo "--- LOADED events ---"
            grep -E "LOADED" "$LOGCAT" || echo "(none)"
            echo "--- IMPRESSION events ---"
            grep -E "IMPRESSION" "$LOGCAT" || echo "(none)"
            echo "--- Show attempts ---"
            grep -E "Attempting to show|Auto-show" "$LOGCAT" || echo "(none)"
            echo "--- Guard rejections ---"
            grep -E "cannot show|Activity not resumed|App in background|Already showing|stale - reloading" "$LOGCAT" || echo "(none)"
            echo "--- FailedToShow ---"
            grep -E "FailedToShow|FAILED|watchdog" "$LOGCAT" || echo "(none)"
          else
            echo "(no logcat file found in results)"
          fi
          echo "==================================================="

      - name: Stage colon-free artifact folder
        if: always() && steps.locate_apk.outputs.apk != ''
        run: |
          # upload-artifact@v4 rejects any path containing ':' and Test Lab folders are
          # timestamped (e.g. 2026-06-22_21:12:16). Flatten the useful files into a
          # colon-free folder and upload that instead of the raw results tree.
          mkdir -p firebase-artifact
          cp firebase-run.log firebase-artifact/firebase-run.log 2>/dev/null || true
          LOGCAT=$(find firebase-results -name "logcat*" -type f 2>/dev/null | head -n 1 || echo "")
          VIDEO=$(find firebase-results -name "video.mp4" -type f 2>/dev/null | head -n 1 || echo "")
          [ -n "$LOGCAT" ] && cp "$LOGCAT" firebase-artifact/logcat.txt || true
          [ -n "$VIDEO" ] && cp "$VIDEO" firebase-artifact/video.mp4 || true
          echo "Artifact contents:"
          ls -la firebase-artifact

      - name: Verify ad impression was served (fail CI if missing)
        if: always() && steps.locate_apk.outputs.apk != ''
        run: |
          echo "========================================="
          echo "  AD SERVING VERIFICATION"
          echo "========================================="
          LOGCAT=$(find firebase-results -name "logcat*" -type f 2>/dev/null | head -n 1 || echo "")
          if [ -z "$LOGCAT" ]; then
            echo "::error::No logcat file — cannot verify ad serving."
            exit 1
          fi
          PASS=1
          # 0) Fail if real-ad override was active (should never happen on default runs)
          if grep -qE "REAL_ADS_ON_TEST_LAB is true" "$LOGCAT"; then
            echo "::error::Real-ad override ACTIVE — this run is not safe for standard verification."
            PASS=0
          fi
          # 1) SAFETY GATE: test-device registration must have applied
          if grep -qE "test-device registration FAILED" "$LOGCAT"; then
            echo "::error::Test-device registration FAILED — auto-show suppressed."
            PASS=0
          elif grep -qE "Firebase Test Lab detected" "$LOGCAT"; then
            echo "✅ Test Lab device registration applied."
          else
            echo "::error::Test Lab detection NOT found — registration did not apply."
            PASS=0
          fi
          # 2) REQUIRED: at least one impression
          if grep -qE "IMPRESSION" "$LOGCAT"; then
            echo "✅ Ad impression confirmed:"
            grep -E "IMPRESSION" "$LOGCAT" | head
          else
            echo "::error::No ad IMPRESSION in Logcat — no ad rendered."
            PASS=0
          fi
          if [ "$PASS" -ne 1 ]; then
            echo "❌ Ad serving verification FAILED."
            exit 1
          fi
          echo "✅ Ad serving verification PASSED."

      - name: Upload Firebase Test Lab artifact
        if: always() && steps.locate_apk.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: firebase-testlab-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: firebase-artifact
          if-no-files-found: warn
          retention-days: 14
