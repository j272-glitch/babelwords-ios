name: Nuclear Gradle Fix

on:
  workflow_dispatch:
#  push:
#    paths:
#      - 'android/**'

jobs:
  nuclear-fix:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Nuclear Cache Destruction
      run: |
        echo "=== NUCLEAR CACHE DESTRUCTION ==="
        
        # Destroy ALL possible Gradle cache locations
        sudo rm -rf /home/runner/.gradle/
        sudo rm -rf /root/.gradle/
        sudo rm -rf ~/.gradle/
        sudo rm -rf $HOME/.gradle/
        sudo rm -rf /tmp/.gradle*
        sudo rm -rf /var/tmp/.gradle*
        sudo rm -rf /opt/.gradle*
        
        # Clear any system-wide Gradle configuration
        sudo rm -rf /etc/gradle/
        sudo rm -rf /usr/share/gradle/
        
        # Nuclear option: kill any running Gradle processes
        sudo pkill -f gradle || true
        sudo pkill -f java || true
        
        # Clear environment variables that might contain cached paths
        unset GRADLE_OPTS
        unset GRADLE_USER_HOME
        unset GRADLE_HOME
        unset ORG_GRADLE_JAVA_HOME
        
        echo "Nuclear cache destruction complete"
        
    - name: Force Fresh System Environment
      run: |
        echo "=== FORCE FRESH SYSTEM ENVIRONMENT ==="
        
        # Create completely isolated environment
        export GRADLE_USER_HOME="/tmp/nuclear-gradle-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Force explicit Java path in ALL possible ways
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8 -Xmx4g"
        export JAVA_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
        
        # Create fresh gradle.properties with explicit overrides
        cat > "$GRADLE_USER_HOME/gradle.properties" << 'EOF'
        org.gradle.daemon=false
        org.gradle.caching=false
        org.gradle.parallel=false
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        EOF
        
        # Set for subsequent steps
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=$GRADLE_OPTS" >> $GITHUB_ENV
        echo "JAVA_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
        
        echo "Environment variables set:"
        echo "  JAVA_HOME: $JAVA_HOME"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"
        
    - name: Nuclear Wrapper Regeneration
      working-directory: android
      run: |
        echo "=== NUCLEAR WRAPPER REGENERATION ==="
        
        # Complete wrapper annihilation
        rm -rf gradle/
        rm -rf gradlew*
        rm -rf .gradle/
        rm -rf build/
        rm -rf */build/
        
        # Download Gradle manually and create wrapper
        curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
        unzip -q /tmp/gradle.zip -d /tmp/
        
        # Use downloaded Gradle to create wrapper
        /tmp/gradle-8.3/bin/gradle wrapper --gradle-version 8.3 --no-daemon
        chmod +x gradlew
        
        # Verify wrapper was created correctly
        ls -la gradlew*
        ls -la gradle/wrapper/
        
        echo "Nuclear wrapper regeneration complete"
        
    - name: Nuclear Build with Explicit Overrides
      working-directory: android
      run: |
        echo "=== NUCLEAR BUILD WITH EXPLICIT OVERRIDES ==="
        
        # Set explicit environment for this step
        export GRADLE_USER_HOME="/tmp/nuclear-gradle-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Multiple layers of Java home specification
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8 -Xmx4g -Dorg.gradle.daemon=false"
        export JAVA_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"
        
        echo "Build environment:"
        echo "  JAVA_HOME: $JAVA_HOME"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"
        
        # Create isolated gradle.properties for this build
        cat > "$GRADLE_USER_HOME/gradle.properties" << 'EOF'
        org.gradle.daemon=false
        org.gradle.caching=false
        org.gradle.parallel=false
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        EOF
        
        # Test with explicit command line override
        echo "Testing Gradle version with explicit Java home..."
        ./gradlew --version --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
        
        # Build with multiple explicit overrides
        echo "Building APK with nuclear overrides..."
        ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace \
          --info \
          -Dorg.gradle.java.home="$JAVA_HOME" \
          -Dfile.encoding=UTF-8 \
          -Xmx4g
        
        # Find and copy APK
        APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "lingualink-nuclear-fix.apk"
          echo "Nuclear APK built successfully: lingualink-nuclear-fix.apk"
          echo "Size: $(stat -c%s lingualink-nuclear-fix.apk) bytes"
        else
          echo "Nuclear build failed - APK not found"
          
          echo "Debugging information:"
          echo "Build outputs:"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "Build directories:"
          find . -name "build" -type d 2>/dev/null || echo "No build directories"
          echo "Gradle daemon status:"
          ./gradlew --status || echo "Cannot check status"
          
          exit 1
        fi
        
    - name: Upload Nuclear APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-nuclear-fix-apk
        path: android/lingualink-nuclear-fix.apk
        retention-days: 30
        
    - name: Nuclear Fix Summary
      if: always()
      run: |
        echo "=== NUCLEAR FIX SUMMARY ==="
        
        if [ -f "android/lingualink-nuclear-fix.apk" ]; then
          echo "SUCCESS: Nuclear approach resolved the cached Java path issue"
          echo "APK generated with complete cache destruction and explicit overrides"
          echo "Size: $(stat -c%s android/lingualink-nuclear-fix.apk) bytes"
        else
          echo "FAILURE: Nuclear approach could not resolve the issue"
          echo "The cached Java path problem may require manual repository reset"
        fi
        
        echo ""
        echo "Nuclear actions performed:"
        echo "- Destroyed all possible Gradle cache locations"
        echo "- Killed all Gradle/Java processes"
        echo "- Created completely isolated environment"
        echo "- Used explicit command-line Java home override"
        echo "- Disabled all caching mechanisms"
        echo ""
        echo "If this fails, the issue is system-level and requires:"
        echo "1. Manual repository cache reset"
        echo "2. Different runner environment"
        echo "3. Alternative build approach"
