name: TestRigor Build v69

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'both'
        type: choice
        options:
          - debug
          - release  
          - both
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Gradle settings optimized for CI
  GRADLE_OPTS: -Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
  # Don't override the gradle.properties settings we've carefully configured
  JAVA_OPTS: -XX:+UseParallelGC

jobs:
  build-testrigor:
    name: Build TestRigor-Compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 25.2.9519653
          
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Project
        run: |
          echo "=== PROJECT SETUP ==="
          
          # Copy Android project files if they're in a subdirectory
          if [ -d "android" ]; then
            echo "Copying Android project files..."
            cp -r android/* .
          fi
          
          # Create local.properties for SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # DON'T override gradle.properties - use the one we configured
          # Just verify critical settings are present
          echo "Verifying gradle.properties..."
          if ! grep -q "android.useLegacyPackaging=true" gradle.properties; then
            echo "WARNING: android.useLegacyPackaging not found in gradle.properties!"
          fi
          
          # Ensure gradle wrapper is executable
          chmod +x gradlew
          
          # Update gradle wrapper to match our configuration
          echo "Updating Gradle wrapper..."
          ./gradlew wrapper --gradle-version=8.7 --distribution-type=bin
          
          echo "✅ Project setup complete"

      - name: Verify TestRigor Configuration
        run: |
          echo "=== VERIFYING TESTRIGOR CONFIGURATION ==="
          
          # Run our custom verification task
          ./gradlew verifyTestRigorCompatibility --stacktrace
          
          # Check critical files exist
          echo ""
          echo "Checking configuration files..."
          for file in "build.gradle" "app/build.gradle" "settings.gradle" "gradle.properties"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing!"
            fi
          done

      - name: Clean Build Environment
        run: |
          echo "=== CLEANING BUILD ENVIRONMENT ==="
          
          # Clean all build artifacts
          ./gradlew clean --no-daemon
          
          # Remove any cached builds that might have corrupted manifests
          rm -rf app/build/
          rm -rf build/
          rm -rf ~/.gradle/caches/transforms-*
          
          echo "✅ Build environment cleaned"

      - name: Build TestRigor-Compatible APKs
        run: |
          echo "=== BUILDING TESTRIGOR-COMPATIBLE APKS ==="
          
          BUILD_TYPE="${{ inputs.build_type || 'both' }}"
          echo "Build type: $BUILD_TYPE"
          
          # Use our custom TestRigor build task
          if [ "$BUILD_TYPE" == "both" ] || [ "$BUILD_TYPE" == "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew :app:assembleDebug --stacktrace
          fi
          
          if [ "$BUILD_TYPE" == "both" ] || [ "$BUILD_TYPE" == "release" ]; then
            echo "Building Release APK..."
            ./gradlew :app:assembleRelease --stacktrace
            
            # Also build AAB for release
            echo "Building Release Bundle..."
            ./gradlew :app:bundleRelease --stacktrace || true
          fi
          
          echo "✅ Build complete"

      - name: Validate APK Compatibility
        run: |
          echo "=== VALIDATING APK COMPATIBILITY ==="
          
          # Find all APKs
          apk_files=$(find app/build/outputs -name "*.apk" -type f 2>/dev/null || true)
          
          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found!"
            exit 1
          fi
          
          # Validate each APK
          for apk in $apk_files; do
            echo ""
            echo "Validating: $apk"
            
            # Check file size
            size=$(stat -c%s "$apk" 2>/dev/null || echo "0")
            echo "  Size: $((size / 1024 / 1024)) MB"
            
            # Check if manifest is uncompressed (critical for TestRigor)
            if unzip -l "$apk" | grep -q "AndroidManifest.xml.*stor"; then
              echo "  ✅ Manifest is uncompressed (stored)"
            else
              echo "  ⚠️  Manifest might be compressed"
            fi
            
            # Use aapt2 from SDK to validate
            if [ -f "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
              if $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$apk" > /tmp/aapt_output.txt 2>&1; then
                echo "  ✅ AAPT2 validation passed"
                grep -E "package:|versionCode|versionName" /tmp/aapt_output.txt | head -3
              else
                echo "  ❌ AAPT2 validation failed"
                if grep -q "chunk type:16188" /tmp/aapt_output.txt; then
                  echo "  🚨 CRITICAL: Chunk type:16188 error detected!"
                  echo "  This means the gradle configuration is not working correctly."
                  cat /tmp/aapt_output.txt
                fi
              fi
            fi
            
            # Copy to standardized name
            if [[ "$apk" == *"debug"* ]]; then
              cp "$apk" "app/build/outputs/LinguaLink-debug-v69.apk"
              echo "  📦 Created: LinguaLink-debug-v69.apk"
            elif [[ "$apk" == *"release"* ]]; then
              cp "$apk" "app/build/outputs/LinguaLink-release-v69.apk"
              echo "  📦 Created: LinguaLink-release-v69.apk"
            fi
          done
          
          # Check for AABs
          aab_files=$(find app/build/outputs -name "*.aab" -type f 2>/dev/null || true)
          for aab in $aab_files; do
            echo ""
            echo "Found AAB: $aab"
            size=$(stat -c%s "$aab" 2>/dev/null || echo "0")
            echo "  Size: $((size / 1024 / 1024)) MB"
            cp "$aab" "app/build/outputs/LinguaLink-release-v69.aab"
            echo "  📦 Created: LinguaLink-release-v69.aab"
          done

      - name: Upload TestRigor Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testrigor-artifacts-v69-${{ github.run_number }}
          path: |
            app/build/outputs/LinguaLink-*.apk
            app/build/outputs/LinguaLink-*.aab
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "========================================="
          echo "TESTRIGOR BUILD SUMMARY"
          echo "========================================="
          echo ""
          echo "Configuration:"
          echo "  Gradle Version: $(./gradlew --version | grep Gradle | awk '{print $2}')"
          echo "  AGP Version: 8.0.2 (from build.gradle)"
          echo "  JDK Version: $(java -version 2>&1 | head -1)"
          echo "  Build Type: ${{ inputs.build_type || 'both' }}"
          echo ""
          echo "TestRigor Settings Applied:"
          echo "  ✓ Legacy DEX packaging enabled"
          echo "  ✓ Resource optimization disabled"
          echo "  ✓ PNG crunching disabled"
          echo "  ✓ Manifest compression disabled"
          echo ""
          echo "Generated Artifacts:"
          find app/build/outputs -name "LinguaLink-*.apk" -o -name "LinguaLink-*.aab" 2>/dev/null | while read file; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || echo "0")
              echo "  - $(basename $file) ($((size / 1024 / 1024)) MB)"
            fi
          done
          echo ""
          
          # Final status
          if find app/build/outputs -name "LinguaLink-*.apk" 2>/dev/null | grep -q .; then
            echo "✅ BUILD SUCCESS - TestRigor-compatible APKs generated"
          else
            echo "❌ BUILD FAILED - No APKs generated"
            exit 1
          fi
          echo "========================================="
