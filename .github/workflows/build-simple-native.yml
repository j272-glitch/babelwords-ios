name: Simple Native Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Create minimal build.gradle
      working-directory: android
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            compileSdk 33
            namespace 'com.lingualink.translator'
            
            defaultConfig {
                applicationId "com.lingualink.translator"
                minSdk 21
                targetSdk 33
                versionCode 68
                versionName "1.0.68"
            }
            
            buildTypes {
                debug {
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
    - name: Create simple root build.gradle
      working-directory: android
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        
    - name: Build with system Gradle
      working-directory: android
      run: |
        gradle wrapper --gradle-version 7.6
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload simple APK
      uses: actions/upload-artifact@v4
      with:
        name: simple-native-apk
        path: android/app/build/outputs/apk/debug/*.apk