name: BabelWords iOS — Test Lab + XCUITest

on:
  workflow_dispatch:
    inputs:
      run_firebase_test:
        description: 'Run Firebase Test Lab on a real iOS device'
        required: false
        default: false
        type: boolean
      run_xcui_test:
        description: 'Run XCUITest on iOS simulator'
        required: false
        default: false
        type: boolean

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

jobs:
  build-ios:
    name: Build iOS App + XCUITest Runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "$GOOGLE_SERVICES_INFO_PLIST_BASE64" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
          echo "✅ Wrote GoogleService-Info.plist"
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler
          bundle install

      - name: Validate match secrets
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "Missing MATCH_PASSWORD or MATCH_GIT_BASIC_AUTHORIZATION"
            exit 1
          fi

      - name: Build ad-hoc IPA
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane build_adhoc

      - name: Build XCUITest runner
        if: github.event.inputs.run_firebase_test == 'true' || github.event.inputs.run_xcui_test == 'true'
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          bundle exec fastlane sync_signing_adhoc
          xcodebuild build-for-testing \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData
          cd DerivedData/Build/Products/Debug-iphoneos
          zip -r BabelWordsUITestsRunner.zip *

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: babelwords-ios-ipa
          path: ios/build/BabelWords.ipa
          if-no-files-found: error

      - name: Upload XCUITest runner
        if: github.event.inputs.run_firebase_test == 'true' || github.event.inputs.run_xcui_test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: babelwords-ios-xcui-runner
          path: ios/DerivedData/Build/Products/Debug-iphoneos/BabelWordsUITestsRunner.zip
          if-no-files-found: warn

  xcui-simulator:
    name: XCUITest on iOS Simulator
    needs: build-ios
    if: github.event.inputs.run_xcui_test == 'true'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "$GOOGLE_SERVICES_INFO_PLIST_BASE64" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Run XCUITest on simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcui-simulator-results
          path: ios/DerivedData/Logs/Test/
          if-no-files-found: warn

  firebase-test-lab-ios:
    name: Firebase Test Lab iOS Device Test
    needs: build-ios
    if: github.event.inputs.run_firebase_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download .ipa
        uses: actions/download-artifact@v4
        with:
          name: babelwords-ios-ipa
          path: ios-ipa

      - name: Download XCUITest runner
        uses: actions/download-artifact@v4
        with:
          name: babelwords-ios-xcui-runner
          path: ios-xcui

      - name: Decode GCP service account key
        id: gcp
        env:
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$GCP_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.gcp.outputs.key }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run iOS XCUITest on Firebase Test Lab
        run: |
          IPA=$(find ios-ipa -name "*.ipa" | head -n 1)
          TEST=$(find ios-xcui -name "BabelWordsUITestsRunner.zip" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "::error::No IPA found"
            exit 1
          fi
          if [ -z "$TEST" ]; then
            echo "::error::No XCUITest runner found"
            exit 1
          fi

          echo "IPA: $IPA"
          echo "TEST: $TEST"

          gcloud firebase test ios run \
            --type xctest \
            --app "$IPA" \
            --test "$TEST" \
            --device model=iphone14pro,version=26.0,locale=en_US,orientation=portrait \
            --timeout 10m \
            --record-video \
            --project "${GCP_PROJECT_ID}" 2>&1 | tee firebase-ios-run.log

      - name: Pull device logs and video from results bucket
        if: always()
        run: |
          RAW=$(grep -oE 'storage/browser/[^[:space:]"]+' firebase-ios-run.log | head -n 1 || echo "")
          if [ -z "$RAW" ]; then
            echo "⚠️ Could not parse results-bucket path"
            exit 0
          fi
          GS_PATH="gs://$(echo "$RAW" | sed 's#storage/browser/##; s#].*##; s#?.*##; s#/*$##')"
          echo "Results bucket: $GS_PATH"
          mkdir -p firebase-ios-results
          gsutil -m cp -r "${GS_PATH}/**" firebase-ios-results/ || \
            gsutil -m cp -r "${GS_PATH}/*" firebase-ios-results/ || \
            echo "⚠️ Could not copy results"

      - name: Scan iOS device log for ad markers
        if: always()
        run: |
          SYSLOG=$(find firebase-ios-results -name "*.log" -type f | head -n 1 || echo "")
          if [ -n "$SYSLOG" ]; then
            echo "--- Test Lab detection ---"
            grep -E "Firebase Test Lab detected|Test Lab|test-lab" "$SYSLOG" || echo "(none)"
            echo "--- Ad events ---"
            grep -E "IMPRESSION|Interstitial shown|interstitialShown|App Open shown|appOpenShown" "$SYSLOG" || echo "(none)"
          fi

      - name: Stage colon-free artifact
        if: always()
        run: |
          mkdir -p firebase-ios-artifact
          cp firebase-ios-run.log firebase-ios-artifact/ 2>/dev/null || true
          LOG=$(find firebase-ios-results -name "*.log" -type f | head -n 1 || echo "")
          VIDEO=$(find firebase-ios-results -name "*.mp4" -type f | head -n 1 || echo "")
          [ -n "$LOG" ] && cp "$LOG" firebase-ios-artifact/device-log.txt || true
          [ -n "$VIDEO" ] && cp "$VIDEO" firebase-ios-artifact/video.mp4 || true
          ls -la firebase-ios-artifact

      - name: Upload Firebase Test Lab iOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-testlab-ios
          path: firebase-ios-artifact
          if-no-files-found: warn
          retention-days: 14
