name: Android CI Complete APK Build Search

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release
        - both

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Java Path Detection & Configuration
      run: |
        echo "=== Java Path Detection & Configuration ==="
        
        # Method 1: Use setup-java JAVA_HOME if valid
        if [ -n "$JAVA_HOME" ] && [ -d "$JAVA_HOME" ] && [ -f "$JAVA_HOME/bin/java" ]; then
          VALID_JAVA_HOME="$JAVA_HOME"
          echo "✅ Using setup-java JAVA_HOME: $JAVA_HOME"
        else
          echo "❌ setup-java JAVA_HOME invalid or missing"
          
          # Method 2: Auto-detect Java installations
          echo "🔍 Auto-detecting Java installations..."
          java_candidates=(
            "/usr/lib/jvm/temurin-17-jdk-amd64"
            "/usr/lib/jvm/java-17-openjdk-amd64"
            "/usr/lib/jvm/java-17-openjdk"
            "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17"*
          )
          
          VALID_JAVA_HOME=""
          for candidate in "${java_candidates[@]}"; do
            # Handle wildcards
            for java_dir in $candidate; do
              if [ -d "$java_dir" ] && [ -f "$java_dir/bin/java" ] && [ -f "$java_dir/bin/javac" ]; then
                VALID_JAVA_HOME="$java_dir"
                echo "✅ Found valid Java: $java_dir"
                break 2
              fi
            done
          done
          
          # Method 3: Find via symlink resolution
          if [ -z "$VALID_JAVA_HOME" ]; then
            java_symlink=$(readlink -f $(which java) 2>/dev/null | sed 's|/bin/java||' || true)
            if [ -n "$java_symlink" ] && [ -d "$java_symlink" ] && [ -f "$java_symlink/bin/javac" ]; then
              VALID_JAVA_HOME="$java_symlink"
              echo "✅ Found via symlink: $java_symlink"
            fi
          fi
          
          # Method 4: Emergency installation
          if [ -z "$VALID_JAVA_HOME" ]; then
            echo "🚨 Emergency Java installation..."
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            VALID_JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
        fi
        
        # Final validation
        if [ ! -d "$VALID_JAVA_HOME" ] || [ ! -f "$VALID_JAVA_HOME/bin/java" ]; then
          echo "❌ CRITICAL: No valid Java installation found"
          ls -la /usr/lib/jvm/ || true
          exit 1
        fi
        
        # Export for subsequent steps
        echo "VALIDATED_JAVA_HOME=$VALID_JAVA_HOME" >> $GITHUB_ENV
        export JAVA_HOME="$VALID_JAVA_HOME"
        
        # Verify installation
        echo "🔍 Java Installation Verification:"
        echo "JAVA_HOME: $VALID_JAVA_HOME"
        "$VALID_JAVA_HOME/bin/java" -version
        "$VALID_JAVA_HOME/bin/javac" -version
        
        # Create global Gradle configuration
        mkdir -p ~/.gradle
        cat > ~/.gradle/gradle.properties << EOF
        org.gradle.java.home=$VALID_JAVA_HOME
        org.gradle.daemon=false
        org.gradle.parallel=true
        org.gradle.configureondemand=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC
        EOF
        
        echo "✅ Java configuration complete"
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create Android Project Structure
      run: |
        echo "=== Creating Android Project Structure ==="
        
        # Create directory structure
        mkdir -p android/{app/src/main/{java/com/lingualink/translator,res/{values,layout,drawable,mipmap-hdpi}},gradle/wrapper}
        
        # Create colors.xml
        cat > android/app/src/main/res/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <!-- LinguaLink Brand Colors -->
            <color name="primary_blue">#2196F3</color>
            <color name="primary_blue_dark">#1976D2</color>
            <color name="accent_green">#4CAF50</color>
            
            <!-- Material Design Colors -->
            <color name="colorPrimary">#2196F3</color>
            <color name="colorPrimaryDark">#1976D2</color>
            <color name="colorAccent">#FF4081</color>
            
            <!-- Standard Colors -->
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray">#808080</color>
            <color name="light_gray">#F5F5F5</color>
            <color name="dark_gray">#424242</color>
        </resources>
        EOF
        
        # Create styles.xml
        cat > android/app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                <item name="colorPrimary">@color/primary_blue</item>
                <item name="colorPrimaryDark">@color/primary_blue_dark</item>
                <item name="colorAccent">@color/accent_green</item>
            </style>
            
            <style name="SplashTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowBackground">@color/primary_blue</item>
            </style>
        </resources>
        EOF
        
        # Create strings.xml
        cat > android/app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">LinguaLink</string>
            <string name="translation_app">Translation App</string>
            <string name="record_audio">Record Audio</string>
            <string name="settings">Settings</string>
            <string name="hello">Hello</string>
            <string name="how_are_you">How are you</string>
        </resources>
        EOF
        
        # Create AndroidManifest.xml
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.lingualink.translator">
            
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/AppTheme">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        echo "✅ Android resources created"
        
    - name: Create Build Configuration
      run: |
        echo "=== Creating Build Configuration ==="
        
        # Create root build.gradle
        cat > android/build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
        
        # Create app build.gradle
        cat > android/app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        
        android {
            compileSdkVersion 34
            
            defaultConfig {
                applicationId "com.lingualink.translator"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 67
                versionName "1.0.67"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    debuggable false
                }
                debug {
                    minifyEnabled false
                    debuggable true
                }
            }
            
            splits {
                abi {
                    enable true
                    reset()
                    include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
                    universalApk true
                }
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.core:core:1.12.0'
        }
        EOF
        
        # Create project gradle.properties
        cat > android/gradle.properties << EOF
        org.gradle.java.home=$VALIDATED_JAVA_HOME
        org.gradle.daemon=false
        org.gradle.parallel=true
        org.gradle.configureondemand=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=true
        EOF
        
        # Create settings.gradle
        cat > android/settings.gradle << 'EOF'
        include ':app'
        EOF
        
        echo "✅ Build configuration created"
        
    - name: Setup Gradle Wrapper
      run: |
        echo "=== Setting up Gradle Wrapper ==="
        
        cd android
        
        # Create wrapper properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Create gradlew script with Java home override
        cat > gradlew << EOF
        #!/usr/bin/env sh
        
        # Resolve Java home
        if [ -z "\$JAVA_HOME" ]; then
            export JAVA_HOME="$VALIDATED_JAVA_HOME"
        fi
        
        # Gradle execution
        APP_NAME="Gradle"
        APP_BASE_NAME=\$(basename "\$0")
        GRADLE_OPTS="\$GRADLE_OPTS -Dorg.gradle.java.home=\$JAVA_HOME"
        
        exec "\$JAVA_HOME/bin/java" \$GRADLE_OPTS -cp "\$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "\$@"
        EOF
        
        chmod +x gradlew
        cd ..
        
        echo "✅ Gradle wrapper configured"
        
    - name: Create MainActivity
      run: |
        echo "=== Creating MainActivity ==="
        
        cat > android/app/src/main/java/com/lingualink/translator/MainActivity.java << 'EOF'
        package com.lingualink.translator;
        
        import androidx.appcompat.app.AppCompatActivity;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.EditText;
        import android.view.View;
        
        public class MainActivity extends AppCompatActivity {
            private TextView titleText;
            private Button recordButton;
            private EditText inputText;
            private TextView translationResult;
            
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                // Initialize views
                titleText = findViewById(R.id.title_text);
                recordButton = findViewById(R.id.record_button);
                inputText = findViewById(R.id.input_text);
                translationResult = findViewById(R.id.translation_result);
                
                // Set up click listener
                recordButton.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        simulateTranslation();
                    }
                });
            }
            
            private void simulateTranslation() {
                String input = inputText.getText().toString();
                String translation = "Translation: " + input;
                translationResult.setText(translation);
            }
        }
        EOF
        
        # Create activity_main.xml layout
        cat > android/app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp">
            
            <TextView
                android:id="@+id/title_text"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="@string/translation_app"
                android:textSize="24sp"
                android:textStyle="bold"
                android:gravity="center"
                android:layout_marginBottom="32dp" />
            
            <EditText
                android:id="@+id/input_text"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:hint="Enter text to translate"
                android:layout_marginBottom="16dp" />
            
            <Button
                android:id="@+id/record_button"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="@string/record_audio"
                android:layout_marginBottom="16dp" />
            
            <TextView
                android:id="@+id/translation_result"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Translation will appear here"
                android:textSize="16sp"
                android:padding="16dp"
                android:background="@color/light_gray" />
            
        </LinearLayout>
        EOF
        
        echo "✅ MainActivity and layout created"
        
    - name: Build APK
      run: |
        echo "=== Building APK ==="
        
        cd android
        export JAVA_HOME="$VALIDATED_JAVA_HOME"
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -XX:MaxMetaspaceSize=1g"
        
        echo "Build environment:"
        echo "JAVA_HOME: $JAVA_HOME"
        echo "GRADLE_OPTS: $GRADLE_OPTS"
        
        # Test Gradle
        ./gradlew --version
        
        # Build based on input or default to both
        build_type="${{ github.event.inputs.build_type || 'both' }}"
        
        if [ "$build_type" = "debug" ] || [ "$build_type" = "both" ]; then
          echo "🔨 Building debug APK..."
          ./gradlew assembleDebug --stacktrace
        fi
        
        if [ "$build_type" = "release" ] || [ "$build_type" = "both" ]; then
          echo "🔨 Building release APK..."
          ./gradlew assembleRelease --stacktrace
        fi
        
        echo "✅ Build completed"
        
    - name: Advanced APK Search & Collection
      run: |
        echo "=== Advanced APK Search & Collection ==="
        
        # Create collection directory
        mkdir -p apk-collection
        
        # Strategy 1: Standard Android build outputs
        echo "🔍 Searching standard build outputs..."
        find android/app/build/outputs -name "*.apk" -type f -exec echo "Standard: {}" \; -exec cp {} apk-collection/ \;
        
        # Strategy 2: Deep recursive search
        echo "🔍 Deep recursive search..."
        find android -name "*.apk" -type f -not -path "*/apk-collection/*" -exec echo "Deep: {}" \; -exec cp {} apk-collection/ \;
        
        # Strategy 3: Root directory search
        echo "🔍 Root directory search..."
        find . -maxdepth 3 -name "*.apk" -type f -not -path "./apk-collection/*" -exec echo "Root: {}" \; -exec cp {} apk-collection/ \;
        
        # Strategy 4: Gradle cache search
        echo "🔍 Gradle cache search..."
        find ~/.gradle -name "*.apk" -type f -exec echo "Cache: {}" \; -exec cp {} apk-collection/ \; 2>/dev/null || true
        
        echo "✅ APK search completed"
        
    - name: APK Analysis & Optimization
      run: |
        echo "=== APK Analysis & Optimization ==="
        
        cd apk-collection
        
        apk_count=$(ls *.apk 2>/dev/null | wc -l || echo 0)
        echo "📊 Total APKs found: $apk_count"
        
        if [ "$apk_count" -eq 0 ]; then
          echo "❌ No APK files found"
          exit 1
        fi
        
        # Analyze and rename APKs
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            size=$(stat -c%s "$apk" 2>/dev/null || echo "0")
            echo "📱 Analyzing: $apk ($size bytes)"
            
            # Rename based on characteristics
            if [[ "$apk" == *"debug"* ]]; then
              mv "$apk" "LinguaLink-Debug-v1.0.67.apk"
            elif [[ "$apk" == *"release"* ]]; then
              mv "$apk" "LinguaLink-Release-v1.0.67.apk"
            elif [[ "$apk" == *"universal"* ]]; then
              mv "$apk" "LinguaLink-Universal-v1.0.67.apk"
            else
              mv "$apk" "LinguaLink-Complete-v1.0.67.apk"
            fi
          fi
        done
        
        # Create final optimized APK
        latest_apk=$(ls -t *.apk | head -1)
        if [ -n "$latest_apk" ]; then
          cp "$latest_apk" "LinguaLink-Final-Testrigor.apk"
          echo "✅ Final APK: LinguaLink-Final-Testrigor.apk"
        fi
        
        # List all APKs
        echo "📋 Final APK collection:"
        ls -la *.apk
        
    - name: Upload APK Collection
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-complete-apk-collection
        path: apk-collection/
        retention-days: 30
        
    - name: Build Summary
      run: |
        echo "=== BUILD SUMMARY ==="
        echo "Repository: lingualink-android2"
        echo "Workflow: Android CI - Complete APK Build & Search"
        echo "Build Type: ${{ github.event.inputs.build_type || 'both' }}"
        echo "Java Home: $VALIDATED_JAVA_HOME"
        echo "Date: $(date)"
        echo ""
        echo "📱 APK Files Created:"
        ls -la apk-collection/*.apk 2>/dev/null || echo "No APK files found"
        echo ""
        echo "✅ Status: SUCCESS"
        echo "🎯 Ready for Testrigor testing"
        echo "📦 Artifacts uploaded with 30-day retention"
