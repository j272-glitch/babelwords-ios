name: iOS workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      run_firebase_test:
        description: 'Run Firebase Test Lab on a real iOS device'
        required: false
        default: false
        type: boolean
      run_xcui_test:
        description: 'Run XCUITest on iOS simulator'
        required: false
        default: false
        type: boolean

env:
  WORKSPACE: ios/BabelWords.xcworkspace
  SCHEME: BabelWords
  DERIVED_DATA: derived_data
  FIREBASE_TEST_LAB_DEVICE: iphone14pro
  FIREBASE_TEST_LAB_OS_VERSION: "26.0"
  FIREBASE_TEST_LAB_TIMEOUT: 30m
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

jobs:
  build-and-test:
    name: Build and test on simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject credential artifacts
        run: |
          forbidden=$(find . -type f \
            \( -name '*.p8' -o -name '*.pem' -o -name '*.key' -o \
               -name '*service-account*.json' -o -name 'google-services*.json' -o \
               -name 'GoogleService-Info.plist' -o -name '*AuthKey*' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Credential artifacts found in checkout:"
            echo "$forbidden"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up writable tool cache
        run: |
          mkdir -p "$HOME/hostedtoolcache"
          echo "RUNNER_TOOL_CACHE=$HOME/hostedtoolcache" >> $GITHUB_ENV

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Find available simulator
        id: sim
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available -j > /tmp/simctl-devices.json
          python3 -c "
          import json, sys
          with open('/tmp/simctl-devices.json') as f:
              data = json.load(f)
          udid = None
          for runtime, devices in data['devices'].items():
              if not runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS'):
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      udid = device['udid']
                      break
              if udid:
                  break
          if not udid:
              print('No available iPhone simulator found', file=sys.stderr)
              sys.exit(1)
          print(f'Selected simulator UDID: {udid}', file=sys.stderr)
          print(f'destination=platform=iOS Simulator,id={udid}')
          " >> $GITHUB_OUTPUT

      - name: Build
        run: |
          xcodebuild build \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination '${{ steps.sim.outputs.destination }},arch=arm64' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            -resultBundlePath "${{ env.DERIVED_DATA }}/Build.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Test
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination '${{ steps.sim.outputs.destination }},arch=arm64' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            -resultBundlePath "${{ env.DERIVED_DATA }}/Test.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-logs
          path: |
            ${{ env.DERIVED_DATA }}/Logs/Build
            ${{ env.DERIVED_DATA }}/Logs/Test
            ${{ env.DERIVED_DATA }}/Build.xcresult
            ${{ env.DERIVED_DATA }}/Test.xcresult

  archive:
    name: Archive and export IPA
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set selected Xcode for non-interactive tools
        run: |
          echo "DEVELOPER_DIR=$MD_APPLE_SDK_ROOT/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$MD_APPLE_SDK_ROOT/Contents/Developer"
          xcodebuild -version

      - name: Install Ruby/CocoaPods and XcodeGen
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install build tools
        run: |
          gem install cocoapods
          gem install bundler -v 2.5.23
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi

      - name: Reject credential artifacts
        run: |
          forbidden=$(find . -type f \
            \( -name '*.p8' -o -name '*.pem' -o -name '*.key' -o \
               -name '*service-account*.json' -o -name 'google-services*.json' -o \
               -name 'GoogleService-Info.plist' -o -name '*AuthKey*' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Credential artifacts found in checkout:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate required secrets
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: |
          missing=()
          for secret in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          if [ -z "$FASTLANE_APPLE_ID" ] || [ -z "$FASTLANE_TEAM_ID" ]; then
            echo "Set FASTLANE_APPLE_ID and FASTLANE_TEAM_ID repository variables for archive signing."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler -v 2.5.23
          bundle _2.5.23_ install

      - name: Sync signing and build IPA
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: bundle _2.5.23_ exec fastlane build

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: BabelWords.ipa
          path: ios/build/BabelWords.ipa

      - name: Remove generated credentials
        if: always()
        run: |
          rm -f ios/app_store_connect_api_key.p8
          rm -f ios/app_store_connect_api_key.json
          rm -f ios/BabelWords/Resources/GoogleService-Info.plist

  firebase-test-lab:
    name: Firebase Test Lab iOS
    runs-on: macos-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_firebase_test == 'true'
    env:
      FIREBASE_TEST_LAB_BUCKET: ${{ secrets.FIREBASE_TEST_LAB_BUCKET || format('test-lab-{0}', secrets.GCP_PROJECT_ID) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject credential artifacts
        run: |
          forbidden=$(find . -type f \
            \( -name '*.p8' -o -name '*.pem' -o -name '*.key' -o \
               -name '*service-account*.json' -o -name 'google-services*.json' -o \
               -name 'GoogleService-Info.plist' -o -name '*AuthKey*' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Credential artifacts found in checkout:"
            echo "$forbidden"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up writable tool cache
        run: |
          mkdir -p "$HOME/hostedtoolcache"
          echo "RUNNER_TOOL_CACHE=$HOME/hostedtoolcache" >> $GITHUB_ENV

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi

      - name: Validate required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          missing=()
          for secret in GCP_PROJECT_ID GCP_SERVICE_ACCOUNT_KEY_BASE64 MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler -v 2.5.23
          bundle _2.5.23_ install

      - name: Sync development signing
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: bundle _2.5.23_ exec fastlane sync_signing_testlab

      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ env.DERIVED_DATA }}

      - name: Zip test bundle
        working-directory: ios
        run: |
          PRODUCTS_DIR="${{ env.DERIVED_DATA }}/Build/Products"
          BUILD_DIR=$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*-iphoneos' | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Error: could not find iOS test build products directory."
            ls -la "$PRODUCTS_DIR"
            exit 1
          fi
          echo "Found test build products: $BUILD_DIR"
          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/ios/BabelWordsUITests.zip" .

      - name: Decode GCP service account key
        id: gcp
        env:
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_KEY_BASE64" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_KEY_BASE64 is required for Firebase Test Lab."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID is required for Firebase Test Lab."
            exit 1
          fi
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$GCP_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.gcp.outputs.key }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Validate Firebase Test Lab target
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if ! gcloud firebase test ios models list \
            --project "$GCP_PROJECT_ID" \
            --format='value(model,version)' | grep -Eq '^iphone14pro[[:space:]]+26\.0$'; then
            echo "::error::Firebase Test Lab target iphone14pro / iOS 26.0 is unavailable."
            gcloud firebase test ios models list \
              --project "$GCP_PROJECT_ID" \
              --format='table(model,version,state)' | grep -i 'iphone14pro' || true
            exit 1
          fi

      - name: Run Firebase Test Lab
        working-directory: ios
        run: |
          BUCKET="${FIREBASE_TEST_LAB_BUCKET#gs://}"
          if [ -z "$BUCKET" ]; then
            echo "Firebase Test Lab results bucket is empty"
            exit 1
          fi
          gcloud firebase test ios run \
            --type xctest \
            --test "${GITHUB_WORKSPACE}/ios/BabelWordsUITests.zip" \
            --device model=${{ env.FIREBASE_TEST_LAB_DEVICE }},version=${{ env.FIREBASE_TEST_LAB_OS_VERSION }},locale=en_US,orientation=portrait \
            --results-bucket "gs://${BUCKET}" \
            --results-dir ios-test-${{ github.run_id }} \
            --timeout ${{ env.FIREBASE_TEST_LAB_TIMEOUT }}

      - name: Upload Firebase Test Lab logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: firebase-test-lab-logs
          path: |
            ios/*.log
            ios/firebase-test-lab-*.log

      - name: Remove generated credentials
        if: always()
        run: |
          rm -f ios/app_store_connect_api_key.p8
          rm -f ios/app_store_connect_api_key.json
          rm -f ios/BabelWords/Resources/GoogleService-Info.plist
          rm -f /tmp/firebase-service-account.json

  build-adhoc-ipa:
    name: Build ad-hoc IPA + XCUITest runner
    runs-on: self-hosted
    needs: build-and-test
    if: github.event.inputs.run_firebase_test == 'true' || github.event.inputs.run_xcui_test == 'true'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Reject credential artifacts
        run: |
          forbidden=$(find . -type f \
            \( -name '*.p8' -o -name '*.pem' -o -name '*.key' -o \
               -name '*service-account*.json' -o -name 'google-services*.json' -o \
               -name 'GoogleService-Info.plist' -o -name '*AuthKey*' \) \
            -not -path './.git/*' -print)
          if [ -n "$forbidden" ]; then
            echo "Credential artifacts found in checkout:"
            echo "$forbidden"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set selected Xcode for non-interactive tools
        run: |
          echo "DEVELOPER_DIR=$MD_APPLE_SDK_ROOT/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$MD_APPLE_SDK_ROOT/Contents/Developer"
          echo "Using Xcode at: $DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up Ruby and tools
        run: |
          BREW_PREFIX=$(brew --prefix)
          if [ ! -d "$BREW_PREFIX/opt/ruby@3.3" ]; then
            echo "Installing Ruby 3.3 via Homebrew..."
            brew install ruby@3.3
          fi
          RUBY_BIN="$BREW_PREFIX/opt/ruby@3.3/bin"
          GEM_BIN="$BREW_PREFIX/opt/ruby@3.3/lib/ruby/gems/3.3.0/bin"
          echo "$RUBY_BIN" >> $GITHUB_PATH
          echo "$GEM_BIN" >> $GITHUB_PATH
          export PATH="$RUBY_BIN:$GEM_BIN:$PATH"
          gem install bundler -v 2.5.23
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods
          fi
          ruby -v
          which ruby
          gem -v
          gem env
          openssl version
          pod --version
          bundle _2.5.23_ -v
          if ! command -v xcodegen &> /dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi
          xcodegen --version

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Validate ad-hoc signing inputs
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: |
          missing=()
          for secret in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required ad-hoc signing inputs: ${missing[*]}"
            exit 1
          fi
          if [ -z "$FASTLANE_APPLE_ID" ] || [ -z "$FASTLANE_TEAM_ID" ]; then
            echo "Set FASTLANE_APPLE_ID and FASTLANE_TEAM_ID repository variables for ad-hoc signing."
            exit 1
          fi
          if grep -qE 'your-apple-id@example\.com|YOUR_TEAM_ID' ios/fastlane/Appfile; then
            echo "ios/fastlane/Appfile still contains signing placeholders."
            exit 1
          fi

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "$GOOGLE_SERVICES_INFO_PLIST_BASE64" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
          echo "✅ Wrote GoogleService-Info.plist"
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          bundle _2.5.23_ install

      - name: Validate match secrets
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "Missing MATCH_PASSWORD or MATCH_GIT_BASIC_AUTHORIZATION"
            exit 1
          fi

      - name: Build ad-hoc IPA
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: bundle _2.5.23_ exec fastlane build_adhoc

      - name: Build XCUITest runner
        if: github.event.inputs.run_firebase_test == 'true' || github.event.inputs.run_xcui_test == 'true'
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ vars.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: |
          bundle _2.5.23_ exec fastlane sync_signing_adhoc
          xcodebuild build-for-testing \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData
          cd DerivedData/Build/Products/Debug-iphoneos
          zip -r BabelWordsUITestsRunner.zip *

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: babelwords-ios-ipa
          path: ios/build/BabelWords.ipa
          if-no-files-found: error

      - name: Upload XCUITest runner
        if: github.event.inputs.run_firebase_test == 'true' || github.event.inputs.run_xcui_test == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: babelwords-ios-xcui-runner
          path: ios/DerivedData/Build/Products/Debug-iphoneos/BabelWordsUITestsRunner.zip
          if-no-files-found: warn

      - name: Remove generated credentials
        if: always()
        run: |
          rm -f ios/app_store_connect_api_key.p8
          rm -f ios/app_store_connect_api_key.json
          rm -f ios/BabelWords/Resources/GoogleService-Info.plist

  xcui-simulator-manual:
    name: Manual XCUITest on iOS Simulator
    needs: build-and-test
    if: github.event.inputs.run_xcui_test == 'true'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up writable tool cache
        run: |
          mkdir -p "$HOME/hostedtoolcache"
          echo "RUNNER_TOOL_CACHE=$HOME/hostedtoolcache" >> $GITHUB_ENV

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "$GOOGLE_SERVICES_INFO_PLIST_BASE64" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Find available simulator
        id: sim
        working-directory: ios
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available -j > /tmp/simctl-devices.json
          python3 -c "
          import json, sys
          with open('/tmp/simctl-devices.json') as f:
              data = json.load(f)
          udid = None
          for runtime, devices in data['devices'].items():
              if not runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS'):
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      udid = device['udid']
                      break
              if udid:
                  break
          if not udid:
              print('No available iPhone simulator found', file=sys.stderr)
              sys.exit(1)
          print(f'Selected simulator UDID: {udid}', file=sys.stderr)
          print(f'destination=platform=iOS Simulator,id={udid}')
          " >> $GITHUB_OUTPUT

      - name: Run XCUITest on simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination '${{ steps.sim.outputs.destination }},arch=arm64' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcui-simulator-results
          path: ios/DerivedData/Logs/Test/
          if-no-files-found: warn

  firebase-test-lab-adhoc:
    name: Manual Firebase Test Lab iOS
    needs: build-adhoc-ipa
    if: github.event.inputs.run_firebase_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download .ipa
        uses: actions/download-artifact@v5
        with:
          name: babelwords-ios-ipa
          path: ios-ipa

      - name: Download XCUITest runner
        uses: actions/download-artifact@v5
        with:
          name: babelwords-ios-xcui-runner
          path: ios-xcui

      - name: Decode GCP service account key
        id: gcp
        env:
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_KEY_BASE64" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_KEY_BASE64 is required for Firebase Test Lab."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID is required for Firebase Test Lab."
            exit 1
          fi
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$GCP_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.gcp.outputs.key }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Validate Firebase Test Lab target
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if ! gcloud firebase test ios models list \
            --project "$GCP_PROJECT_ID" \
            --format='value(model,version)' | grep -Eq '^iphone14pro[[:space:]]+26\.0$'; then
            echo "::error::Firebase Test Lab target iphone14pro / iOS 26.0 is unavailable."
            gcloud firebase test ios models list \
              --project "$GCP_PROJECT_ID" \
              --format='table(model,version,state)' | grep -i 'iphone14pro' || true
            exit 1
          fi

      - name: Run iOS XCUITest on Firebase Test Lab
        run: |
          IPA=$(find ios-ipa -name "*.ipa" | head -n 1)
          TEST=$(find ios-xcui -name "BabelWordsUITestsRunner.zip" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "::error::No IPA found"
            exit 1
          fi
          if [ -z "$TEST" ]; then
            echo "::error::No XCUITest runner found"
            exit 1
          fi

          echo "IPA: $IPA"
          echo "TEST: $TEST"

          gcloud firebase test ios run \
            --type xctest \
            --app "$IPA" \
            --test "$TEST" \
            --device model=iphone14pro,version=26.0,locale=en_US,orientation=portrait \
            --timeout 10m \
            --record-video \
            --project "${GCP_PROJECT_ID}" 2>&1 | tee firebase-ios-run.log

      - name: Pull device logs and video from results bucket
        if: always()
        run: |
          RAW=$(grep -oE 'storage/browser/[^[:space:]"]+' firebase-ios-run.log | head -n 1 || echo "")
          if [ -z "$RAW" ]; then
            echo "⚠️ Could not parse results-bucket path"
            exit 0
          fi
          GS_PATH="gs://$(echo "$RAW" | sed 's#storage/browser/##; s#].*##; s#?.*##; s#/*$##')"
          echo "Results bucket: $GS_PATH"
          mkdir -p firebase-ios-results
          gsutil -m cp -r "${GS_PATH}/**" firebase-ios-results/ || \
            gsutil -m cp -r "${GS_PATH}/*" firebase-ios-results/ || \
            echo "⚠️ Could not copy results"

      - name: Scan iOS device log for ad markers
        if: always()
        run: |
          SYSLOG=$(find firebase-ios-results -name "*.log" -type f | head -n 1 || echo "")
          if [ -n "$SYSLOG" ]; then
            echo "--- Test Lab detection ---"
            grep -E "Firebase Test Lab detected|Test Lab|test-lab" "$SYSLOG" || echo "(none)"
            echo "--- Ad events ---"
            grep -E "IMPRESSION|Interstitial shown|interstitialShown|App Open shown|appOpenShown" "$SYSLOG" || echo "(none)"
          fi

      - name: Stage colon-free artifact
        if: always()
        run: |
          mkdir -p firebase-ios-artifact
          cp firebase-ios-run.log firebase-ios-artifact/ 2>/dev/null || true
          LOG=$(find firebase-ios-results -name "*.log" -type f | head -n 1 || echo "")
          VIDEO=$(find firebase-ios-results -name "*.mp4" -type f | head -n 1 || echo "")
          [ -n "$LOG" ] && cp "$LOG" firebase-ios-artifact/device-log.txt || true
          [ -n "$VIDEO" ] && cp "$VIDEO" firebase-ios-artifact/video.mp4 || true
          ls -la firebase-ios-artifact

      - name: Upload Firebase Test Lab iOS artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: firebase-testlab-ios
          path: firebase-ios-artifact
          if-no-files-found: warn
          retention-days: 14
