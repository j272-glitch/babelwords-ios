name: iOS workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

env:
  WORKSPACE: ios/BabelWords.xcworkspace
  SCHEME: BabelWords
  DERIVED_DATA: derived_data
  FIREBASE_TEST_LAB_DEVICE: iphone14pro
  FIREBASE_TEST_LAB_OS_VERSION: "26.0"
  FIREBASE_TEST_LAB_TIMEOUT: 30m

jobs:
  build-and-test:
    name: Build and test on simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Build
        run: |
          xcodebuild build \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Test
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ env.DERIVED_DATA }}/Logs/Build
            ${{ env.DERIVED_DATA }}/Logs/Test

  archive:
    name: Archive and export IPA
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          missing=()
          for secret in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          fi

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler
          bundle install

      - name: Sync signing and build IPA
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BabelWords.ipa
          path: ios/build/BabelWords.ipa

  firebase-test-lab:
    name: Firebase Test Lab iOS
    runs-on: macos-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIREBASE_TEST_LAB_BUCKET: ${{ secrets.FIREBASE_TEST_LAB_BUCKET || format('test-lab-{0}', secrets.GCP_PROJECT_ID) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Validate required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          missing=()
          for secret in GCP_PROJECT_ID GCP_SERVICE_ACCOUNT_KEY_BASE64 MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o BabelWords/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler
          bundle install

      - name: Sync development signing
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane sync_signing_testlab

      - name: Build for testing
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -workspace BabelWords.xcworkspace \
            -scheme BabelWords \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ env.DERIVED_DATA }}

      - name: Zip test bundle
        working-directory: ios
        run: |
          PRODUCTS_DIR="${{ env.DERIVED_DATA }}/Build/Products"
          BUILD_DIR=$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*-iphoneos' | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Error: could not find iOS test build products directory."
            ls -la "$PRODUCTS_DIR"
            exit 1
          fi
          echo "Found test build products: $BUILD_DIR"
          cd "$BUILD_DIR"
          zip -r "../../../BabelWordsUITests.zip" .

      - name: Decode GCP service account key
        id: gcp
        env:
          GCP_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$GCP_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.gcp.outputs.key }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run Firebase Test Lab
        working-directory: ios
        run: |
          gcloud firebase test ios run \
            --type xctest \
            --test BabelWordsUITests.zip \
            --device model=${{ env.FIREBASE_TEST_LAB_DEVICE }},version=${{ env.FIREBASE_TEST_LAB_OS_VERSION }},locale=en_US,orientation=portrait \
            --results-bucket gs://${{ env.FIREBASE_TEST_LAB_BUCKET }} \
            --results-dir ios-test-${{ github.run_id }} \
            --timeout ${{ env.FIREBASE_TEST_LAB_TIMEOUT }}

      - name: Upload Firebase Test Lab logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-logs
          path: |
            ios/*.log
            ios/firebase-test-lab-*.log
