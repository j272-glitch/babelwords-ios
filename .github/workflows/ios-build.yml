name: iOS workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

env:
  WORKSPACE: ios/LinguaVibe.xcworkspace
  SCHEME: LinguaVibe
  DERIVED_DATA: derived_data

jobs:
  build-and-test:
    name: Build and test on simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Ruby/CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods and XcodeGen
        run: |
          gem install cocoapods
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Decode GoogleService-Info.plist
        if: env.GOOGLE_SERVICES_INFO_PLIST_BASE64 != ''
        working-directory: ios
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}" | base64 -d -o LinguaVibe/Resources/GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64 }}

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Build
        run: |
          xcodebuild build \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Test
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE }} \
            -scheme ${{ env.SCHEME }} \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ env.DERIVED_DATA }}/Logs/Build
            ${{ env.DERIVED_DATA }}/Logs/Test

  archive:
    name: Archive and export IPA
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode App Store Connect API key
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d -o app_store_connect_api_key.p8

      - name: Write App Store Connect API key JSON
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          key=$(cat app_store_connect_api_key.p8 | sed 's/$/\\n/' | tr -d '\n')
          cat > app_store_connect_api_key.json <<EOF
          {
            "key_id": "$KEY_ID",
            "issuer_id": "$ISSUER_ID",
            "key": "$key",
            "duration": 1200,
            "in_house": false
          }
          EOF

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          fi

      - name: Install Pods and Fastlane
        working-directory: ios
        run: |
          pod install --repo-update
          gem install bundler
          bundle install

      - name: Sync signing and build IPA
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinguaVibe.ipa
          path: ios/build/LinguaVibe.ipa
