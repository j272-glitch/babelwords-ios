name: LinguaLink iOS Build (Consistent Fixed)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

env:
  TEAM_ID: "YBQZK8T3LU"
  BUNDLE_ID: "com.lingualink.ios"
  
jobs:
  ios-build:
    name: iOS Build with Export Fixes
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Clean Environment
      run: |
        echo "Cleaning build environment..."
        npm cache clean --force || true
        rm -rf node_modules || true
        rm -rf package-lock.json || true
        rm -rf ios || true
        rm -rf build || true
        
    - name: Install Dependencies
      run: |
        echo "Installing dependencies..."
        npm install
        
    - name: Build Frontend
      run: |
        echo "Building frontend assets..."
        npx vite build
        
    - name: Setup Capacitor
      run: |
        echo "Setting up Capacitor..."
        npm install -g @capacitor/cli
        npx cap add ios
        npx cap sync ios
        
    - name: Configure iOS Project (Fixed Signing)
      run: |
        cd ios/App
        
        echo "Configuring automatic signing with fixes..."
        echo "Team ID: ${{ env.TEAM_ID }}"
        echo "Bundle ID: ${{ env.BUNDLE_ID }}"
        
        # Configure App project for manual signing (no Apple Developer account required)
        sed -i '' 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
        sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = \"${{ env.TEAM_ID }}\";/g" App.xcodeproj/project.pbxproj
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' App.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj
        
        # Configure Pods project for manual signing
        sed -i '' 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Manual;/g' Pods/Pods.xcodeproj/project.pbxproj
        sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = \"${{ env.TEAM_ID }}\";/g" Pods/Pods.xcodeproj/project.pbxproj
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' Pods/Pods.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' Pods/Pods.xcodeproj/project.pbxproj
        
        # Update app metadata
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LinguaLink" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LinguaLink" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ env.BUNDLE_ID }}" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ${{ env.BUNDLE_ID }}" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1.0.0" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" App/Info.plist
        
        # Add permissions
        /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'LinguaLink requires microphone access for speech recognition and translation features.'" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'LinguaLink requires microphone access for speech recognition and translation features.'" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'LinguaLink uses speech recognition to convert your voice into text for translation.'" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'LinguaLink uses speech recognition to convert your voice into text for translation.'" App/Info.plist
        
        echo "iOS project configured successfully"
        
    - name: Build Archive
      run: |
        cd ios/App
        
        echo "Building iOS archive..."
        rm -rf build
        mkdir -p build
        
        xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration ${{ inputs.build_type || 'Release' }} \
          -destination generic/platform=iOS \
          -archivePath build/LinguaLink.xcarchive \
          archive \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="${{ env.TEAM_ID }}"
          
        echo "Archive build completed"
        
    - name: Create Export Options (Fixed)
      run: |
        cd ios/App
        
        echo "Creating corrected export options..."
        rm -f ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :method string ad-hoc" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :teamID string ${{ env.TEAM_ID }}" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool false" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool false" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Add :thinning string '<none>'" ExportOptions.plist
        
        echo "Export options created with ad-hoc method"
        echo "Verifying ExportOptions.plist:"
        cat ExportOptions.plist
        
    - name: Export IPA (FIXED)
      run: |
        cd ios/App
        
        echo "Exporting IPA with ad-hoc method (no Apple Developer account required)..."
        xcodebuild \
          -exportArchive \
          -archivePath build/LinguaLink.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist
          
        echo "IPA export completed"
        
    - name: Validate Artifacts
      run: |
        cd ios/App/build
        
        echo "Validating build artifacts..."
        IPA_FILE=$(find . -name "*.ipa" | head -1)
        
        if [ -z "$IPA_FILE" ]; then
          echo "ERROR: No IPA file found"
          ls -la
          exit 1
        fi
        
        IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat -c%s "$IPA_FILE")
        IPA_SIZE_MB=$((IPA_SIZE / 1024 / 1024))
        
        echo "SUCCESS: IPA file found: $IPA_FILE"
        echo "Size: ${IPA_SIZE_MB}MB"
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: LinguaLink-iOS-Fixed-${{ inputs.build_type || 'Release' }}-${{ github.run_number }}
        path: ios/App/build/*.ipa
        retention-days: 30
        
    - name: Build Summary
      run: |
        echo "BUILD COMPLETED SUCCESSFULLY!"
        echo "============================"
        echo "Team ID: ${{ env.TEAM_ID }}"
        echo "Bundle ID: ${{ env.BUNDLE_ID }}"
        echo "Build Type: ${{ inputs.build_type || 'Release' }}"
        echo "Method: debugging (FIXED)"
        echo "Export: With allowProvisioningUpdates (FIXED)"
        echo "Download artifacts from Actions tab"