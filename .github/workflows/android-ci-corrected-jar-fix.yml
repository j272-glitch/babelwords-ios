name: Android CI - Corrected JAR Fix
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
        - both

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: j272-glitch/lingualink-android2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Java Installation
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        echo "Java version:"
        java -version
        echo "Javac version:"
        javac -version

    - name: Nuclear Cache Destruction
      run: |
        echo "=== DESTROYING ALL GRADLE CACHES ==="
        rm -rf ~/.gradle/
        rm -rf $HOME/.gradle/
        rm -rf /home/runner/.gradle/
        sudo rm -rf /root/.gradle/ 2>/dev/null || true
        rm -rf .gradle/
        rm -rf */build/
        rm -rf build/
        rm -rf gradle/
        rm -rf gradlew*
        echo "Cache destruction complete"

    - name: Setup Isolated Environment
      run: |
        echo "=== ISOLATED GRADLE ENVIRONMENT ==="
        export GRADLE_USER_HOME="/tmp/isolated-gradle-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Dorg.gradle.caching=false" >> $GITHUB_ENV
        echo "JAVA_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV

    - name: Create Missing Android Resources
      run: |
        echo "=== CREATING ANDROID RESOURCES ==="
        
        # Create local.properties
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_NDK_ROOT
        EOF
        
        # Create gradle.properties
        cat > gradle.properties << EOF
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        org.gradle.caching=false
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        org.gradle.parallel=false
        EOF
        
        echo "Android resources created"

    - name: Download and Extract Complete Gradle 8.3
      run: |
        echo "=== DOWNLOADING COMPLETE GRADLE 8.3 ==="
        
        # Create clean download directory
        mkdir -p gradle-download-temp
        cd gradle-download-temp
        
        # Download Gradle 8.3 distribution
        echo "Downloading Gradle 8.3..."
        curl -L -o gradle-8.3-bin.zip https://services.gradle.org/distributions/gradle-8.3-bin.zip
        
        # Extract Gradle
        echo "Extracting Gradle..."
        unzip -q gradle-8.3-bin.zip
        
        # Verify extraction
        GRADLE_HOME="$(pwd)/gradle-8.3"
        echo "Gradle Home: $GRADLE_HOME"
        echo "Contents of lib directory:"
        ls -la "$GRADLE_HOME/lib/" | grep wrapper || echo "No wrapper files found"
        
        # Find ALL wrapper-related JARs
        echo "All wrapper-related files:"
        find "$GRADLE_HOME" -name "*wrapper*" -type f
        
        cd ..

    - name: Extract Correct Wrapper JAR Using Multiple Methods
      run: |
        echo "=== EXTRACTING CORRECT WRAPPER JAR ==="
        
        # Method 1: Try standard Gradle wrapper JAR from lib
        GRADLE_HOME="gradle-download-temp/gradle-8.3"
        
        if [ -f "$GRADLE_HOME/lib/gradle-wrapper.jar" ]; then
          echo "Method 1: Found standard gradle-wrapper.jar"
          cp "$GRADLE_HOME/lib/gradle-wrapper.jar" gradle-wrapper-method1.jar
          ls -la gradle-wrapper-method1.jar
        fi
        
        # Method 2: Extract from gradle-wrapper distribution JAR
        if [ -f "$GRADLE_HOME/lib/gradle-wrapper-8.3.jar" ]; then
          echo "Method 2: Found versioned gradle-wrapper-8.3.jar"
          cp "$GRADLE_HOME/lib/gradle-wrapper-8.3.jar" gradle-wrapper-method2.jar
          ls -la gradle-wrapper-method2.jar
        fi
        
        # Method 3: Find and extract the wrapper main class JAR
        echo "Method 3: Finding JAR containing GradleWrapperMain..."
        for jar in "$GRADLE_HOME"/lib/*.jar; do
          if unzip -l "$jar" 2>/dev/null | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
            echo "Found GradleWrapperMain in: $jar"
            cp "$jar" gradle-wrapper-method3.jar
            ls -la gradle-wrapper-method3.jar
            break
          fi
        done
        
        # Method 4: Use our known working JAR if others fail
        if [ -f "../gradle-wrapper-fixed.jar" ]; then
          echo "Method 4: Using known working JAR"
          cp ../gradle-wrapper-fixed.jar gradle-wrapper-method4.jar
          ls -la gradle-wrapper-method4.jar
        fi
        
        # Select the best JAR (largest, most likely to be complete)
        echo "Selecting best wrapper JAR..."
        BEST_JAR=""
        BEST_SIZE=0
        
        for method_jar in gradle-wrapper-method*.jar; do
          if [ -f "$method_jar" ]; then
            size=$(stat -f%z "$method_jar" 2>/dev/null || stat -c%s "$method_jar")
            echo "$method_jar: $size bytes"
            if [ "$size" -gt "$BEST_SIZE" ]; then
              BEST_SIZE=$size
              BEST_JAR=$method_jar
            fi
          fi
        done
        
        if [ -n "$BEST_JAR" ] && [ "$BEST_SIZE" -gt 50000 ]; then
          echo "Selected: $BEST_JAR ($BEST_SIZE bytes)"
          cp "$BEST_JAR" gradle-wrapper.jar
          echo "Final JAR ready: $(ls -la gradle-wrapper.jar)"
        else
          echo "CRITICAL: No suitable wrapper JAR found"
          exit 1
        fi

    - name: Generate Fresh Wrapper with Verified JAR
      run: |
        echo "=== GENERATE FRESH WRAPPER ==="
        
        # Complete wrapper destruction
        rm -rf gradle/ gradlew* .gradle/ build/ */build/
        
        # Create gradle wrapper directory structure
        mkdir -p gradle/wrapper
        
        # Copy the verified wrapper jar
        cp gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
        
        # Verify JAR contains required classes
        echo "Verifying JAR contents..."
        if unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
          echo "✅ JAR contains GradleWrapperMain"
        else
          echo "❌ JAR missing GradleWrapperMain"
          exit 1
        fi
        
        # Create gradle-wrapper.properties with proven configuration
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Generate working gradlew script
        cat > gradlew << 'EOF'
        #!/usr/bin/env sh

        # Determine the Java executable to use to start the JVM.
        if [ -n "$JAVA_HOME" ] ; then
            if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                # IBM's JDK on AIX uses strange locations for the executables
                JAVACMD="$JAVA_HOME/jre/sh/java"
            else
                JAVACMD="$JAVA_HOME/bin/java"
            fi
            if [ ! -x "$JAVACMD" ] ; then
                die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME

        Please set the JAVA_HOME variable in your environment to match the
        location of your Java installation."
            fi
        else
            JAVACMD="java"
            which java >/dev/null 2>&1 || die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH.

        Please set the JAVA_HOME variable in your environment to match the
        location of your Java installation."
        fi

        # Increase the maximum file descriptors if we can
        if [ "$cygwin" = "false" -a "$darwin" = "false" -a "$nonstop" = "false" ] ; then
            MAX_FD_LIMIT=$(ulimit -H -n)
            if [ $? -eq 0 ] ; then
                if [ "$MAX_FD" = "maximum" -o "$MAX_FD" = "max" ] ; then
                    MAX_FD="$MAX_FD_LIMIT"
                fi
                ulimit -n $MAX_FD >/dev/null 2>&1
                if [ $? -ne 0 ] ; then
                    warn "Could not set maximum file descriptor limit: $MAX_FD"
                fi
            else
                warn "Could not query maximum file descriptor limit: $MAX_FD_LIMIT"
            fi
        fi

        # For Darwin, add options to specify how the application appears in the dock
        if [ "$darwin" = "true" ] ; then
            GRADLE_OPTS="$GRADLE_OPTS \"-Xdock:name=Gradle\" \"-Xdock:icon=$APP_HOME/media/gradle.icns\""
        fi

        # For Cygwin or MSYS, switch paths to Windows format before running java
        if [ "$cygwin" = "true" -o "$msys" = "true" ] ; then
            APP_HOME=$(cygpath --path --mixed "$APP_HOME")
            CLASSPATH=$(cygpath --path --mixed "$CLASSPATH")
            
            JAVACMD=$(cygpath --unix "$JAVACMD")
        fi

        # Determine script location
        APP_HOME=$(cd "${0%/*}" && pwd)

        # Collect all arguments for the java command, escape spaces
        set -- \
                "-Dorg.gradle.appname=gradlew" \
                -classpath "\"$APP_HOME/gradle/wrapper/gradle-wrapper.jar\"" \
                org.gradle.wrapper.GradleWrapperMain \
                "$@"

        # Use "xargs" to parse quoted args.
        exec "$JAVACMD" "$@"
        EOF
        
        chmod +x gradlew
        
        echo "Fresh wrapper generation complete!"
        echo "Wrapper verification:"
        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Test Wrapper Thoroughly
      run: |
        echo "=== COMPREHENSIVE WRAPPER TESTING ==="
        
        # Test 1: Verify JAR file integrity
        echo "Test 1: JAR file integrity"
        file gradle/wrapper/gradle-wrapper.jar
        
        # Test 2: Check JAR contents
        echo "Test 2: JAR contents verification"
        unzip -l gradle/wrapper/gradle-wrapper.jar | head -20
        
        # Test 3: Test wrapper version command
        echo "Test 3: Wrapper version test"
        timeout 30 ./gradlew --version || echo "Version test timed out or failed"
        
        # Test 4: Test wrapper help command
        echo "Test 4: Wrapper help test"
        timeout 10 ./gradlew --help | head -5 || echo "Help test failed"

    - name: Force Build with Extended Time
      run: |
        echo "=== FORCE BUILD WITH EXTENDED TIME ==="
        
        # Build based on input
        build_type="${{ github.event.inputs.build_type }}"
        
        if [ "$build_type" = "debug" ] || [ "$build_type" = "both" ]; then
          echo "Building debug APK..."
          timeout 1200 ./gradlew assembleDebug --stacktrace --info --no-daemon || echo "Debug build failed or timed out"
        fi
        
        if [ "$build_type" = "release" ] || [ "$build_type" = "both" ]; then
          echo "Building release APK..."
          timeout 1200 ./gradlew assembleRelease --stacktrace --info --no-daemon || echo "Release build failed or timed out"
        fi
        
        echo "Build completed"

    - name: Locate and Verify APK Files
      run: |
        echo "=== LOCATING APK FILES ==="
        find . -name "*.apk" -type f -exec ls -la {} \;
        find . -name "*.aab" -type f -exec ls -la {} \;
        
        # Create a summary of built files
        echo "Build summary:" > build_summary.txt
        find . -name "*.apk" -o -name "*.aab" | while read file; do
          echo "Found: $file ($(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes)" >> build_summary.txt
        done
        cat build_summary.txt

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-apks-corrected-jar-${{ github.event.inputs.build_type }}-${{ github.run_number }}
        path: |
          **/*.apk
          **/*.aab
          build_summary.txt
          gradle/wrapper/gradle-wrapper.jar
        retention-days: 30
