name: Complete Gradle Reset Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-gradle-wrapper.yml'
      - 'android/**'

jobs:
  complete-reset:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17 for Android Gradle Plugin
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Complete Gradle Environment Reset
      run: |
        echo "=== COMPLETE GRADLE ENVIRONMENT RESET ==="
        echo ""
        
        # Clear ALL Gradle-related directories and caches
        echo "Removing all Gradle caches and directories..."
        rm -rf ~/.gradle/
        rm -rf $HOME/.gradle/
        rm -rf /home/runner/.gradle/
        rm -rf /tmp/.gradle*
        rm -rf /var/tmp/.gradle*
        
        echo "Cleaning Android project Gradle artifacts..."
        cd android
        rm -rf .gradle/
        rm -rf build/
        rm -rf app/build/
        rm -rf */build/
        
        # Clear any potential global Gradle configuration
        echo "Clearing global Gradle configuration..."
        unset GRADLE_USER_HOME
        unset GRADLE_HOME
        unset GRADLE_OPTS
        
        # Explicitly unset the problematic property
        echo "Unsetting problematic Java home property..."
        unset ORG_GRADLE_JAVA_HOME
        
        echo "✅ Complete Gradle environment reset completed"
        
    - name: Force Dynamic Java Environment
      run: |
        echo "=== FORCE DYNAMIC JAVA ENVIRONMENT ==="
        echo ""
        
        # Verify GitHub Actions Java setup
        echo "GitHub Actions Java Environment:"
        echo "  JAVA_HOME: $JAVA_HOME"
        echo "  Java Binary: $(which java)"
        echo "  Java Version: $(java -version 2>&1 | head -1)"
        
        # Set comprehensive environment with explicit overrides
        echo "Setting forced dynamic environment..."
        
        # Force Gradle to use GitHub Actions Java
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        
        # Explicitly override any cached properties
        export GRADLE_USER_HOME="/tmp/gradle-fresh"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Create fresh gradle.properties with correct settings
        cat > "$GRADLE_USER_HOME/gradle.properties" << 'FRESH_EOF'
# Fresh Gradle configuration for GitHub Actions
org.gradle.java.home=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
FRESH_EOF
        
        echo "GRADLE_OPTS=$GRADLE_OPTS" >> $GITHUB_ENV
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        
        echo "✅ Forced dynamic Java environment configured"
        
    - name: Complete Wrapper Regeneration with Fresh Download
      working-directory: android
      run: |
        echo "=== COMPLETE WRAPPER REGENERATION ==="
        echo ""
        
        # Remove ALL wrapper-related files
        echo "Removing all existing wrapper files..."
        rm -rf gradle/
        rm -rf gradlew*
        rm -rf .gradle/
        
        # Create completely fresh wrapper directory
        echo "Creating fresh wrapper structure..."
        mkdir -p gradle/wrapper
        
        # Use Gradle wrapper initialization instead of manual download
        echo "Initializing fresh Gradle wrapper..."
        
        # Download gradle binary temporarily to generate wrapper
        GRADLE_TMP="/tmp/gradle-init"
        mkdir -p "$GRADLE_TMP"
        cd "$GRADLE_TMP"
        
        curl -L -o gradle-8.3-bin.zip "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
        unzip -q gradle-8.3-bin.zip
        
        # Use the downloaded Gradle to initialize wrapper in our project
        cd "$GITHUB_WORKSPACE/android"
        "$GRADLE_TMP/gradle-8.3/bin/gradle" wrapper --gradle-version 8.3 --distribution-type bin
        
        # Verify wrapper was created
        if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ Fresh Gradle wrapper created successfully"
            chmod +x gradlew
            ls -la gradle/wrapper/
            ls -la gradlew*
        else
            echo "❌ Failed to create wrapper"
            exit 1
        fi
        
    - name: Test Fresh Environment
      working-directory: android
      env:
        GRADLE_OPTS: "-Dorg.gradle.java.home=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64 -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        GRADLE_USER_HOME: "/tmp/gradle-fresh"
      run: |
        echo "=== TESTING FRESH ENVIRONMENT ==="
        echo ""
        
        echo "Environment Check:"
        echo "  GRADLE_OPTS: $GRADLE_OPTS"
        echo "  GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "  JAVA_HOME: $JAVA_HOME"
        
        # Test Gradle version without any cached properties
        echo "Testing Gradle version..."
        if timeout 60 ./gradlew --version --no-daemon --info; then
            echo "✅ Gradle version test successful"
        else
            echo "❌ Gradle version test failed"
            exit 1
        fi
        
        # Test project tasks
        echo "Testing project tasks..."
        if timeout 60 ./gradlew tasks --no-daemon --quiet; then
            echo "✅ Project tasks test successful"
        else
            echo "❌ Project tasks test failed"
            exit 1
        fi
        
    - name: Build Debug APK with Fresh Environment
      working-directory: android
      env:
        GRADLE_OPTS: "-Dorg.gradle.java.home=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64 -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        GRADLE_USER_HOME: "/tmp/gradle-fresh"
      run: |
        echo "=== BUILD DEBUG APK WITH FRESH ENVIRONMENT ==="
        echo ""
        
        echo "Starting debug APK build..."
        echo "Using fresh Gradle environment: $GRADLE_USER_HOME"
        echo "Java home override: $JAVA_HOME"
        
        # Build debug APK with comprehensive logging
        if timeout 900 ./gradlew assembleDebug --no-daemon --stacktrace --info --warning-mode all; then
            echo ""
            echo "✅ DEBUG APK BUILD SUCCESSFUL!"
            echo "==============================="
            
            # Find and verify the APK
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            
            if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
                APK_SIZE=$(stat -c%s "$APK_PATH")
                echo "Debug APK Details:"
                echo "  Path: $APK_PATH"
                echo "  Size: $APK_SIZE bytes ($(( APK_SIZE / 1024 / 1024 )) MB)"
                echo "  Modified: $(stat -c%y "$APK_PATH")"
                
                # Copy to standard artifact name
                cp "$APK_PATH" "lingualink-complete-reset-debug.apk"
                echo "  Artifact: lingualink-complete-reset-debug.apk"
                
                # Verify APK is valid
                if [ "$APK_SIZE" -gt 500000 ]; then
                    echo "✅ APK size validation passed"
                else
                    echo "⚠️  APK size seems small: $APK_SIZE bytes"
                fi
                
            else
                echo "❌ APK not found at expected location"
                echo "Searching for any APK files..."
                find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK files found"
                exit 1
            fi
            
        else
            echo ""
            echo "❌ DEBUG APK BUILD FAILED"
            echo "========================="
            echo ""
            echo "Environment debug information:"
            echo "GRADLE_OPTS: $GRADLE_OPTS"
            echo "GRADLE_USER_HOME: $GRADLE_USER_HOME"
            echo "Java processes:"
            ps aux | grep java || echo "No Java processes"
            echo ""
            echo "Gradle daemon status:"
            ./gradlew --status || echo "Cannot check Gradle daemon status"
            echo ""
            echo "Build directory contents:"
            find . -name "build" -type d -exec ls -la {} \; || echo "No build directories"
            
            exit 1
        fi
        
    - name: Build Release APK if Debug Succeeds
      working-directory: android
      env:
        GRADLE_OPTS: "-Dorg.gradle.java.home=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64 -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        GRADLE_USER_HOME: "/tmp/gradle-fresh"
      run: |
        echo "=== BUILD RELEASE APK ==="
        echo ""
        
        echo "Building release APK with fresh environment..."
        
        if timeout 900 ./gradlew assembleRelease --no-daemon --stacktrace --info; then
            echo ""
            echo "✅ RELEASE APK BUILD SUCCESSFUL!"
            echo "==============================="
            
            # Find and copy release APK
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            
            if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
                cp "$RELEASE_APK" "lingualink-complete-reset-release.apk"
                echo "Release APK ready: lingualink-complete-reset-release.apk"
                echo "Size: $(stat -c%s "$RELEASE_APK") bytes"
            fi
            
        else
            echo "⚠️  Release build failed, but debug succeeded"
            echo "Debug APK is still available for testing"
        fi
        
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-complete-reset-apks
        path: |
          android/lingualink-complete-reset-debug.apk
          android/lingualink-complete-reset-release.apk
        retention-days: 30
        
    - name: Final Reset Summary
      if: always()
      run: |
        echo ""
        echo "🎉 COMPLETE GRADLE RESET SUMMARY"
        echo "==============================="
        echo ""
        echo "Reset Actions Performed:"
        echo "✅ Cleared all Gradle caches and global configuration"
        echo "✅ Removed all existing wrapper files"
        echo "✅ Generated fresh wrapper using official Gradle binary"
        echo "✅ Created isolated GRADLE_USER_HOME environment"
        echo "✅ Explicitly set org.gradle.java.home to GitHub Actions path"
        echo "✅ Forced no-daemon mode to prevent caching issues"
        echo ""
        
        if [ -f "android/lingualink-complete-reset-debug.apk" ]; then
            echo "Build Results:"
            echo "✅ Debug APK: Successfully generated"
            DEBUG_SIZE=$(stat -c%s "android/lingualink-complete-reset-debug.apk" 2>/dev/null || echo "0")
            echo "✅ Debug Size: $(( DEBUG_SIZE / 1024 / 1024 )) MB"
            
            if [ -f "android/lingualink-complete-reset-release.apk" ]; then
                RELEASE_SIZE=$(stat -c%s "android/lingualink-complete-reset-release.apk" 2>/dev/null || echo "0")
                echo "✅ Release APK: Successfully generated"
                echo "✅ Release Size: $(( RELEASE_SIZE / 1024 / 1024 )) MB"
            else
                echo "⚠️  Release APK: Build failed (debug available)"
            fi
            
            echo "✅ Status: BUILD SUCCESS - APK(s) ready for testing"
        else
            echo "Build Results:"
            echo "❌ Debug APK: Build failed"
            echo "❌ Status: BUILD FAILED - review logs above"
        fi
        
        echo ""
        echo "Environment Solution:"
        echo "The complete Gradle reset eliminates all cached properties"
        echo "and forces fresh environment with correct Java paths."
        echo "This permanently resolves hardcoded path conflicts."
        echo ""
        echo "Next Steps:"
        echo "1. Download APK artifacts from GitHub Actions"
        echo "2. Test APKs on Android devices and x86 emulators"
        echo "3. Verify Testrigor automation compatibility"
        echo "4. Deploy for production testing"Ty 
