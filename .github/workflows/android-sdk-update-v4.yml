- name: Validate Deep Link Configuration
        run: |
          echo "Validating deep link configuration..."
          if grep -q "android:scheme=\"https\"" android/app/src/main/AndroidManifest.xml; then
            echo "✅ Deep link scheme found in manifest"
          else
            echo "⚠️  No deep link scheme found"
          fi

          if grep -q "android:host=\"linguagt.com\"" android/app/src/main/AndroidManifest.xml; then
            echo "✅ Deep link host configured"
          else
            echo "⚠️  No deep link host found"
          fi

