    - name: Collect Foundation APKs
      run: |
        echo "=== COLLECTING FOUNDATION APKS ==="
        
        mkdir -p foundation-proven-apks
        
        # Find and collect all APKs
        find android -name "*.apk" -type f -exec echo "Foundation APK: {}" \; -exec cp {} foundation-proven-apks/ \;
        
        cd foundation-proven-apks
        
        # Rename APKs for identification
        for apk in *.apk; do
          if [ -f "$apk" ]; then
            size=$(stat -c%s "$apk" 2>/dev/null || echo "0")
            echo "Foundation APK: $apk ($size bytes)"
            
            if [[ "$apk" == *"debug"* ]]; then
              mv "$apk" "LinguaLink-FOUNDATION-PROVEN-DEBUG.apk"
            elif [[ "$apk" == *"release"* ]]; then
              mv "$apk" "LinguaLink-FOUNDATION-PROVEN-RELEASE.apk"
            elif [[ "$apk" == *"universal"* ]]; then
              mv "$apk" "LinguaLink-FOUNDATION-PROVEN-UNIVERSAL.apk"
            else
              mv "$apk" "LinguaLink-FOUNDATION-PROVEN-COMPLETE.apk"
            fi
          fi
        done
        
        # Create final foundation APK
        latest_apk=$(ls -t *.apk | head -1)
        if [ -n "$latest_apk" ]; then
          cp "$latest_apk" "LinguaLink-FOUNDATION-PROVEN-FINAL.apk"
          echo "FOUNDATION PROVEN FINAL APK: LinguaLink-FOUNDATION-PROVEN-FINAL.apk"
        fi
        
        echo "Foundation Proven APK Collection:"
        ls -la *.apk
        
