name: Test Java Path Configurations

on:
  workflow_dispatch:

jobs:
  test-paths:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Analyze Default Container Environment
      run: |
        echo "=== DEFAULT CONTAINER ENVIRONMENT ==="
        echo "Default java location: $(which java || echo 'not found')"
        echo "Default JAVA_HOME: ${JAVA_HOME:-'not set'}"
        echo "Default java version: $(java -version 2>&1 | head -1 || echo 'not available')"
        echo ""
        
        echo "Available JVM directories:"
        ls -la /usr/lib/jvm/ 2>/dev/null || echo "No /usr/lib/jvm directory"
        echo ""
        
        echo "Checking for hostedtoolcache:"
        ls -la /opt/hostedtoolcache/Java* 2>/dev/null || echo "No hostedtoolcache Java yet"
        
    - name: Set up JDK 17 with setup-java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Analyze Post setup-java Environment
      run: |
        echo "=== POST SETUP-JAVA ENVIRONMENT ==="
        echo "setup-java JAVA_HOME: $JAVA_HOME"
        echo "setup-java java location: $(which java)"
        echo "setup-java java version: $(java -version 2>&1 | head -1)"
        echo ""
        
        echo "Updated JVM directories:"
        ls -la /usr/lib/jvm/ 2>/dev/null || echo "Still no /usr/lib/jvm directory"
        echo ""
        
        echo "Hostedtoolcache after setup:"
        ls -la /opt/hostedtoolcache/Java* 2>/dev/null || echo "No hostedtoolcache visible"
        echo ""
        
        echo "Environment variables from setup-java:"
        env | grep -i java || echo "No Java environment variables set"
        
    - name: Test Hardcoded Path vs Actual Path
      run: |
        echo "=== PATH CONFLICT ANALYSIS ==="
        HARDCODED="/usr/lib/jvm/java-17-openjdk-amd64"
        ACTUAL="$JAVA_HOME"
        
        echo "GitHub Actions typical hardcoded path: $HARDCODED"
        echo "Actual Java path from setup-java: $ACTUAL"
        echo ""
        
        if [ "$HARDCODED" = "$ACTUAL" ]; then
            echo "✅ Paths match - no conflict"
        else
            echo "❌ PATH CONFLICT DETECTED"
            echo "   Hardcoded path exists: $([ -d "$HARDCODED" ] && echo 'YES' || echo 'NO')"
            echo "   Actual path exists: $([ -d "$ACTUAL" ] && echo 'YES' || echo 'NO')"
            
            if [ -d "$HARDCODED" ]; then
                echo "   Testing hardcoded path Java:"
                $HARDCODED/bin/java -version 2>&1 | head -1 || echo "   Failed to execute"
            fi
            
            echo "   Testing actual path Java:"
            $ACTUAL/bin/java -version 2>&1 | head -1 || echo "   Failed to execute"
        fi
        
    - name: Test Gradle with Path Conflict Resolution
      run: |
        echo "=== GRADLE PATH CONFLICT RESOLUTION ==="
        cd android
        
        # Test 1: Default (may fail due to path conflict)
        echo "Test 1: Default Gradle wrapper (may fail):"
        if timeout 30 ./gradlew --version --no-daemon 2>/dev/null; then
            echo "✅ Works with default configuration"
        else
            echo "❌ Fails with default configuration (expected)"
        fi
        
        # Test 2: Explicit GRADLE_OPTS resolution
        echo ""
        echo "Test 2: Explicit GRADLE_OPTS resolution:"
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8"
        echo "Using GRADLE_OPTS: $GRADLE_OPTS"
        
        if timeout 30 ./gradlew --version --no-daemon; then
            echo "✅ Works with explicit GRADLE_OPTS"
        else
            echo "❌ Still fails with GRADLE_OPTS"
        fi
        
        # Test 3: gradle.properties resolution
        echo ""
        echo "Test 3: gradle.properties resolution:"
        echo "Checking gradle.properties Java home setting:"
        grep "org.gradle.java.home" gradle.properties || echo "Not set in gradle.properties"
        
    - name: Resolution Summary
      run: |
        echo "=== RESOLUTION SUMMARY ==="
        echo "Problem: GitHub Actions hardcodes Java paths that don't match actual JDK locations"
        echo "Solution: Use GRADLE_OPTS to override Gradle's Java home detection"
        echo ""
        echo "Implementation:"
        echo "1. Use actions/setup-java@v4 to install correct JDK"
        echo "2. Set GRADLE_OPTS=\"-Dorg.gradle.java.home=\$JAVA_HOME\""
        echo "3. Use explicit env vars in workflow steps"
        echo ""
        echo "Current configuration working: $([ -n "$GRADLE_OPTS" ] && echo 'YES' || echo 'NO')"