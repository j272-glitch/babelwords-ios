name: Android CI - Sequential Build with Gradle Wrapper Fix

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release/both)'
        required: false
        default: 'both'
        type: choice
        options:
        - debug
        - release
        - both
      force_gradle_fix:
        description: 'Force gradle wrapper fix even if appears valid'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "4333796"

jobs:
  gradle-wrapper-diagnosis:
    name: Gradle Wrapper Health Check
    runs-on: ubuntu-latest
    outputs:
      wrapper-status: ${{ steps.diagnose.outputs.status }}
      needs-fix: ${{ steps.diagnose.outputs.needs-fix }}
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Diagnose Gradle Wrapper Health
      id: diagnose
      run: |
        echo "=== GRADLE WRAPPER COMPREHENSIVE DIAGNOSIS ==="
        echo "============================================="
        
        issues_found=0
        fixes_needed=false
        
        # Check gradle-wrapper.jar
        if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "Found gradle-wrapper.jar: $jar_size bytes"
          
          if [ "$jar_size" -lt 60000 ]; then
            echo "ISSUE: gradle-wrapper.jar too small ($jar_size bytes)"
            fixes_needed=true
          elif ! unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "ISSUE: gradle-wrapper.jar failed integrity check"
            fixes_needed=true
          else
            echo "SUCCESS: gradle-wrapper.jar integrity verified"
          fi
        else
          echo "ISSUE: gradle-wrapper.jar missing"
          fixes_needed=true
        fi
        
        # Check other components
        [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && fixes_needed=true
        [ ! -f "gradlew" ] && fixes_needed=true
        [ ! -x "gradlew" ] && fixes_needed=true
        [ ! -f "gradlew.bat" ] && fixes_needed=true
        
        # Force fix check
        [ "${{ inputs.force_gradle_fix }}" = "true" ] && fixes_needed=true
        
        echo "Fixes needed: $fixes_needed"
        
        if [ "$fixes_needed" = true ]; then
          echo "status=needs-repair" >> $GITHUB_OUTPUT
          echo "needs-fix=true" >> $GITHUB_OUTPUT
        else
          echo "status=healthy" >> $GITHUB_OUTPUT
          echo "needs-fix=false" >> $GITHUB_OUTPUT
        fi

  gradle-wrapper-fix:
    name: Fix Gradle Wrapper Issues
    runs-on: ubuntu-latest
    needs: gradle-wrapper-diagnosis
    if: needs.gradle-wrapper-diagnosis.outputs.needs-fix == 'true'
    outputs:
      fixes-applied: ${{ steps.fix-wrapper.outputs.fixes-applied }}
      gradle-status: ${{ steps.fix-wrapper.outputs.gradle-status }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Apply Gradle Wrapper Fixes
      id: fix-wrapper
      run: |
        echo "=== APPLYING GRADLE WRAPPER FIXES ==="
        echo "===================================="
        
        fixes_applied=0
        mkdir -p gradle/wrapper
        
        # Fix gradle-wrapper.jar
        if [ -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
          cp android/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "SUCCESS: Updated gradle-wrapper.jar ($jar_size bytes)"
          fixes_applied=$((fixes_applied + 1))
        fi
        
        # Fix gradle-wrapper.properties
        if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
          cp android/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          echo "SUCCESS: Updated gradle-wrapper.properties"
          fixes_applied=$((fixes_applied + 1))
        fi
        
        # Fix gradlew script
        if [ -f "android/gradlew" ]; then
          cp android/gradlew .
          chmod +x gradlew
          echo "SUCCESS: Updated gradlew script"
          fixes_applied=$((fixes_applied + 1))
        fi
        
        # Fix gradlew.bat
        if [ -f "android/gradlew.bat" ]; then
          cp android/gradlew.bat .
          echo "SUCCESS: Updated gradlew.bat"
          fixes_applied=$((fixes_applied + 1))
        fi
        
        # Copy build files if missing
        [ ! -f "build.gradle" ] && [ -f "android/build.gradle" ] && cp android/build.gradle . && fixes_applied=$((fixes_applied + 1))
        [ ! -f "settings.gradle" ] && [ -f "android/settings.gradle" ] && cp android/settings.gradle . && fixes_applied=$((fixes_applied + 1))
        
        echo "Fixes applied: $fixes_applied"
        echo "fixes-applied=$fixes_applied" >> $GITHUB_OUTPUT
        echo "gradle-status=fixed" >> $GITHUB_OUTPUT
    
    - name: Test Fixed Gradle Wrapper
      run: |
        echo "=== TESTING FIXED GRADLE WRAPPER ==="
        if timeout 120 ./gradlew --version --no-daemon; then
          echo "SUCCESS: Gradle wrapper test PASSED"
        else
          echo "ERROR: Gradle wrapper test FAILED"
          exit 1
        fi

  # Wait for gradle wrapper fix to complete before starting builds
  android-build-debug:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    needs: [gradle-wrapper-diagnosis, gradle-wrapper-fix]
    if: always() && (needs.gradle-wrapper-diagnosis.outputs.status == 'healthy' || (needs.gradle-wrapper-fix.result == 'success' && needs.gradle-wrapper-fix.outputs.fixes-applied != '0'))
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Apply Gradle Wrapper Fixes (Ensure Consistency)
      run: |
        echo "=== ENSURING GRADLE WRAPPER CONSISTENCY ==="
        mkdir -p gradle/wrapper
        
        # Always copy from android/ to ensure fresh files
        [ -f "android/gradle/wrapper/gradle-wrapper.jar" ] && cp android/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
        [ -f "android/gradle/wrapper/gradle-wrapper.properties" ] && cp android/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
        [ -f "android/gradlew" ] && cp android/gradlew . && chmod +x gradlew
        [ -f "android/gradlew.bat" ] && cp android/gradlew.bat .
        [ ! -f "build.gradle" ] && [ -f "android/build.gradle" ] && cp android/build.gradle .
        [ ! -f "settings.gradle" ] && [ -f "android/settings.gradle" ] && cp android/settings.gradle .
        
        jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
        echo "Gradle wrapper jar size: $jar_size bytes"
    
    - name: Verify Gradle Wrapper
      run: |
        echo "=== GRADLE WRAPPER VERIFICATION ==="
        jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
        echo "Gradle wrapper jar: $jar_size bytes"
        
        if unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
          echo "SUCCESS: Gradle wrapper integrity verified"
        else
          echo "ERROR: Gradle wrapper corrupted"
          exit 1
        fi
        
        if timeout 60 ./gradlew --version --no-daemon; then
          echo "SUCCESS: Gradle wrapper functional"
        else
          echo "ERROR: Gradle wrapper test failed"
          exit 1
        fi
    
    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Discover Available Tasks
      run: |
        echo "=== DISCOVERING AVAILABLE GRADLE TASKS ==="
        ./gradlew tasks --all --no-daemon | head -50
        echo ""
        echo "=== SPECIFIC ANDROID TASKS ==="
        ./gradlew tasks --all --no-daemon | grep -i assemble || echo "No assemble tasks found"
        ./gradlew tasks --all --no-daemon | grep -i bundle || echo "No bundle tasks found"
    
    - name: Clean and Build Debug APK
      run: |
        echo "=== BUILDING DEBUG APK ==="
        ./gradlew clean --no-daemon
        ./gradlew app:assembleDebug --no-daemon
        echo "SUCCESS: Debug APK build completed"
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn

  android-build-release:
    name: Build Android APK/AAB (Release)
    runs-on: ubuntu-latest
    needs: [gradle-wrapper-diagnosis, gradle-wrapper-fix, android-build-debug]
    if: always() && (needs.gradle-wrapper-diagnosis.outputs.status == 'healthy' || (needs.gradle-wrapper-fix.result == 'success' && needs.gradle-wrapper-fix.outputs.fixes-applied != '0'))
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Apply Gradle Wrapper Fixes (Ensure Consistency)
      run: |
        echo "=== ENSURING GRADLE WRAPPER CONSISTENCY ==="
        mkdir -p gradle/wrapper
        
        # Always copy from android/ to ensure fresh files
        [ -f "android/gradle/wrapper/gradle-wrapper.jar" ] && cp android/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
        [ -f "android/gradle/wrapper/gradle-wrapper.properties" ] && cp android/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
        [ -f "android/gradlew" ] && cp android/gradlew . && chmod +x gradlew
        [ -f "android/gradlew.bat" ] && cp android/gradlew.bat .
        [ ! -f "build.gradle" ] && [ -f "android/build.gradle" ] && cp android/build.gradle .
        [ ! -f "settings.gradle" ] && [ -f "android/settings.gradle" ] && cp android/settings.gradle .
        
        jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
        echo "Gradle wrapper jar size: $jar_size bytes"
    
    - name: Verify Gradle Wrapper
      run: |
        echo "=== GRADLE WRAPPER VERIFICATION ==="
        jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
        echo "Gradle wrapper jar: $jar_size bytes"
        
        if unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
          echo "SUCCESS: Gradle wrapper integrity verified"
        else
          echo "ERROR: Gradle wrapper corrupted"
          exit 1
        fi
        
        if timeout 60 ./gradlew --version --no-daemon; then
          echo "SUCCESS: Gradle wrapper functional"
        else
          echo "ERROR: Gradle wrapper test failed"
          exit 1
        fi
    
    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Clean and Build Release APK and AAB
      run: |
        echo "=== BUILDING RELEASE APK AND AAB ==="
        ./gradlew clean --no-daemon
        ./gradlew app:assembleRelease --no-daemon
        ./gradlew app:bundleRelease --no-daemon
        echo "SUCCESS: Release builds completed"
    
    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release-artifacts
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
          build/outputs/apk/release/*.apk
          build/outputs/bundle/release/*.aab
        retention-days: 30
        if-no-files-found: warn

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [gradle-wrapper-diagnosis, gradle-wrapper-fix, android-build-debug, android-build-release]
    if: always()
    
    steps:
    - name: Generate Build Summary
      run: |
        echo "=== ANDROID CI BUILD SUMMARY ==="
        echo "==============================="
        echo ""
        
        echo "Gradle Wrapper Status: ${{ needs.gradle-wrapper-diagnosis.outputs.wrapper-status }}"
        echo "Fixes Applied: ${{ needs.gradle-wrapper-diagnosis.outputs.needs-fix == 'true' && 'Yes' || 'No' }}"
        echo "Fix Job Result: ${{ needs.gradle-wrapper-fix.result || 'N/A' }}"
        echo "Debug Build Result: ${{ needs.android-build-debug.result || 'N/A' }}"
        echo "Release Build Result: ${{ needs.android-build-release.result || 'N/A' }}"
        echo ""
        
        if [ "${{ needs.android-build-debug.result }}" = "success" ] && [ "${{ needs.android-build-release.result }}" = "success" ]; then
          echo "SUCCESS: All Android builds completed successfully"
          echo "Artifacts uploaded: Debug APK + Release APK/AAB"
        elif [ "${{ needs.gradle-wrapper-fix.result }}" = "failure" ]; then
          echo "FAILURE: Gradle wrapper fixes could not be applied"
        else
          echo "PARTIAL: Some builds may have failed"
        fi
        
        echo ""
        echo "Sequential build process ensures gradle wrapper consistency"
        echo "Build artifacts are retained for 30 days"
