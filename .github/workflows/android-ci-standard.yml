name: Android CI Standard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: android

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Create Android Resources (if missing)
      run: |
        # Only create resources if they don't exist
        if [ ! -f android/app/src/main/res/values/styles.xml ]; then
          echo "Creating missing styles.xml..."
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                <item name="colorPrimary">#2196F3</item>
                <item name="colorPrimaryDark">#1976D2</item>
                <item name="colorAccent">#FF4081</item>
            </style>
        </resources>
        EOF
        fi
        
        if [ ! -f android/app/src/main/res/values/colors.xml ]; then
          echo "Creating missing colors.xml..."
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="colorPrimary">#2196F3</color>
            <color name="colorPrimaryDark">#1976D2</color>
            <color name="colorAccent">#FF4081</color>
        </resources>
        EOF
        fi
        
        if [ ! -f android/app/src/main/res/drawable/ic_launcher_globe.xml ]; then
          echo "Creating missing launcher icon..."
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_globe.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#2196F3"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM11,19.93c-3.94,-0.49 -7,-3.85 -7,-7.93 0,-0.62 0.08,-1.21 0.21,-1.79L9,15v1c0,1.1 0.9,2 2,2v1.93zM17.9,17.39c-0.26,-0.81 -1,-1.39 -1.9,-1.39h-1v-3c0,-0.55 -0.45,-1 -1,-1H8v-2h2c0.55,0 1,-0.45 1,-1V7h2c1.1,0 2,-0.9 2,-2v-0.41c2.93,1.19 5,4.06 5,7.41 0,2.08 -0.8,3.97 -2.1,5.39z"/>
        </vector>
        EOF
        fi

    - name: Build Debug APK
      working-directory: android
      run: |
        BUILD_ARGS=(
          "assembleDebug"
          "--no-daemon"
          "--stacktrace"
        )
        
        if [ "${{ inputs.debug_mode }}" = "true" ]; then
          BUILD_ARGS+=("--info" "--debug")
        else
          BUILD_ARGS+=("--info")
        fi
        
        ./gradlew "${BUILD_ARGS[@]}"
        
        # Locate APK (assuming standard 'app' module; adjust if needed)
        APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
        
        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "../lingualink-debug.apk"
          echo "APK built: ../lingualink-debug.apk"
          APK_SIZE=$(stat -c%s "../lingualink-debug.apk")
          echo "APK size: $(( APK_SIZE / 1024 / 1024 )) MB"
        else
          echo "Error: APK not found"
          find . -name "*.apk" -type f || echo "No APK files found anywhere"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-debug-apk
        path: lingualink-debug.apk
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        if [ -f "lingualink-debug.apk" ]; then
          APK_SIZE=$(stat -c%s "lingualink-debug.apk")
          echo "## Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- APK: lingualink-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(( APK_SIZE / 1024 / 1024 )) MB" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for Testrigor testing" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "Check logs for details." >> $GITHUB_STEP_SUMMARY
        fi
