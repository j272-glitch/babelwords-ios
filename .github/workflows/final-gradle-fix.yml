name: Final Gradle Fix

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to run'
        required: true
        default: 'nuclear'
        type: choice
        options:
        - nuclear
        - clean

jobs:
  final-fix:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Nuclear Cache Destruction
      run: |
        echo "=== NUCLEAR CACHE DESTRUCTION ==="
        
        # Destroy ALL possible Gradle cache locations
        sudo rm -rf /home/runner/.gradle/ || true
        sudo rm -rf /root/.gradle/ || true
        sudo rm -rf ~/.gradle/ || true
        sudo rm -rf $HOME/.gradle/ || true
        sudo rm -rf /tmp/.gradle* || true
        sudo rm -rf /var/tmp/.gradle* || true
        sudo rm -rf /opt/.gradle* || true
        sudo rm -rf /etc/gradle/ || true
        sudo rm -rf /usr/share/gradle/ || true
        
        # Kill any running processes
        sudo pkill -f gradle || true
        sudo pkill -f java || true
        
        # Clear environment variables
        unset GRADLE_OPTS || true
        unset GRADLE_USER_HOME || true
        unset GRADLE_HOME || true
        
        echo "Nuclear destruction complete"
        
    - name: Setup Isolated Environment
      run: |
        echo "=== SETUP ISOLATED ENVIRONMENT ==="
        
        # Create completely isolated environment
        export GRADLE_USER_HOME="/tmp/isolated-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        
        # Force explicit Java path
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        
        # Create minimal gradle.properties
        echo "org.gradle.daemon=false" > "$GRADLE_USER_HOME/gradle.properties"
        echo "org.gradle.caching=false" >> "$GRADLE_USER_HOME/gradle.properties"
        
        # Export for next steps
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=$GRADLE_OPTS" >> $GITHUB_ENV
        
        echo "Environment setup complete"
        echo "JAVA_HOME: $JAVA_HOME"
        echo "GRADLE_USER_HOME: $GRADLE_USER_HOME"
        
    - name: Generate Fresh Wrapper
      working-directory: android
      run: |
        echo "=== GENERATE FRESH WRAPPER ==="
        
        # Remove all wrapper files
        rm -rf gradle/ gradlew* .gradle/ build/ */build/
        
        # Download and use official Gradle
        curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.3-bin.zip"
        unzip -q /tmp/gradle.zip -d /tmp/
        
        # Generate wrapper with no daemon
        /tmp/gradle-8.3/bin/gradle wrapper --gradle-version 8.3 --no-daemon
        chmod +x gradlew
        
        echo "Fresh wrapper generated"
        
    - name: Build with Explicit Override
      working-directory: android
      run: |
        echo "=== BUILD WITH EXPLICIT OVERRIDE ==="
        echo "GRADLE_OPTS: $GRADLE_OPTS"
        echo "GRADLE_USER_HOME: $GRADLE_USER_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        
        # Test Gradle with explicit override
        ./gradlew --version --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
        
        # Build with explicit Java home override
        ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace \
          --info \
          -Dorg.gradle.java.home="$JAVA_HOME"
        
        # Find and copy APK
        APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "lingualink-final-fix.apk"
          echo "SUCCESS: APK built - lingualink-final-fix.apk"
          echo "Size: $(stat -c%s lingualink-final-fix.apk) bytes"
        else
          echo "FAILED: APK not found"
          find . -name "*.apk" -type f || echo "No APK files found"
          exit 1
        fi
        
    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: lingualink-final-fix-apk
        path: android/lingualink-final-fix.apk
        retention-days: 30
