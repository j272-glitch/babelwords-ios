name: Build Native Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        
    - name: Make gradlew executable
      working-directory: android
      run: chmod +x gradlew
      
    - name: Clean project
      working-directory: android
      run: ./gradlew clean --stacktrace
      
    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build Debug AAB
      working-directory: android
      run: ./gradlew bundleDebug --stacktrace
      
    - name: Copy artifacts
      working-directory: android
      run: |
        mkdir -p ../build-outputs
        find . -name "*.apk" -path "*/debug/*" -exec cp {} ../build-outputs/LinguaLink-Native-v1.0.67-debug.apk \;
        find . -name "*.aab" -path "*/debug/*" -exec cp {} ../build-outputs/LinguaLink-Native-v1.0.67-debug.aab \;
        ls -la ../build-outputs/
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-native-apk-v1.0.67
        path: build-outputs/LinguaLink-Native-v1.0.67-debug.apk
        
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-native-aab-v1.0.67
        path: build-outputs/LinguaLink-Native-v1.0.67-debug.aab