name: Build AAB with Native Android Environment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build-aab:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 25.2.9519653
        
    - name: Install Gradle
      run: |
        # Install Gradle 8.3 globally to ensure wrapper generation works
        wget -q https://services.gradle.org/distributions/gradle-8.3-bin.zip
        unzip -q gradle-8.3-bin.zip
        sudo mv gradle-8.3 /opt/gradle
        sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
        gradle --version
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Setup Gradle wrapper
      run: |
        cd android
        echo "Setting up Gradle wrapper..."
        
        # Always regenerate wrapper to ensure integrity
        gradle wrapper --gradle-version 8.3 --distribution-type bin
        
        # Verify wrapper files exist
        ls -la gradlew gradle/wrapper/
        
        # Make executable
        chmod +x gradlew
        
        # Test wrapper
        echo "Testing Gradle wrapper..."
        ./gradlew --version
      
    - name: Verify Android configuration
      working-directory: android
      run: |
        echo "Building with native Android environment..."
        echo "Java version:"
        java -version
        echo "Android SDK location:"
        echo $ANDROID_HOME
        echo "Gradle version:"
        ./gradlew --version
        
    - name: Clean project
      working-directory: android
      run: ./gradlew clean
      
    - name: Build AAB (Release)
      working-directory: android
      run: |
        echo "Building release AAB..."
        ./gradlew bundleRelease
        
    - name: Build APK (Release) 
      working-directory: android
      run: |
        echo "Building release APK..."
        ./gradlew assembleRelease
        
    - name: List build outputs
      working-directory: android
      run: |
        echo "Generated files:"
        find . -name "*.aab" -type f -exec ls -la {} \;
        find . -name "*.apk" -type f -exec ls -la {} \;
        
    - name: Copy and rename outputs
      working-directory: android
      run: |
        # Find and copy AAB
        AAB_FILE=$(find . -name "*.aab" -path "*release*" | head -1)
        if [ -f "$AAB_FILE" ]; then
          cp "$AAB_FILE" ../lingualink-native-android-v1.0.61.aab
          echo "✅ AAB created: lingualink-native-android-v1.0.61.aab"
          ls -la ../lingualink-native-android-v1.0.61.aab
        fi
        
        # Find and copy APK
        APK_FILE=$(find . -name "*.apk" -path "*release*" | head -1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" ../lingualink-native-android-v1.0.61.apk
          echo "✅ APK created: lingualink-native-android-v1.0.61.apk"
          ls -la ../lingualink-native-android-v1.0.61.apk
          
          # Show APK contents
          unzip -l ../lingualink-native-android-v1.0.61.apk | head -20
        fi
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lingualink-aab-native-v1.0.61
        path: lingualink-native-android-v1.0.61.aab
        retention-days: 30
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lingualink-apk-native-v1.0.61
        path: lingualink-native-android-v1.0.61.apk
        retention-days: 30
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.61-native-android
        name: LinguaLink Native Android v1.0.61
        body: |
          LinguaLink Speech Translator - Native Android Build v1.0.61
          
          Fixed Gradle 9.0.0 NDK configuration compatibility issues:
          - Updated Android Gradle Plugin to 8.1.4
          - Fixed NDK ABI filters syntax
          - Compatible with Gradle 8.3 and Kotlin 1.8.10
          
          Files included:
          - 📱 lingualink-native-android-v1.0.61.apk (Universal APK)
          - 📦 lingualink-native-android-v1.0.61.aab (Android App Bundle)
        files: |
          lingualink-native-android-v1.0.61.aab
          lingualink-native-android-v1.0.61.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}