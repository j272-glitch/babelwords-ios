name: Ultimate Android Build Fix

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release/both)'
        required: false
        default: 'both'
        type: choice
        options:
        - debug
        - release  
        - both
      force_clean:
        description: 'Force clean gradle cache'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=false
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_SDK_TOOLS: 4333796

jobs:
  ultimate-build:
    name: Ultimate Android Build Fix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Configure Java Environment
      run: |
        echo "=== CONFIGURING JAVA ENVIRONMENT ==="
        
        # Override any existing Java paths
        export JAVA_HOME="/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.16-8/x64"
        
        echo "JAVA_HOME: $JAVA_HOME"
        echo "PATH: $PATH"
        
        # Verify Java installation
        java -version
        javac -version
        
        # Update PATH to prioritize our Java
        echo "$JAVA_HOME/bin" >> $GITHUB_PATH
        
        # Set explicit Gradle properties to override any conflicts
        echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
        
        echo "✅ Java environment configured correctly"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Cache Android Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-android-
          
    - name: Initialize Android Project
      run: |
        echo "=== ANDROID PROJECT INITIALIZATION ==="
        
        # Copy complete Android project structure
        cp -r android/* .
        
        # Set up local.properties with correct SDK path  
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        EOF
        
        # Create/update gradle.properties with environment settings
        cat >> gradle.properties << EOF
        org.gradle.java.home=$JAVA_HOME
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=true
        EOF
        
        echo "📁 Project structure initialized"
        ls -la
        
    - name: Gradle Wrapper Health Check & Auto-Fix
      run: |
        echo "=== GRADLE WRAPPER HEALTH CHECK ==="
        
        # Check if gradlew exists and is executable
        if [ ! -f "gradlew" ]; then
          echo "❌ gradlew missing, regenerating..."
          ./gradle/wrapper/gradle-wrapper.jar --gradle-version 8.3
        fi
        
        # Fix permissions
        chmod +x gradlew
        
        # Verify wrapper integrity
        if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "Gradle wrapper JAR size: $jar_size bytes"
          
          if [ "$jar_size" -eq 63721 ]; then
            echo "✅ Gradle wrapper integrity verified"
          else
            echo "⚠️ Gradle wrapper size mismatch, attempting repair..."
            
            # Download fresh wrapper
            curl -L https://services.gradle.org/distributions/gradle-8.3-bin.zip -o gradle-8.3-bin.zip
            unzip -q gradle-8.3-bin.zip
            cp gradle-8.3/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            rm -rf gradle-8.3 gradle-8.3-bin.zip
            
            chmod +x gradlew
          fi
        fi
        
    - name: Download AAPT2 for Manifest Validation (Testrigor Fix)
      run: |
        echo "=== DOWNLOADING AAPT2 FOR TESTRIGOR COMPATIBILITY ==="
        
        # Download AAPT2 from Maven Central for APK manifest validation
        AAPT2_URL="https://dl.google.com/android/maven2/com/android/tools/build/aapt2/8.1.4-10154469/aapt2-8.1.4-10154469-linux.jar"
        
        echo "Downloading AAPT2 for manifest integrity validation..."
        curl -L "$AAPT2_URL" -o aapt2.jar
        
        if [ -f "aapt2.jar" ]; then
          echo "✅ AAPT2 downloaded successfully for Testrigor manifest validation"
          ls -la aapt2.jar
        else
          echo "⚠️ AAPT2 download failed, continuing without enhanced validation"
        fi
        
    - name: Pre-Build Android Plugin Initialization
      run: |
        echo "=== ANDROID PLUGIN INITIALIZATION ==="
        
        # Force Android plugin loading
        ./gradlew :app:preBuild --no-daemon --stacktrace || true
        
        # List available Gradle tasks for debugging
        echo "Available Gradle tasks:"
        ./gradlew tasks --all --no-daemon | grep -E "(assemble|bundle)" | head -20
        
    - name: Ultimate Multi-Tier Android Build
      run: |
        echo "=== ULTIMATE MULTI-TIER ANDROID BUILD ==="
        
        BUILD_TYPE="${{ inputs.build_type || 'both' }}"
        FORCE_CLEAN="${{ inputs.force_clean }}"
        
        echo "Build configuration:"
        echo "- Build Type: $BUILD_TYPE"
        echo "- Force Clean: $FORCE_CLEAN"
        echo "- Java Home: $JAVA_HOME"
        echo "- Android SDK: $ANDROID_HOME"
        
        # Force clean if requested
        if [ "$FORCE_CLEAN" == "true" ]; then
          echo "🧹 Force cleaning Gradle cache..."
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
        fi
        
        # Build strategy functions
        build_debug() {
          echo "🔨 Building DEBUG APK..."
          
          # Strategy 1: Standard assembleDebug
          if ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "✅ DEBUG: Strategy 1 successful (assembleDebug)"
            return 0
          fi
          
          # Strategy 2: Module-specific
          if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
            echo "✅ DEBUG: Strategy 2 successful (:app:assembleDebug)"
            return 0
          fi
          
          # Strategy 3: Direct build
          if ./gradlew :app:build --no-daemon --stacktrace; then
            echo "✅ DEBUG: Strategy 3 successful (:app:build)"
            return 0
          fi
          
          # Strategy 4: Alternative configuration
          if ./gradlew clean assembleDebug --no-daemon --offline --stacktrace; then
            echo "✅ DEBUG: Strategy 4 successful (clean + assembleDebug offline)"
            return 0
          fi
          
          echo "❌ DEBUG: All build strategies failed"
          return 1
        }
        
        build_release() {
          echo "🔨 Building RELEASE APK and AAB..."
          
          # Strategy 1: Standard release build
          if ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace; then
            echo "✅ RELEASE: Strategy 1 successful (assembleRelease + bundleRelease)"
            return 0
          fi
          
          # Strategy 2: Module-specific
          if ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace; then
            echo "✅ RELEASE: Strategy 2 successful (:app:assembleRelease + :app:bundleRelease)"
            return 0
          fi
          
          # Strategy 3: Sequential builds
          if ./gradlew :app:assembleRelease --no-daemon --stacktrace && \
             ./gradlew :app:bundleRelease --no-daemon --stacktrace; then
            echo "✅ RELEASE: Strategy 3 successful (sequential builds)"
            return 0
          fi
          
          # Strategy 4: Clean and rebuild
          if ./gradlew clean :app:assembleRelease --no-daemon --stacktrace; then
            echo "✅ RELEASE: Strategy 4 successful (clean + assembleRelease)"
            return 0
          fi
          
          echo "❌ RELEASE: All build strategies failed"
          return 1
        }
        
        # Execute builds based on build_type
        DEBUG_SUCCESS=false
        RELEASE_SUCCESS=false
        
        if [ "$BUILD_TYPE" == "debug" ] || [ "$BUILD_TYPE" == "both" ]; then
          if build_debug; then
            DEBUG_SUCCESS=true
          fi
        fi
        
        if [ "$BUILD_TYPE" == "release" ] || [ "$BUILD_TYPE" == "both" ]; then
          if build_release; then
            RELEASE_SUCCESS=true
          fi
        fi
        
        # Final status check
        echo ""
        echo "BUILD RESULTS:"
        echo "=============="
        echo "DEBUG Build: $DEBUG_SUCCESS"
        echo "RELEASE Build: $RELEASE_SUCCESS"
        
        # Look for generated artifacts
        echo ""
        echo "Searching for build artifacts..."
        find . -name "*.apk" -o -name "*.aab" -type f | while read file; do
          size=$(stat -c%s "$file" 2>/dev/null || echo "unknown")
          echo "Found: $file ($size bytes)"
        done
        
    - name: APK/AAB Integrity Validation (Testrigor Compatibility)
      run: |
        echo "=== APK/AAB INTEGRITY VALIDATION FOR TESTRIGOR ==="
        
        # Find all generated APK and AAB files
        apk_files=$(find . -name "*.apk" -type f)
        aab_files=$(find . -name "*.aab" -type f)
        
        total_files=$(($(echo "$apk_files" | wc -w) + $(echo "$aab_files" | wc -w)))
        
        if [ "$total_files" -eq 0 ]; then
          echo "❌ No APK or AAB files found for validation"
          exit 0
        fi
        
        echo "📦 Validating $total_files artifact(s) for Testrigor compatibility..."
        
        # Validate each APK file
        for apk in $apk_files; do
          if [ -f "$apk" ]; then
            echo ""
            echo "🔍 Validating APK: $apk"
            
            # Basic file integrity check
            file_size=$(stat -c%s "$apk")
            echo "  File size: $file_size bytes"
            
            if [ "$file_size" -lt 1000 ]; then
              echo "  ⚠️ APK file too small, possible corruption"
              continue
            fi
            
            # Android manifest validation using AAPT2 (Testrigor fix)
            if [ -f "aapt2.jar" ]; then
              echo "  🔧 Running AAPT2 manifest validation..."
              
              # Extract manifest using AAPT2
              if java -jar aapt2.jar dump badging "$apk" > /dev/null 2>&1; then
                echo "  ✅ APK manifest validation passed"
                
                # Extract version info for verification
                version_info=$(java -jar aapt2.jar dump badging "$apk" 2>/dev/null | grep -E "versionCode|versionName" | head -2)
                echo "  📋 Version info: $version_info"
                
              else
                echo "  ❌ APK manifest validation failed - potential 'chunk type:16188' error"
                
                # Attempt to rebuild APK if validation fails
                echo "  🔄 Attempting APK rebuild for Testrigor compatibility..."
                
                # Try to rebuild with additional validation
                if ./gradlew clean assembleRelease --no-daemon --stacktrace; then
                  echo "  ✅ APK rebuild successful"
                else
                  echo "  ❌ APK rebuild failed"
                fi
              fi
            else
              echo "  ⚠️ AAPT2 not available, skipping detailed validation"
            fi
            
            # Create final renamed artifact for easy identification
            base_name=$(basename "$apk")
            final_name="LinguaLink-Testrigor-Final-v1.0.68.apk"
            
            if [ "$base_name" != "$final_name" ]; then
              cp "$apk" "./$final_name"
              echo "  📋 Created final artifact: $final_name"
            fi
          fi
        done
        
        # Validate each AAB file  
        for aab in $aab_files; do
          if [ -f "$aab" ]; then
            echo ""
            echo "🔍 Validating AAB: $aab"
            
            file_size=$(stat -c%s "$aab")
            echo "  File size: $file_size bytes"
            
            if [ "$file_size" -lt 1000 ]; then
              echo "  ⚠️ AAB file too small, possible corruption"
              continue
            fi
            
            # Basic AAB validation (AAB is a ZIP file)
            if unzip -t "$aab" > /dev/null 2>&1; then
              echo "  ✅ AAB archive integrity verified"
            else
              echo "  ❌ AAB archive corruption detected"
            fi
            
            # Create final renamed artifact
            base_name=$(basename "$aab")
            final_name="LinguaLink-Testrigor-Final-v1.0.68.aab"
            
            if [ "$base_name" != "$final_name" ]; then
              cp "$aab" "./$final_name"
              echo "  📋 Created final artifact: $final_name"
            fi
          fi
        done
        
        echo ""
        echo "✅ APK/AAB integrity validation completed"
        
    - name: Final Artifact Summary
      run: |
        echo "=== FINAL BUILD ARTIFACT SUMMARY ==="
        
        # Count artifacts
        apk_count=$(find . -name "*.apk" -type f | wc -l)
        aab_count=$(find . -name "*.aab" -type f | wc -l)
        total_artifacts=$((apk_count + aab_count))
        
        echo "📊 Build Results:"
        echo "- APK Files: $apk_count"
        echo "- AAB Files: $aab_count"  
        echo "- Total Artifacts: $total_artifacts"
        echo ""
        
        if [ "$total_artifacts" -gt 0 ]; then
          echo "✅ ULTIMATE ANDROID BUILD: SUCCESS"
          echo ""
          echo "Generated Artifacts with Testrigor Compatibility Check:"
          find . -name "*.apk" -o -name "*.aab" -type f | while read file; do
            size=$(stat -c%s "$file" 2>/dev/null || echo "unknown")
            echo "  - $file ($size bytes)"
          done
        else
          echo "❌ ULTIMATE ANDROID BUILD: FAILED"
          echo "No artifacts were generated despite all attempts"
        fi
        
        echo ""
        echo "Gradle Wrapper Status:"
        if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          wrapper_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "✅ Gradle Wrapper: $wrapper_size bytes"
        else
          echo "❌ Gradle Wrapper: Missing"
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-ultimate-build-artifacts-${{ inputs.build_type || 'both' }}-${{ github.run_number }}
        path: |
          **/*.apk
          **/*.aab
          app/build/outputs/apk/**/*
          app/build/outputs/bundle/**/*
          build/outputs/apk/**/*
          build/outputs/bundle/**/*
          gradle.properties
          local.properties
          gradlew*
          gradle/wrapper/gradle-wrapper.jar
          gradle/wrapper/gradle-wrapper.properties
        retention-days: 30
        if-no-files-found: warn

    - name: Ultimate Build Summary
      if: always()
      run: |
        echo "========================================"
        echo "ULTIMATE ANDROID BUILD SUMMARY"
        echo "========================================"
        echo ""
        echo "Build Configuration:"
        echo "- Build Type: ${{ inputs.build_type || 'both' }}"
        echo "- Force Clean: ${{ inputs.force_clean }}"
        echo "- Java Version: $(java -version 2>&1 | head -1)"
        echo "- Android SDK: $ANDROID_HOME"
        echo "- Gradle Version: $(./gradlew --version --no-daemon | grep 'Gradle' | head -1)"
        echo ""
        
        # Final artifact count
        apk_count=$(find . -name "*.apk" -type f | wc -l)
        aab_count=$(find . -name "*.aab" -type f | wc -l)
        total_artifacts=$((apk_count + aab_count))
        
        echo "Final Results:"
        echo "- APK Files Generated: $apk_count"
        echo "- AAB Files Generated: $aab_count"
        echo "- Total Artifacts: $total_artifacts"
        echo ""
        
        if [ "$total_artifacts" -gt 0 ]; then
          echo "✅ ULTIMATE ANDROID BUILD: SUCCESS"
          echo ""
          echo "Generated Artifacts:"
          find . -name "*.apk" -o -name "*.aab" -type f | while read file; do
            size=$(stat -c%s "$file" 2>/dev/null || echo "unknown")
            echo "  - $file ($size bytes)"
          done
        else
          echo "❌ ULTIMATE ANDROID BUILD: FAILED"
          echo "No artifacts were generated despite all attempts"
        fi
        
        echo ""
        echo "Gradle Wrapper Status:"
        if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          wrapper_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "✅ Gradle Wrapper: $wrapper_size bytes"
        else
          echo "❌ Gradle Wrapper: Missing"
        fi
        
        echo ""
        echo "========================================"
        echo "ULTIMATE ANDROID BUILD COMPLETE"
        echo "========================================"
