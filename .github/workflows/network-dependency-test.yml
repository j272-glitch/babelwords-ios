name: Test Network Dependency Chain

on:
  workflow_dispatch:

jobs:
  test-network-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Test Without Cache
      working-directory: android
      run: |
        echo "=== TESTING WITHOUT GRADLE CACHE ==="
        echo "This simulates first-time container run"
        
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8"
        
        echo "Cache status before test:"
        ls -la ~/.gradle/wrapper/dists/ 2>/dev/null || echo "No cache directory"
        
        echo "Testing Gradle wrapper (will download ~100MB gradle-8.3-bin.zip):"
        timeout 300 ./gradlew --version --no-daemon || echo "Download test completed or timed out"
        
        echo "Cache status after test:"
        ls -la ~/.gradle/wrapper/dists/ 2>/dev/null || echo "Cache creation failed"
        
    - name: Cache Gradle Distribution
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper/dists
        key: network-test-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          network-test-${{ runner.os }}-gradle-
          
    - name: Test With Cache
      working-directory: android
      run: |
        echo "=== TESTING WITH GRADLE CACHE ==="
        echo "This simulates subsequent container runs"
        
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8"
        
        echo "Cache status:"
        ls -la ~/.gradle/wrapper/dists/ 2>/dev/null || echo "No cached distribution"
        
        echo "Testing Gradle wrapper with cache:"
        if ./gradlew --version --no-daemon; then
            echo "✅ Wrapper working with cached distribution"
        else
            echo "❌ Wrapper failed even with cache"
        fi
        
    - name: Test Offline Mode
      working-directory: android
      run: |
        echo "=== TESTING OFFLINE MODE ==="
        echo "This tests if cached distribution works without network"
        
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8"
        
        if ./gradlew --version --offline --no-daemon; then
            echo "✅ Offline mode working - distribution fully cached"
        else
            echo "❌ Offline mode failed - dependencies not fully cached"
        fi
        
    - name: Test Network Timeout Resilience
      working-directory: android
      run: |
        echo "=== TESTING NETWORK TIMEOUT RESILIENCE ==="
        
        export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME -Dfile.encoding=UTF-8"
        
        echo "Testing with gradle.properties timeout (30s):"
        grep "network.timeout" gradle.properties || echo "No timeout configured"
        
        echo "Testing with explicit command timeout:"
        if ./gradlew --version --no-daemon --network-timeout 30000; then
            echo "✅ Extended timeout configuration working"
        else
            echo "❌ Extended timeout failed"
        fi
        
    - name: Network Dependency Summary
      run: |
        echo "=== NETWORK DEPENDENCY CHAIN ANALYSIS ==="
        echo ""
        echo "Distribution size: ~100MB (gradle-8.3-bin.zip)"
        echo "Download source: https://services.gradle.org/distributions/"
        echo "Cache location: ~/.gradle/wrapper/dists/"
        echo "Timeout configuration: 30 seconds (gradle.properties)"
        echo ""
        echo "Caching strategy:"
        echo "1. ✅ GitHub Actions cache for ~/.gradle/wrapper/dists"
        echo "2. ✅ Extended network timeout (30s)"
        echo "3. ✅ Retry logic with fallback to offline mode"
        echo "4. ✅ Pre-download verification in CI workflows"