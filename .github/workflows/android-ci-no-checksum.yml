name: Android CI - No Checksum
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
        - both

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: j272-glitch/lingualink-android2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Verify Java Installation
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        echo "Java version:"
        java -version
        echo "Javac version:"
        javac -version

    - name: Nuclear Cache Destruction
      run: |
        echo "=== DESTROYING ALL GRADLE CACHES ==="
        rm -rf ~/.gradle/
        rm -rf $HOME/.gradle/
        rm -rf /home/runner/.gradle/
        sudo rm -rf /root/.gradle/ 2>/dev/null || true
        rm -rf .gradle/
        rm -rf */build/
        rm -rf build/
        rm -rf gradle/
        rm -rf gradlew*
        echo "Cache destruction complete"

    - name: Setup Isolated Environment
      run: |
        echo "=== ISOLATED GRADLE ENVIRONMENT ==="
        export GRADLE_USER_HOME="/tmp/isolated-gradle-$(date +%s)"
        mkdir -p "$GRADLE_USER_HOME"
        echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> $GITHUB_ENV
        echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME -Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false -Dorg.gradle.caching=false" >> $GITHUB_ENV
        echo "JAVA_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV

    - name: Create Missing Android Resources
      run: |
        echo "=== CREATING ANDROID RESOURCES ==="
        
        # Create local.properties
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_NDK_ROOT
        EOF
        
        # Create gradle.properties
        cat > gradle.properties << EOF
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.daemon=false
        org.gradle.caching=false
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        org.gradle.parallel=false
        EOF
        
        echo "Android resources created"

    - name: Download and Extract Gradle 8.3
      run: |
        echo "=== DOWNLOADING GRADLE 8.3 ==="
        
        # Create clean download directory
        mkdir -p gradle-download-temp
        cd gradle-download-temp
        
        # Download Gradle 8.3 distribution (no checksum verification)
        echo "Downloading Gradle 8.3..."
        curl -L -o gradle-8.3-bin.zip https://services.gradle.org/distributions/gradle-8.3-bin.zip
        
        # Extract Gradle
        echo "Extracting Gradle..."
        unzip -q gradle-8.3-bin.zip
        
        # Verify extraction
        GRADLE_HOME="$(pwd)/gradle-8.3"
        echo "Gradle Home: $GRADLE_HOME"
        if [ -f "$GRADLE_HOME/lib/gradle-wrapper.jar" ]; then
          echo "Wrapper JAR found: $GRADLE_HOME/lib/gradle-wrapper.jar"
          ls -la "$GRADLE_HOME/lib/gradle-wrapper.jar"
        else
          echo "ERROR: gradle-wrapper.jar not found in $GRADLE_HOME/lib/"
          exit 1
        fi
        
        cd ..

    - name: Extract Wrapper JAR
      run: |
        echo "=== EXTRACTING WRAPPER JAR ==="
        
        GRADLE_HOME="gradle-download-temp/gradle-8.3"
        
        # Use standard gradle-wrapper.jar
        if [ -f "$GRADLE_HOME/lib/gradle-wrapper.jar" ]; then
          echo "Found gradle-wrapper.jar"
          cp "$GRADLE_HOME/lib/gradle-wrapper.jar" gradle-wrapper.jar
          ls -la gradle-wrapper.jar
          
          # Verify JAR contains GradleWrapperMain
          if unzip -l gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
            echo "✅ JAR contains GradleWrapperMain"
          else
            echo "❌ JAR missing GradleWrapperMain"
            exit 1
          fi
        else
          echo "ERROR: gradle-wrapper.jar not found in $GRADLE_HOME/lib/"
          exit 1
        fi

    - name: Generate Fresh Wrapper
      run: |
        echo "=== GENERATE FRESH WRAPPER ==="
        
        # Create gradle wrapper directory structure
        mkdir -p gradle/wrapper
        
        # Copy the verified wrapper jar
        cp gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
        
        # Verify JAR contents
        echo "Verifying JAR contents..."
        if unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain"; then
          echo "✅ JAR contains GradleWrapperMain"
        else
          echo "❌ JAR missing GradleWrapperMain"
          exit 1
        fi
        
        # Create gradle-wrapper.properties (no checksum)
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Generate working gradlew script
        cat > gradlew << 'EOF'
        #!/usr/bin/env sh

        # Determine the Java executable to use
        if [ -n "$JAVA_HOME" ] ; then
            if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                # IBM's JDK on AIX uses strange locations
                JAVACMD="$JAVA_HOME/jre/sh/java"
            else
                JAVACMD="$JAVA_HOME/bin/java"
            fi
            if [ ! -x "$JAVACMD" ] ; then
                echo "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME"
                exit 1
            fi
        else
            JAVACMD="java"
            if ! which java >/dev/null 2>&1 ; then
                echo "ERROR: JAVA_HOME is not set and no 'java' command found in PATH"
                exit 1
            fi
        fi

        # Increase file descriptors if possible
        MAX_FD_LIMIT=$(ulimit -H -n)
        if [ $? -eq 0 ] ; then
            ulimit -n "$MAX_FD_LIMIT" >/dev/null 2>&1 || echo "Could not set max file descriptors"
        fi

        # Determine script location
        APP_HOME=$(cd "${0%/*}" && pwd)

        # Execute Gradle
        exec "$JAVACMD" \
            -Dorg.gradle.appname=gradlew \
            -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
        EOF
        
        chmod +x gradlew
        
        echo "Fresh wrapper generation complete!"
        echo "Wrapper verification:"
        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Test Wrapper
      run: |
        echo "=== WRAPPER TESTING ==="
        
        # Test 1: Verify JAR file integrity
        echo "Test 1: JAR file integrity"
        file gradle/wrapper/gradle-wrapper.jar
        
        # Test 2: Check JAR contents
        echo "Test 2: JAR contents verification"
        unzip -l gradle/wrapper/gradle-wrapper.jar | head -10
        
        # Test 3: Test wrapper version command
        echo "Test 3: Wrapper version test"
        timeout 30 ./gradlew --version || echo "Version test timed out or failed"

    - name: Build Android APK
      run: |
        echo "=== BUILDING ANDROID APK ==="
        
        # Build based on input
        build_type="${{ github.event.inputs.build_type }}"
        
        if [ "$build_type" = "debug" ] || [ "$build_type" = "both" ]; then
          echo "Building debug APK..."
          timeout 1200 ./gradlew assembleDebug --stacktrace --info --no-daemon || echo "Debug build failed or timed out"
        fi
        
        if [ "$build_type" = "release" ] || [ "$build_type" = "both" ]; then
          echo "Building release APK..."
          timeout 1200 ./gradlew assembleRelease --stacktrace --info --no-daemon || echo "Release build failed or timed out"
        fi
        
        echo "Build completed"

    - name: Locate APK Files
      run: |
        echo "=== LOCATING APK FILES ==="
        find . -name "*.apk" -type f -exec ls -la {} \;
        find . -name "*.aab" -type f -exec ls -la {} \;
        
        # Create a summary of built files
        echo "Build summary:" > build_summary.txt
        find . -name "*.apk" -o -name "*.aab" | while read file; do
          echo "Found: $file ($(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes)" >> build_summary.txt
        done
        cat build_summary.txt

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-apks-no-checksum-${{ github.event.inputs.build_type }}-${{ github.run_number }}
        path: |
          **/*.apk
          **/*.aab
          build_summary.txt
          gradle/wrapper/gradle-wrapper.jar
        retention-days: 30
