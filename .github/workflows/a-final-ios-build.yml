name: A-Final LinguaLink iOS Build (Team-Fixed-v2) (Definitive)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

env:
  CACHE_BUSTER: team-fixed-v2-${{ github.run_number }}-${{ github.sha }}
  
jobs:
  ios-build-final:
    name: iOS Build Final (Fixed Export)
    runs-on: macos-14
    
    steps:
    - name: Initialize Final Build
      run: |
        echo "FINAL LINGUALINK IOS BUILD - TEAM FIXED V2"
        echo "=========================================="
        echo "Run ID: ${{ github.run_id }}"
        echo "Build Type: ${{ inputs.build_type || 'Release' }}"
        echo "Cache Buster: ${{ env.CACHE_BUSTER }}"
        echo "Workflow Version: Team-Fixed-v2 ($(date))"
        echo "This should show the NEW team detection logic"
        
    - name: Fresh Repository Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true
        
    - name: Node.js Setup (No Cache)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Clear All Caches
      run: |
        echo "Clearing all possible caches..."
        npm cache clean --force || true
        rm -rf node_modules || true
        rm -rf package-lock.json || true
        rm -rf ~/.npm || true
        rm -rf ios || true
        rm -rf build || true
        rm -rf .capacitor || true
        rm -rf ~/Library/Developer/Xcode/DerivedData || true
        echo "All caches cleared successfully"
        
    - name: Fresh Dependencies Install
      run: |
        echo "Installing dependencies with no cache..."
        npm install --no-audit --no-fund --prefer-offline=false
        echo "Fresh dependencies installed successfully"
        
    - name: Build Client Assets
      run: |
        echo "Building client assets..."
        npx vite build
        echo "Client assets built successfully"
        
    - name: Setup Capacitor iOS (Fresh)
      run: |
        echo "Installing fresh Capacitor CLI..."
        npm install -g @capacitor/cli
        
        echo "Adding iOS platform..."
        npx cap add ios
        
        echo "Syncing web assets..."
        npx cap sync ios
        echo "Capacitor iOS setup complete"
        
    - name: Configure iOS Project
      run: |
        echo "Configuring iOS project..."
        cd ios/App
        
        # Fixed team ID for consistent signing throughout workflow
        TEAM_ID="YBQZK8T3LU"
        echo "Using fixed team ID for all signing operations: $TEAM_ID"
        
        # Update project.pbxproj for AUTOMATIC signing with team
        echo "Updating project configuration with team ID: $TEAM_ID"
        
        # Comprehensive sed replacements for all build configurations (App project)
        sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' App.xcodeproj/project.pbxproj || true
        sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" App.xcodeproj/project.pbxproj || true
        sed -i '' "s/DEVELOPMENT_TEAM = \"\*\";/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" App.xcodeproj/project.pbxproj || true
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' App.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj || true
        
        # Configure Pods project for automatic signing
        echo "Configuring Pods project for automatic signing..."
        sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Pods/Pods.xcodeproj/project.pbxproj || true
        sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$TEAM_ID\"/g" Pods/Pods.xcodeproj/project.pbxproj || true
        sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" Pods/Pods.xcodeproj/project.pbxproj || true
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' Pods/Pods.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' Pods/Pods.xcodeproj/project.pbxproj || true
        
        # Force ALL build settings to AUTOMATIC signing with enhanced sed replacements
        echo "Applying comprehensive project configuration updates..."
        
        # Replace all CODE_SIGN_STYLE settings
        sed -i '' 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Automatic;/g' App.xcodeproj/project.pbxproj || true
        
        # Replace all DEVELOPMENT_TEAM settings with our team ID
        sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = \"$TEAM_ID\";/g" App.xcodeproj/project.pbxproj || true
        
        # Clear all provisioning profile specifiers
        sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' App.xcodeproj/project.pbxproj || true
        
        # Clear code sign identity to allow automatic selection
        sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj || true
        
        echo "Project configuration updated with team ID: $TEAM_ID"
        
        # Verify the changes
        echo "Verifying team assignment in project file:"
        grep -n "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj | head -5 || echo "No DEVELOPMENT_TEAM entries found"
        
        # Set app metadata
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LinguaLink" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LinguaLink" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.0.0" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1.0.0" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.0" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lingualink.ios" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.lingualink.ios" App/Info.plist
        
        # Set permissions
        /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'LinguaLink requires microphone access for speech recognition and translation features.'" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'LinguaLink requires microphone access for speech recognition and translation features.'" App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'LinguaLink uses speech recognition to convert your voice into text for translation.'" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'LinguaLink uses speech recognition to convert your voice into text for translation.'" App/Info.plist
        
        echo "iOS project configured successfully"
        
    - name: Build iOS Archive (Fixed Signing)
      run: |
        echo "Building iOS archive with simplest possible configuration..."
        cd ios/App
        
        # Clean any previous builds
        rm -rf build
        mkdir -p build
        
        # Fixed team ID approach - no dynamic detection needed
        TEAM_ID="YBQZK8T3LU"
        echo "Using fixed team ID for GitHub Actions: $TEAM_ID"
        
        # Skip certificate detection completely in CI environment
        echo "GitHub Actions environment detected - using fixed signing configuration"
        
        # Build archive with simplest possible configuration
        xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath build/LinguaLink.xcarchive \
          archive
          
        echo "iOS archive built successfully"
          
    - name: Export IPA (FIXED - Development Method with Automatic Signing)
      run: |
        echo "Exporting IPA with simplest development method..."
        cd ios/App
        
        # Fixed team ID for export (no detection needed)
        TEAM_ID="YBQZK8T3LU"
        echo "Using fixed team ID for export: $TEAM_ID"
        
        # Create simplest possible ExportOptions.plist
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
        </dict>
        </plist>
        EOF
        
        echo "Simplest ExportOptions.plist created with development method only"
        cat ExportOptions.plist
        
        # Export IPA with simplest possible configuration
        xcodebuild \
          -exportArchive \
          -archivePath build/LinguaLink.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist
          
        echo "IPA export completed successfully"
          
    - name: Validate Build Artifacts
      run: |
        echo "Validating build artifacts..."
        cd ios/App/build
        
        # Find IPA file
        IPA_FILE=$(find . -name "*.ipa" | head -1)
        if [ -z "$IPA_FILE" ]; then
          echo "ERROR: No IPA file found"
          echo "Directory contents:"
          ls -la
          exit 1
        fi
        
        # Get file size
        IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat -c%s "$IPA_FILE")
        IPA_SIZE_MB=$((IPA_SIZE / 1024 / 1024))
        
        echo "SUCCESS: IPA file found: $IPA_FILE"
        echo "Size: ${IPA_SIZE_MB}MB"
        
        # Create build summary
        echo "LinguaLink iOS Build Summary - Final Fixed" > build-summary.txt
        echo "=========================================" >> build-summary.txt
        echo "" >> build-summary.txt
        echo "Build Type: ${{ inputs.build_type || 'Release' }}" >> build-summary.txt
        echo "Build Date: $(date)" >> build-summary.txt
        echo "IPA File: $IPA_FILE" >> build-summary.txt
        echo "File Size: ${IPA_SIZE_MB}MB" >> build-summary.txt
        echo "Signing: Automatic (Comprehensive)" >> build-summary.txt
        echo "Method: Development (Automatic)" >> build-summary.txt
        echo "Run ID: ${{ github.run_id }}" >> build-summary.txt
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinguaLink-iOS-FINAL-${{ inputs.build_type || 'Release' }}-${{ github.run_number }}
        path: ios/App/build/*.ipa
        retention-days: 90
        
    - name: Upload Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinguaLink-Archive-FINAL-${{ github.run_number }}
        path: ios/App/build/LinguaLink.xcarchive
        retention-days: 30
        
    - name: Upload Build Summary
      uses: actions/upload-artifact@v4
      with:
        name: LinguaLink-BuildSummary-FINAL-${{ github.run_number }}
        path: ios/App/build/build-summary.txt
        retention-days: 30
        
    - name: Build Complete
      run: |
        echo "LINGUALINK IOS BUILD COMPLETE - EXPORT FIXED"
        echo "============================================"
        echo ""
        echo "Archive: LinguaLink.xcarchive"
        echo "IPA: Successfully exported with automatic signing"
        echo "Build Type: ${{ inputs.build_type || 'Release' }}"
        echo "Method: Development (FIXED)"
        echo "Signing: Automatic (FIXED)"
        echo "Artifacts: Uploaded to GitHub"
        echo ""
        echo "Ready for testing and distribution!"
        echo "Export configuration permanently fixed"