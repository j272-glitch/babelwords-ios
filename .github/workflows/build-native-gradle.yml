name: Build Native Android with System Gradle

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Check available Gradle
      run: |
        which gradle || echo "No system gradle"
        gradle --version || echo "No gradle command"
        
    - name: Install Gradle 8.3
      run: |
        wget https://services.gradle.org/distributions/gradle-8.3-bin.zip
        unzip -q gradle-8.3-bin.zip
        export PATH=$PWD/gradle-8.3/bin:$PATH
        gradle --version
        
    - name: Build with native Gradle
      working-directory: android
      run: |
        export PATH=$PWD/../gradle-8.3/bin:$PATH
        gradle clean --no-daemon --stacktrace
        gradle assembleDebug --no-daemon --stacktrace
        gradle bundleDebug --no-daemon --stacktrace
        
    - name: Copy artifacts
      working-directory: android
      run: |
        mkdir -p ../final-outputs
        find . -name "*.apk" -path "*/debug/*" -exec cp {} ../final-outputs/LinguaLink-Native-System-v1.0.68.apk \;
        find . -name "*.aab" -path "*/debug/*" -exec cp {} ../final-outputs/LinguaLink-Native-System-v1.0.68.aab \;
        ls -la ../final-outputs/
        
    - name: Upload System Gradle APK
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-system-gradle-apk
        path: final-outputs/LinguaLink-Native-System-v1.0.68.apk
        
    - name: Upload System Gradle AAB
      uses: actions/upload-artifact@v4
      with:
        name: lingualink-system-gradle-aab
        path: final-outputs/LinguaLink-Native-System-v1.0.68.aab