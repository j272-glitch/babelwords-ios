# Project-wide Gradle settings for TestRigor compatibility

# ===========================
# JVM and Memory Configuration
# ===========================
# Increased heap size for better build performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Java Home Configuration
# Option 1: Let Gradle auto-detect from JAVA_HOME environment variable (RECOMMENDED)
# Option 2: Uncomment and set path for your OS:
# Windows: org.gradle.java.home=C:/Program Files/Java/jdk-17
# macOS: org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
# Linux: org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# ===========================
# Gradle 8.7 Performance Features
# ===========================
# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Enable configuration cache (Gradle 8.7 feature)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.max-problems=512

# Enable file system watching for incremental builds
org.gradle.vfs.watch=true

# Keep daemon alive for 3 hours (default is 10800000 ms)
org.gradle.daemon.idletimeout=10800000

# ===========================
# Android Build Configuration
# ===========================
# Use AndroidX instead of Support Library
android.useAndroidX=true

# IMPORTANT: Disable Jetifier for better performance (if all dependencies are AndroidX)
android.enableJetifier=false

# R8 Configuration (ProGuard replacement)
android.enableR8.fullMode=false
android.r8.failOnMissingClasses=false

# Resource optimizations (DISABLED for TestRigor)
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.enableResourceOptimizations=false

# AAPT2 configuration
android.enableAapt2=true
android.aaptOptions.namespaced=false

# Build cache
android.buildCache.enabled=true
android.enableBuildCache=true

# ===========================
# TestRigor Compatibility Settings (CRITICAL)
# ===========================
# Use legacy DEX packaging for TestRigor compatibility
android.useLegacyPackaging=true

# Disable experimental features that might cause issues
android.experimental.legacyTransform.forceNonIncremental=true
android.enableSeparateAnnotationProcessing=false

# Disable ALL optimizations that can corrupt APK manifest
android.enableResourceOptimizations=false
android.enableMinification=false
android.enableNewResourceShrinker=false

# Legacy build settings for compatibility
android.enableD8.desugaring=true
android.enableIncrementalDesugaring=false

# Disable new packaging features
android.enableNewApkCreator=false
android.keepTimestampsInApk=false

# ===========================
# Build Features Configuration
# ===========================
# Default build features (can be overridden in build.gradle)
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=false
android.defaults.buildfeatures.databinding=false
android.defaults.buildfeatures.compose=false

# ===========================
# Kotlin Configuration
# ===========================
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.parallel.tasks.in.project=true

# Kotlin compiler daemon
kotlin.compiler.execution.strategy=daemon

# Kotlin MPP stability
kotlin.mpp.stability.nowarn=true
kotlin.native.disableCompilerDaemon=false

# ===========================
# Dependency Management
# ===========================
# Check for dependency updates
dependency.check.enabled=false

# Suppress version warnings
android.suppressUnsupportedCompileSdk=34
android.suppressUnsupportedOptionWarnings=true

# ===========================
# Network Configuration (CI/CD)
# ===========================
systemProp.http.keepAlive=true
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Maven repository timeout
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Proxy settings (uncomment and configure if behind corporate proxy)
#systemProp.http.proxyHost=proxy.company.com
#systemProp.http.proxyPort=8080
#systemProp.https.proxyHost=proxy.company.com
#systemProp.https.proxyPort=8080
#systemProp.http.nonProxyHosts=localhost|127.0.0.1

# ===========================
# CI/CD Environment Detection
# ===========================
# Detect CI environment for optimized settings
ci.build=${CI}

# ===========================
# Experimental Features (Use with caution)
# ===========================
# Enable stable configuration cache
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# Isolated projects (experimental, improves performance)
org.gradle.unsafe.isolated-projects=false

# Watch file system (improves incremental build performance)
org.gradle.watch.fs.enabled=true

# ===========================
# Logging and Debugging
# ===========================
# Log level (lifecycle, quiet, warn, info, debug)
org.gradle.logging.level=lifecycle

# Show stack traces (all, summary, none)
org.gradle.warning.mode=all

# Console output style (auto, plain, rich, verbose)
org.gradle.console=auto

# ===========================
# TestRigor APK Generation Critical Notes
# ===========================
# These settings MUST remain to ensure APK compatibility with TestRigor:
# 1. android.useLegacyPackaging=true (CRITICAL - prevents DEX optimization)
# 2. android.enableResourceOptimizations=false (CRITICAL - no resource optimization)
# 3. android.enableMinification=false (CRITICAL - no code minification)
# 4. android.enableNewResourceShrinker=false (CRITICAL - no resource shrinking)
# 5. android.enableNewApkCreator=false (CRITICAL - use legacy APK creation)
#
# DO NOT CHANGE THESE SETTINGS OR TESTRIGOR WILL FAIL WITH CHUNK ERROR!

# ===========================
# Version Compatibility Matrix
# ===========================
# Gradle 8.7 + AGP 8.0.2 + JDK 17 = TestRigor Compatible
# Gradle 8.0 + AGP 8.0.2 + JDK 17 = TestRigor Compatible  
# Gradle 7.5 + AGP 7.4.2 + JDK 11 = Most Stable for TestRigor