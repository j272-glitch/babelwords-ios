<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LinguaVibe — Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: #f5f5f7;
            color: #1c1c1e;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { font-size: 16px; margin: 0 0 24px; color: #636366; max-width: 280px; }
        button {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You’re offline</h1>
    <p>LinguaVibe needs an internet connection for real-time translation.</p>
    <button onclick="window.location.reload()">Try again</button>
</body>
</html>
