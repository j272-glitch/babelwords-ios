name: BabelWords
options:
  bundleIdPrefix: com.babelwords
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

targets:
  BabelWords:
    type: application
    platform: iOS
    sources:
      - path: BabelWords
        excludes:
          - Resources/Info.plist
          - Resources/*.entitlements
    info:
      path: BabelWords/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babelwords.com
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        CODE_SIGN_ENTITLEMENTS: BabelWords/Resources/BabelWords.entitlements
    dependencies:
      - sdk: WebKit.framework
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework

  BabelWordsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabelWordsTests
    dependencies:
      - target: BabelWords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babelwords.comTests
        TEST_TARGET_NAME: BabelWords
        GENERATE_INFOPLIST_FILE: YES

  BabelWordsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabelWordsUITests
    dependencies:
      - target: BabelWords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babelwords.comUITests
        TEST_TARGET_NAME: BabelWords
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BabelWords:
    build:
      targets:
        BabelWords: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: BabelWordsTests
        - name: BabelWordsUITests
    archive:
      config: Release
      revealArchiveInOrganizer: true
