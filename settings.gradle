// settings.gradle - AGP 8.7.2 compatible with TestRigor
// Complete configuration for LinguaLink Android project

pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }

    // Plugin version management for AGP 8.7.2 and Gradle 8.10
    resolutionStrategy {
        eachPlugin {
            // Force Android Gradle Plugin to 8.7.2 - Provides full androidComponents API support
            if (requested.id.id == "com.android.application" || 
                requested.id.id == "com.android.library" ||
                requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.7.2")
            }

            // Pin Kotlin plugin version compatible with AGP 8.7.2
            if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
            }
        }
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS allows more flexibility while maintaining control
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        
        // JitPack for additional libraries
        maven { 
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        
        // IronSource/Unity LevelPlay repository
        maven {
            url = uri("https://android-sdk.is.com/")
        }
    }

    // Version catalog for consistent dependency management
    versionCatalogs {
        create("libs") {
            // Core versions - AGP 8.7.2 and Kotlin 1.9.24
            version("agp", "8.7.2")
            version("kotlin", "1.9.24")
            version("gradle", "8.10")

            // AndroidX versions - Latest stable versions compatible with AGP 8.7.2
            version("androidx-core", "1.13.1")
            version("androidx-appcompat", "1.7.0")
            version("androidx-activity", "1.9.1")
            version("androidx-fragment", "1.8.2")
            version("androidx-webkit", "1.11.0")
            version("androidx-multidex", "2.0.1")
            version("material", "1.12.0")
            
            // Lifecycle and Architecture Components
            version("androidx-lifecycle", "2.8.4")
            version("androidx-navigation", "2.7.7")
            version("androidx-work", "2.9.0")
            
            // UI Components
            version("androidx-recyclerview", "1.3.2")
            version("androidx-constraintlayout", "2.1.4")
            version("androidx-viewpager2", "1.1.0")
            version("androidx-swiperefresh", "1.1.0")
            
            // Testing
            version("androidx-test", "1.6.1")
            version("androidx-espresso", "3.6.1")
            version("junit", "4.13.2")

            // Build configuration - Updated for Android 15
            version("buildTools", "35.0.0")
            version("compileSdk", "35")
            version("minSdk", "24")
            version("targetSdk", "35")

            // Network and Data
            version("retrofit", "2.11.0")
            version("okhttp", "4.12.0")
            version("gson", "2.11.0")
            version("coroutines", "1.8.1")

            // Security and Modern Features
            version("splashscreen", "1.0.1")
            version("biometric", "1.1.0")
            version("security-crypto", "1.1.0-alpha06")

            // Library declarations
            library("androidx-core-ktx", "androidx.core", "core-ktx").versionRef("androidx-core")
            library("androidx-appcompat", "androidx.appcompat", "appcompat").versionRef("androidx-appcompat")
            library("androidx-activity-ktx", "androidx.activity", "activity-ktx").versionRef("androidx-activity")
            library("androidx-fragment-ktx", "androidx.fragment", "fragment-ktx").versionRef("androidx-fragment")
            library("androidx-webkit", "androidx.webkit", "webkit").versionRef("androidx-webkit")
            library("androidx-multidex", "androidx.multidex", "multidex").versionRef("androidx-multidex")
            library("material", "com.google.android.material", "material").versionRef("material")

            // Lifecycle libraries
            library("androidx-lifecycle-runtime-ktx", "androidx.lifecycle", "lifecycle-runtime-ktx").versionRef("androidx-lifecycle")
            library("androidx-lifecycle-viewmodel-ktx", "androidx.lifecycle", "lifecycle-viewmodel-ktx").versionRef("androidx-lifecycle")
            library("androidx-lifecycle-livedata-ktx", "androidx.lifecycle", "lifecycle-livedata-ktx").versionRef("androidx-lifecycle")
            library("androidx-lifecycle-process", "androidx.lifecycle", "lifecycle-process").versionRef("androidx-lifecycle")

            // Navigation
            library("androidx-navigation-fragment-ktx", "androidx.navigation", "navigation-fragment-ktx").versionRef("androidx-navigation")
            library("androidx-navigation-ui-ktx", "androidx.navigation", "navigation-ui-ktx").versionRef("androidx-navigation")

            // UI Components
            library("androidx-recyclerview", "androidx.recyclerview", "recyclerview").versionRef("androidx-recyclerview")
            library("androidx-constraintlayout", "androidx.constraintlayout", "constraintlayout").versionRef("androidx-constraintlayout")
            library("androidx-viewpager2", "androidx.viewpager2", "viewpager2").versionRef("androidx-viewpager2")
            library("androidx-swiperefreshlayout", "androidx.swiperefreshlayout", "swiperefreshlayout").versionRef("androidx-swiperefresh")

            // Work Manager
            library("androidx-work-runtime-ktx", "androidx.work", "work-runtime-ktx").versionRef("androidx-work")

            // Kotlin
            library("kotlin-stdlib", "org.jetbrains.kotlin", "kotlin-stdlib").versionRef("kotlin")
            library("kotlinx-coroutines-android", "org.jetbrains.kotlinx", "kotlinx-coroutines-android").versionRef("coroutines")
            library("kotlinx-coroutines-core", "org.jetbrains.kotlinx", "kotlinx-coroutines-core").versionRef("coroutines")

            // Network
            library("retrofit", "com.squareup.retrofit2", "retrofit").versionRef("retrofit")
            library("retrofit-converter-gson", "com.squareup.retrofit2", "converter-gson").versionRef("retrofit")
            library("okhttp", "com.squareup.okhttp3", "okhttp").versionRef("okhttp")
            library("okhttp-logging-interceptor", "com.squareup.okhttp3", "logging-interceptor").versionRef("okhttp")
            library("gson", "com.google.code.gson", "gson").versionRef("gson")

            // Modern Android Features
            library("androidx-core-splashscreen", "androidx.core", "core-splashscreen").versionRef("splashscreen")
            library("androidx-biometric", "androidx.biometric", "biometric").versionRef("biometric")
            library("androidx-security-crypto", "androidx.security", "security-crypto").versionRef("security-crypto")

            // Testing
            library("junit", "junit", "junit").versionRef("junit")
            library("androidx-test-runner", "androidx.test", "runner").versionRef("androidx-test")
            library("androidx-test-rules", "androidx.test", "rules").versionRef("androidx-test")
            library("androidx-test-ext-junit", "androidx.test.ext", "junit").version("1.2.1")
            library("androidx-espresso-core", "androidx.test.espresso", "espresso-core").versionRef("androidx-espresso")

            // Plugin declarations
            plugin("android-application", "com.android.application").versionRef("agp")
            plugin("android-library", "com.android.library").versionRef("agp")
            plugin("kotlin-android", "org.jetbrains.kotlin.android").versionRef("kotlin")
            plugin("kotlin-parcelize", "org.jetbrains.kotlin.plugin.parcelize").versionRef("kotlin")
        }
    }
}

// Root project name
rootProject.name = "LinguaLink"

// Include app module
include(":app")

// Gradle 8.10 Feature Previews
enableFeaturePreview("STABLE_CONFIGURATION_CACHE")
enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

// Project-wide settings for TestRigor compatibility with AGP 8.7.2
gradle.beforeSettings { settings ->
    // Essential Android build settings
    settings.gradle.startParameter.projectProperties["android.useAndroidX"] = "true"
    settings.gradle.startParameter.projectProperties["android.enableJetifier"] = "false" // Most libraries now support AndroidX
    
    // TestRigor compatibility settings - Critical for APK testing
    settings.gradle.startParameter.projectProperties["android.useLegacyPackaging"] = "true"
    settings.gradle.startParameter.projectProperties["android.enableResourceOptimizations"] = "false"
    settings.gradle.startParameter.projectProperties["android.disableResourceValidation"] = "true"
    
    // R8/ProGuard settings for TestRigor
    settings.gradle.startParameter.projectProperties["android.enableR8.fullMode"] = "false"
    settings.gradle.startParameter.projectProperties["android.enableMinification"] = "false"
    settings.gradle.startParameter.projectProperties["android.enableShrinkResourcesByDefault"] = "false"
    
    // Performance optimizations compatible with TestRigor and AGP 8.7
    settings.gradle.startParameter.projectProperties["android.nonTransitiveRClass"] = "false"
    settings.gradle.startParameter.projectProperties["android.nonFinalResIds"] = "false"
    settings.gradle.startParameter.projectProperties["android.defaults.buildfeatures.buildconfig"] = "true"
    
    // Configuration cache support (AGP 8.7 improvement)
    settings.gradle.startParameter.projectProperties["org.gradle.configuration-cache"] = "true"
    settings.gradle.startParameter.projectProperties["org.gradle.configuration-cache.problems"] = "warn"
    
    // Note: These will be overridden by gradle.properties for TestRigor compatibility
    settings.gradle.startParameter.projectProperties["org.gradle.parallel"] = "false"
    settings.gradle.startParameter.projectProperties["org.gradle.caching"] = "false"
    
    // JVM settings for better build performance
    settings.gradle.startParameter.projectProperties["org.gradle.jvmargs"] = "-Xmx8g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g"
}

// Apply default configuration to all projects
gradle.beforeProject { project ->
    // Default build features
    project.ext["android.defaults.buildfeatures.buildconfig"] = true
    project.ext["android.defaults.buildfeatures.aidl"] = false
    project.ext["android.defaults.buildfeatures.renderscript"] = false
    project.ext["android.defaults.buildfeatures.resvalues"] = true
    project.ext["android.defaults.buildfeatures.shaders"] = false
    project.ext["android.defaults.buildfeatures.viewbinding"] = false
    project.ext["android.defaults.buildfeatures.databinding"] = false
    
    // TestRigor compatibility
    project.ext["android.packagingOptions.dex.useLegacyPackaging"] = true
    project.ext["android.experimental.enableNewResourceShrinker"] = false
    project.ext["android.enableResourceOptimizations"] = false
}

