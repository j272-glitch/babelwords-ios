// Top-level build.gradle optimized for TestRigor compatibility
// CRITICAL: Using AGP 8.0.2 which is proven to work with TestRigor
plugins {
    id 'com.android.application' version '8.0.2' apply false
    id 'com.android.library' version '8.0.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
    
    // Google services Gradle plugin for Firebase (4.4.1 compatible with firebase-bom:32.x)
    id 'com.google.gms.google-services' version '4.4.1' apply false
}

// Define common versions and configuration
ext {
    // Version configuration - CRITICAL FOR TESTRIGOR
    agp_version = '8.0.2'  // DO NOT CHANGE - 8.1.x/8.2.x cause TestRigor issues
    kotlin_version = '1.8.10'  // Compatible with AGP 8.0.2

    // SDK and build tool versions - MUST MATCH AndroidManifest.xml
    compile_sdk = 35  // Changed from 34 to match manifest
    min_sdk = 24      // Changed from 21 to match manifest
    target_sdk = 35   // Changed from 34 to match manifest
    build_tools_version = '34.0.0'

    // TestRigor compatibility flags - CRITICAL
    enableProguardInReleaseBuilds = false
    enableHermes = false
    enableShrinkResources = false
    useLegacyPackaging = true
    disableResourceOptimizations = true
    disableBinaryXmlOptimizations = true
    disablePngCrunching = true
    enableR8 = false  // Explicitly disable R8
}

// Configure all subprojects
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                // SDK configuration
                compileSdk rootProject.ext.compile_sdk
                buildToolsVersion rootProject.ext.build_tools_version

                defaultConfig {
                    minSdk rootProject.ext.min_sdk
                    targetSdk rootProject.ext.target_sdk

                    // Add version info
                    versionCode 20
                    versionName "1.0.20"

                    // Multimethod support
                    multiDexEnabled true
                }

                // Java 17 required for Gradle 8.7
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                // Kotlin options
                if (project.hasProperty('kotlin')) {
                    kotlinOptions {
                        jvmTarget = '17'
                        freeCompilerArgs += ['-Xjvm-default=all']
                    }
                }

                // Build features - disable unnecessary features
                buildFeatures {
                    buildConfig true
                    resValues true
                    shaders false
                    renderScript false
                    aidl false
                    compose false
                    dataBinding false
                    viewBinding false
                }

                // CRITICAL: Packaging options for TestRigor compatibility
                packagingOptions {
                    // Prevent APK corruption
                    doNotStrip '**/*.so'

                    // Legacy packaging for TestRigor
                    dex {
                        useLegacyPackaging = true
                    }

                    jniLibs {
                        useLegacyPackaging = true
                        keepDebugSymbols += ['**/*.so']
                    }

                    resources {
                        excludes += [
                            'META-INF/AL2.0',
                            'META-INF/LGPL2.1',
                            'META-INF/LICENSE',
                            'META-INF/LICENSE.txt',
                            'META-INF/license.txt',
                            'META-INF/NOTICE',
                            'META-INF/NOTICE.txt',
                            'META-INF/notice.txt',
                            'META-INF/*.kotlin_module',
                            'META-INF/DEPENDENCIES',
                            'META-INF/INDEX.LIST',
                            '**/**.proto',
                            '**/*.proto'
                        ]

                        // Don't merge these resources
                        pickFirsts += [
                            'META-INF/MANIFEST.MF',
                            'lib/armeabi-v7a/libnative.so',
                            'lib/arm64-v8a/libnative.so',
                            'lib/x86/libnative.so',
                            'lib/x86_64/libnative.so'
                        ]
                    }
                }

                // CRITICAL: AAPT options to prevent manifest corruption
                aaptOptions {
                    // Don't compress these files
                    noCompress = ['.apk', '.so', '.xml', '.arsc', '.png', '.webp', '.jpg', '.jpeg']

                    // Ignore problematic assets
                    ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'

                    // CRITICAL: Disable PNG crunching for TestRigor
                    cruncherEnabled = false

                    // Additional flags for compatibility
                    // Note: '--legacy' removed - not supported in AAPT2 8.5.x+
                    additionalParameters '--no-version-vectors', '--no-version-transitions'
                }

                // Dex options for compatibility
                dexOptions {
                    preDexLibraries true
                    jumboMode true
                    javaMaxHeapSize "4g"
                    keepRuntimeAnnotatedClasses false
                    additionalParameters += ['--no-optimize']
                }

                // Lint options - disable for TestRigor builds
                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                    checkAllWarnings false
                    warningsAsErrors false
                    disable 'InvalidPackage', 'MissingTranslation', 'ObsoleteLintCustomCheck'
                    quiet true
                }

                // Build type configurations
                buildTypes {
                    debug {
                        minifyEnabled false
                        shrinkResources false
                        zipAlignEnabled false  // Changed to false for TestRigor
                        multiDexEnabled true
                        debuggable true

                        // TestRigor specific
                        crunchPngs false
                        renderscriptOptimLevel 0

                        // Disable optimizations
                        packagingOptions {
                            dex {
                                useLegacyPackaging = true
                            }
                        }

                        // Signing config (if you have one)
                        // signingConfig signingConfigs.debug
                    }

                    release {
                        minifyEnabled false  // Keep disabled for TestRigor
                        shrinkResources false
                        zipAlignEnabled true
                        multiDexEnabled true

                        // TestRigor compatibility
                        crunchPngs false

                        // ProGuard disabled via minifyEnabled = false

                        // Signing config (if you have one)
                        // signingConfig signingConfigs.release
                    }
                }

                // Splits - disable for TestRigor
                splits {
                    abi {
                        enable false
                    }
                    density {
                        enable false
                    }
                    language {
                        enable false
                    }
                }

                // Bundle - disable for TestRigor
                bundle {
                    abi {
                        enableSplit false
                    }
                    density {
                        enableSplit false
                    }
                    language {
                        enableSplit false
                    }
                }

                // Test options
                testOptions {
                    unitTests {
                        includeAndroidResources = true
                        returnDefaultValues = true
                    }
                    animationsDisabled = true
                }
            }

            // Note: Resource optimization and R8 are controlled via buildTypes configuration
            // PNG crunching disabled via crunchPngs = false in buildTypes
            // R8/ProGuard disabled via minifyEnabled = false
        }
    }

    // Configure dependency resolution
    configurations.configureEach {
        resolutionStrategy {
            // Force specific versions for consistency
            force 'androidx.core:core:1.12.0'
            force 'androidx.core:core-ktx:1.12.0'
            force 'androidx.appcompat:appcompat:1.6.1'
            force 'androidx.webkit:webkit:1.8.0'
            force 'com.google.android.material:material:1.11.0'
            force 'androidx.multidex:multidex:2.0.1'

            // Cache settings
            cacheDynamicVersionsFor 10, 'minutes'
            cacheChangingModulesFor 0, 'seconds'

            // Prefer project modules
            preferProjectModules()
        }
    }

    // Configure compile tasks
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
        options.encoding = 'UTF-8'
        options.compilerArgs += [
            "-Xlint:unchecked",
            "-Xlint:deprecation",
            "-Xlint:-options"
        ]
    }

    // Configure Kotlin compile tasks
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '17'
            allWarningsAsErrors = false
            suppressWarnings = true
        }
    }
}

// Repository configuration
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
    }
}

// Root clean task
tasks.register('clean', Delete) {
    delete rootProject.buildDir
    delete fileTree(rootDir) {
        include '**/build'
        include '**/.gradle'
    }
}

// CRITICAL: Task to verify TestRigor compatibility
tasks.register('verifyTestRigorCompatibility') {
    doLast {
        println "\n================================"
        println "TestRigor Compatibility Check"
        println "================================"
        println "Build Environment:"
        println "  Gradle Version: ${gradle.gradleVersion}"
        println "  AGP Version: ${agp_version} ✓"
        println "  Kotlin Version: ${kotlin_version}"
        println "  Java Version: ${System.getProperty('java.version')}"
        println "--------------------------------"
        println "SDK Configuration:"
        println "  Compile SDK: ${compile_sdk}"
        println "  Min SDK: ${min_sdk}"
        println "  Target SDK: ${target_sdk}"
        println "  Build Tools: ${build_tools_version}"
        println "--------------------------------"
        println "TestRigor Critical Settings:"
        println "  Legacy Packaging: ${useLegacyPackaging} ✓"
        println "  ProGuard/R8: Disabled ✓"
        println "  Resource Shrinking: Disabled ✓"
        println "  PNG Crunching: Disabled ✓"
        println "  Resource Optimization: Disabled ✓"
        println "  Binary XML: Disabled ✓"
        println "================================"

        // Verify critical settings
        assert agp_version == '8.0.2' : "AGP must be 8.0.2 for TestRigor"
        assert !enableProguardInReleaseBuilds : "ProGuard must be disabled"
        assert !enableShrinkResources : "Resource shrinking must be disabled"
        assert useLegacyPackaging : "Legacy packaging must be enabled"

        println "✓ All TestRigor compatibility checks passed"
        println "================================\n"
    }
}

// Task to build TestRigor-compatible APK with verification
tasks.register('buildForTestRigor') {
    group = 'testrigor'
    description = 'Build and verify a TestRigor-compatible APK'

    dependsOn 'verifyTestRigorCompatibility'
    dependsOn ':app:clean'
    dependsOn ':app:assembleDebug'

    doLast {
        def apkPath = file("${rootDir}/app/build/outputs/apk/debug/app-debug.apk")
        if (apkPath.exists()) {
            println "\n✓ APK generated successfully:"
            println "  Path: ${apkPath.absolutePath}"
            println "  Size: ${String.format('%.2f', apkPath.length() / 1024.0 / 1024.0)} MB"

            // Verify APK structure using aapt
            println "\nVerifying APK integrity..."
            try {
                def proc = "aapt dump badging ${apkPath.absolutePath}".execute()
                def output = proc.text
                proc.waitFor()

                if (proc.exitValue() == 0) {
                    println "✓ APK structure is valid"

                    // Check for manifest
                    if (output.contains("package: name='com.lingualink.translator'")) {
                        println "✓ Package name verified"
                    }
                    if (output.contains("sdkVersion:'24'")) {
                        println "✓ Min SDK verified"
                    }
                    if (output.contains("targetSdkVersion:'35'")) {
                        println "✓ Target SDK verified"
                    }
                } else {
                    println "⚠️ APK verification failed - check aapt output"
                }
            } catch (Exception e) {
                println "⚠️ Could not run aapt verification: ${e.message}"
            }

            println "\n✓ APK is ready for TestRigor upload"
        } else {
            throw new GradleException("❌ APK not found at expected location")
        }
    }
}

// Ensure verification runs before build
afterEvaluate {
    tasks.findByPath(':app:preBuild')?.dependsOn(tasks.named('verifyTestRigorCompatibility'))
}

// Gradle configuration cache settings (disabled for compatibility)

// Print important notice on configuration
println """
