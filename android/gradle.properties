# Project-wide Gradle settings — cleaned for AGP 8.5.1 / Gradle 8.9 / Kotlin 2.2.0
#
# Deprecated properties that cause hard build failures on AGP 8.x have been removed
# (per the BabelWords AAB Build Guide): android.enableAapt2, android.enableR8,
# android.enableProguard, android.r8.failOnMissingClasses, android.enableNewResourceShrinker,
# android.enableIncrementalDesugaring, android.bundle.enableUncompressedNativeLibs,
# android.enableNewApkCreator, android.enableD8*, android.enableBuildCache, etc.

# ===========================
# JVM and Memory Configuration
# ===========================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ===========================
# Gradle Build Settings (conservative for reliable CI builds)
# ===========================
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.configureondemand=false
org.gradle.vfs.watch=false

# ===========================
# AndroidX
# ===========================
android.useAndroidX=true
android.enableJetifier=true

# ===========================
# R class handling (kept legacy for compatibility)
# ===========================
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# ===========================
# Kotlin
# ===========================
kotlin.code.style=official
kotlin.incremental=true

# ===========================
# Dependency / compileSdk warnings
# ===========================
android.suppressUnsupportedCompileSdk=35

# ===========================
# Network Configuration
# ===========================
systemProp.http.keepAlive=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# ===========================
# Logging
# ===========================
org.gradle.logging.level=lifecycle
org.gradle.warning.mode=all
org.gradle.console=auto
