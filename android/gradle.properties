# Project-wide Gradle settings for TestRigor compatibility
# CRITICAL: These settings are specifically configured to prevent APK corruption

# ===========================
# JVM and Memory Configuration
# ===========================
# Increased heap size for large builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ===========================
# Gradle Build Settings - CRITICAL FOR TESTRIGOR
# ===========================
# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# CRITICAL: Disable parallel execution to prevent APK corruption
org.gradle.parallel=false

# CRITICAL: Disable build caching to ensure clean builds
org.gradle.caching=false

# CRITICAL: Disable configuration cache (causes TestRigor issues)
org.gradle.configuration-cache=false
org.gradle.configureondemand=false

# Disable file system watching (can cause issues with resource processing)
org.gradle.vfs.watch=false

# Keep daemon alive for 3 hours
org.gradle.daemon.idletimeout=10800000

# ===========================
# Android Build Configuration
# ===========================
# Use AndroidX
android.useAndroidX=true

# CRITICAL: Enable Jetifier for maximum compatibility
android.enableJetifier=true

# ===========================
# R8/ProGuard Configuration - MUST BE DISABLED
# ===========================
# CRITICAL: Completely disable R8 and ProGuard
android.enableR8=false
android.enableR8.fullMode=false
android.enableProguard=false
android.r8.failOnMissingClasses=false

# ===========================
# Resource Processing - ALL OPTIMIZATIONS MUST BE DISABLED
# ===========================
# CRITICAL: Disable ALL resource optimizations
android.enableResourceOptimizations=false
android.enableNewResourceShrinker=false
android.enablePngCrunchInReleaseBuilds=false
android.enableMinification=false
android.disableResourceValidation=true

# Non-transitive R class (keep false for TestRigor)
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# ===========================
# AAPT Configuration
# ===========================
# Use AAPT2 but with legacy mode
android.enableAapt2=true
android.aaptOptions.namespaced=false
android.aaptOptions.noCompress=apk,so,xml,arsc

# ===========================
# DEX and Packaging Configuration
# ===========================
# CRITICAL: Use legacy packaging (prevents manifest corruption)
android.useLegacyPackaging=true

# D8 Dexer configuration
android.enableD8=true
android.enableD8.desugaring=true
android.enableIncrementalDesugaring=false

# CRITICAL: Disable new APK creator (use legacy)
android.enableNewApkCreator=false
android.keepTimestampsInApk=false

# Disable experimental transforms
android.experimental.legacyTransform.forceNonIncremental=true
android.enableSeparateAnnotationProcessing=false

# ===========================
# Build Features Configuration
# ===========================
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=false
android.defaults.buildfeatures.databinding=false
android.defaults.buildfeatures.compose=false

# ===========================
# Bundle Configuration
# ===========================
# Disable bundle features that might interfere
android.bundle.enableUncompressedNativeLibs=false
android.enableSplits=false

# ===========================
# Build Cache Settings - DISABLED
# ===========================
android.buildCache.enabled=false
android.enableBuildCache=false

# ===========================
# Kotlin Configuration
# ===========================
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.incremental.usePreciseJavaTracking=true

# CRITICAL: Disable parallel tasks in Kotlin
kotlin.parallel.tasks.in.project=false

# Kotlin compiler daemon
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx3072m

# ===========================
# MultiDex Configuration
# ===========================
android.enableMultiDex=true

# ===========================
# Dependency Management
# ===========================
# Suppress version warnings
android.suppressUnsupportedCompileSdk=35
android.suppressUnsupportedOptionWarnings=android.enableR8,android.enableR8.fullMode,android.enableResourceOptimizations,android.enableProguard

# ===========================
# Network Configuration
# ===========================
systemProp.http.keepAlive=true
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Maven repository timeout
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# ===========================
# Error Handling
# ===========================
# Continue build even with lint errors
android.lintOptions.abortOnError=false
android.lintOptions.checkReleaseBuilds=false

# ===========================
# Logging and Debugging
# ===========================
# Log level (lifecycle is good for normal builds)
org.gradle.logging.level=lifecycle

# Show warnings
org.gradle.warning.mode=all

# Console output
org.gradle.console=auto

# ===========================
# CRITICAL TESTRIGOR SETTINGS SUMMARY
# ===========================
# These settings MUST remain as configured to prevent the chunk:16188 error:
#
# MUST BE FALSE:
# - org.gradle.parallel=false (prevents race conditions)
# - org.gradle.caching=false (ensures clean builds)
# - org.gradle.configuration-cache=false (prevents APK corruption)
# - android.enableR8=false (no code optimization)
# - android.enableResourceOptimizations=false (no resource optimization)
# - android.enableNewResourceShrinker=false (no resource shrinking)
# - android.enableMinification=false (no minification)
# - android.nonTransitiveRClass=false (legacy R class handling)
# - android.enableNewApkCreator=false (use legacy APK creator)
# - android.buildCache.enabled=false (no build cache)
#
# MUST BE TRUE:
# - android.useAndroidX=true (use AndroidX)
# - android.enableJetifier=true (convert libraries to AndroidX)
# - android.useLegacyPackaging=true (legacy DEX packaging)
# - android.enableAapt2=true (but with legacy settings)
# - android.enableD8=true (D8 dexer, not R8)
#
# DO NOT MODIFY THESE SETTINGS OR TESTRIGOR WILL FAIL!

# ===========================
# Version Information
# ===========================
# Tested Configuration:
# - Gradle: 8.0.2 (recommended) or 8.3/8.7 (with warnings)
# - AGP: 8.0.2 (REQUIRED - do not use 8.1.x or 8.2.x)
# - JDK: 17 or 21
# - Compile SDK: 35
# - Min SDK: 24
# - Target SDK: 35