// settings.gradle - Simplified and fixed for TestRigor compatibility
// CRITICAL: This configuration is tested to prevent manifest corruption errors

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Force specific plugin versions (BabelWords Update Guide known-good toolchain)
    resolutionStrategy {
        eachPlugin {
            // Android Gradle Plugin 8.5.1
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.5.1")
            }
            // Kotlin 2.2.0 (required by play-services-ads 24.x)
            if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0")
            }
        }
    }
}

dependencyResolutionManagement {
    // Use PREFER_SETTINGS for flexibility
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// Root project name
rootProject.name = "LinguaLink"

// Include app module
include ':app'

// Print configuration info
println """
╔════════════════════════════════════════════════════════════╗
║                 TESTRIGOR BUILD CONFIGURATION               ║
