// app/build.gradle - Conversation Mode support
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Firebase (Crashlytics + Analytics) is applied ONLY when google-services.json exists.
// In CI the file is written from the GOOGLE_SERVICES_JSON_BASE64 secret before the build.
// Locally (or in CI without the secret) the file is absent and the build skips Firebase
// entirely, so it never fails just because Firebase config is missing.
def firebaseEnabled = file('google-services.json').exists()
if (firebaseEnabled) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    println "✅ Firebase ENABLED (google-services.json found)"
} else {
    println "ℹ️ Firebase DISABLED (no google-services.json) — building without Crashlytics/Analytics"
}

android {
    namespace 'com.babelwords.com'

    compileSdk rootProject.ext.compile_sdk
    buildToolsVersion rootProject.ext.build_tools_version

    defaultConfig {
        applicationId "com.babelwords.com"
        minSdk rootProject.ext.min_sdk
        targetSdk rootProject.ext.target_sdk
        versionCode (project.findProperty('VERSION_CODE')?.toInteger() ?: 55)
        versionName (project.findProperty('VERSION_NAME') ?: '2.0.0')

        // MultiDex support
        multiDexEnabled true

        // Test instrumentation
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vector drawable support
        vectorDrawables {
            useSupportLibrary true
        }

        // Read access token from local.properties
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }

        // Build config fields
        buildConfigField "boolean", "DEBUG_MODE", "true"
        buildConfigField "String", "BASE_URL", "\"https://linguagt.com\""
        // Site access code for the production gate (must match the server's SITE_ACCESS_TOKEN).
        // Sourced from the BABELWORDS_ACCESS_TOKEN env var (CI) or local.properties; never hardcoded.
        // Empty by default so dev/preview builds (where the gate is off) load with no code.
        def accessToken = System.getenv("BABELWORDS_ACCESS_TOKEN") ?: localProperties.getProperty('BABELWORDS_ACCESS_TOKEN', '')
        buildConfigField "String", "ACCESS_TOKEN", "\"${accessToken}\""

        // Default false = safe (test creatives on Test Lab). CI can override via Gradle property:
        // ./gradlew assembleRelease -PREAL_ADS_ON_TEST_LAB=true
        buildConfigField "boolean", "REAL_ADS_ON_TEST_LAB",
            "${project.hasProperty('REAL_ADS_ON_TEST_LAB') ? project.getProperty('REAL_ADS_ON_TEST_LAB') : 'false'}"

        // Resource configs - include all 36 Deepgram languages
        resConfigs "en", "es", "fr", "de", "zh", "ja", "ko", "hi", "pt", "ru",
                   "ar", "it", "nl", "pl", "tr", "sv", "da", "no", "fi", "id",
                   "ms", "th", "vi", "cs", "el", "he", "hu", "ro", "sk", "uk",
                   "ca", "hr", "sr", "sl", "tl", "ta"

        // Manifest placeholders if needed
        manifestPlaceholders = [
            appLabel: "@string/app_name"
        ]

        // 64-bit only - smaller APK, modern devices only
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Signing configurations
    signingConfigs {
        debug {
            // Always use project-local debug.keystore; CI generates it before building.
            // Do NOT make this conditional — AGP falls back to ~/.config/.android on
            // XDG-based runners, causing validateSigningDebug to fail.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            // Check if we're in CI/CD environment (GitHub Actions)
            if (System.getenv("ANDROID_KEYSTORE_BASE64") != null) {
                // Decode base64 keystore and save to temp file
                def keystoreBytes = System.getenv("ANDROID_KEYSTORE_BASE64").decodeBase64()
                def keystoreFile = File.createTempFile("keystore", ".jks")
                keystoreFile.deleteOnExit()
                keystoreFile.bytes = keystoreBytes

                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                // Alternative: Use gradle.properties for local builds
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            } else {
                // Fallback to debug signing if no release config available
                // This allows builds to complete even without signing config
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-DEBUG"
            debuggable true
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false

            // Use debug signing
            signingConfig signingConfigs.debug

            // Build config for debug
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "true"  // Only for local development

            // Manifest placeholders for debug
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Still enforce HTTPS in debug
            ]
        }

        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled true

            // Use release signing configuration
            signingConfig signingConfigs.release

            // ProGuard files (but minify is disabled)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Build config for release
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "boolean", "ALLOW_CLEARTEXT", "false"  // Strictly enforce HTTPS

            // Manifest placeholders for release
            manifestPlaceholders += [
                usesCleartextTraffic: "false"  // Never allow cleartext in production
            ]
        }
    }

    // Java compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin options
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }

    // Build features
    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
        compose false
    }

    // Packaging options
    packagingOptions {
        // Don't strip native libraries
        doNotStrip '**/*.so'

        // Legacy packaging for JNI libs
        jniLibs {
            useLegacyPackaging = true
        }

        // Resource handling
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/gradle/incremental.annotation.processors'

        // Pick first for duplicate files
        pickFirst 'META-INF/MANIFEST.MF'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    // Lint options (AGP 8.0.2 syntax)
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage', 'MissingTranslation'
        quiet true
    }

    // Disable splits
    splits {
        abi {
            enable false
        }
        density {
            enable false
        }
        language {
            enable false
        }
    }

    // Test options
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled = true
        // Orchestrator: isolates crashes so one failing test doesn't kill the entire suite
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
}

dependencies {
    // AndroidX Core - REQUIRED FOR CONVERSATION MODE
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Activity and Fragment - REQUIRED FOR PERMISSIONS
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'  // Required for ProcessLifecycleOwner + DefaultLifecycleObserver

    // Google User Messaging Platform (UMP) for GDPR consent
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    
    // Picasso (for image loading)
    implementation 'com.squareup.picasso:picasso:2.71828'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView (for conversation history display)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Navigation (if using)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'

    // ========== CONVERSATION MODE SPECIFIC DEPENDENCIES ==========

    // WebView enhancements (for better WebView support)
    implementation 'androidx.webkit:webkit:1.9.0'

    // Network - HTTP and WebSocket support
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // WebSocket client for real-time conversation mode
    // Note: WebSocket support is built into okhttp:4.12.0, no separate okhttp-ws needed
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Speech/Audio - CRITICAL FOR CONVERSATION MODE
    implementation 'androidx.media:media:1.7.0'

    // Permissions handling - REQUIRED FOR MICROPHONE ACCESS
    implementation 'pub.devrel:easypermissions:3.0.0'

    // Optional: Google Speech Recognition (if you want native speech support)
    // implementation 'com.google.android.gms:play-services-speech:20.0.0'

    // Optional: Deepgram SDK (if available for Android)
    // implementation 'com.deepgram:sdk-android:1.0.0'

    // Browser/WebView utilities
    implementation 'androidx.browser:browser:1.7.0'

    // Work Manager (for background audio processing if needed)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Preference/Settings (for language preferences)
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Security (for secure WebSocket connections)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Google Mobile Ads SDK
    implementation 'com.google.android.gms:play-services-ads:24.9.0'

    // AdMob mediation adapters — versions matched to GMA 24.9.0.
    // Configure Unity & Liftoff/Vungle as BIDDING sources in the AdMob console.
    // (No ProGuard keep rules needed while minifyEnabled is false.)
    implementation 'com.google.ads.mediation:unity:4.16.6.0'
    implementation 'com.unity3d.ads:unity-ads:4.16.6'
    implementation 'com.google.ads.mediation:vungle:7.7.0.0'

    // Google Play Billing for in-app subscriptions (v7 required for BillingManager)
    implementation 'com.android.billingclient:billing-ktx:7.0.0'

    // Firebase (Crashlytics + Analytics). Pulled in only when google-services.json exists
    // so non-Firebase builds don't ship dead Firebase libs or hit init errors at startup.
    // BoM 33.7.0 is Kotlin 2.2.0 / AGP 8.5.1 / compileSdk 35 compatible (do NOT use 32.x).
    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-analytics'    // user/ad analytics (also feeds AdMob)
        implementation 'com.google.firebase:firebase-crashlytics'  // crash + ANR reporting
    }

    // Testing — Unit tests (JVM / Robolectric)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-android:5.12.0'
    testImplementation 'androidx.test:core:1.5.0'

    // Testing — Instrumentation (on-device / Espresso)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    debugImplementation 'androidx.fragment:fragment-testing:1.6.2'

    // Test orchestrator — isolates crashes per test so one failure doesn't kill the suite
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
}

// Task to check APK after build
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy {
            println "\n========================================="
            println "DEBUG APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Conversation Mode: ENABLED"
                println "✓ WebSocket Support: YES"
                println "✓ Ready for upload"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }

    if (task.name == 'assembleRelease') {
        task.finalizedBy {
            println "\n========================================="
            println "RELEASE APK BUILD COMPLETE - CONVERSATION MODE"
            println "========================================="
            def apkFile = file("${buildDir}/outputs/apk/release/app-release.apk")
            if (apkFile.exists()) {
                println "✓ APK Location: ${apkFile.absolutePath}"
                println "✓ APK Size: ${String.format('%.2f MB', apkFile.length() / 1024.0 / 1024.0)}"
                println "✓ Signed: YES"
                println "✓ Conversation Mode: ENABLED"
                println "✓ Ready for deployment"
            } else {
                println "❌ APK not found!"
            }
            println "=========================================\n"
        }
    }
}

// FIXED: Using AGP 8.x compatible API for renaming APK outputs
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            // Ensure APK name is standard
            output.outputFileName.set("app-${variant.name}.apk")
        }
    }
}