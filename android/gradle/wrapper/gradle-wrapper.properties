# Gradle Wrapper Properties - Optimized for TestRigor Compatibility
# IMPORTANT: This configuration is tested to work with AGP 8.0.2 and TestRigor

# Distribution settings
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# RECOMMENDED: Gradle 8.0.2 - Best compatibility with AGP 8.0.2
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-all.zip

# ALTERNATIVE OPTIONS (uncomment one if needed):
# Option 2: Gradle 8.3 (your current version - should work)
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip

# Option 3: Gradle 8.7 (newer, but may have warnings with AGP 8.0.2)
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip

# Network settings
networkTimeout=30000
validateDistributionUrl=true

# Storage settings
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# IMPORTANT: Using '-all' distribution instead of '-bin'
# The '-all' distribution includes sources and documentation which helps with:
# 1. Better IDE integration
# 2. Debugging build issues
# 3. Understanding Gradle internals when troubleshooting TestRigor issues

# Additional JVM args for the Gradle daemon (create gradle.properties if needed)
# org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# org.gradle.parallel=false
# org.gradle.daemon=true
# org.gradle.caching=false
# org.gradle.configureondemand=false
