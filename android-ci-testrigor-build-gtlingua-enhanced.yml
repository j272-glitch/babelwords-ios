      - name: Create Enhanced JavaScript Bridge
        run: |
          echo "=== CREATING ENHANCED JAVASCRIPT BRIDGE ==="
          
          # Create GTLinguaBridge.kt with full WebView + Deepgram integration
          cat > app/src/main/java/com/lingualink/gtlingua/bridge/GTLinguaBridge.kt << 'EOF'
          package com.lingualink.gtlingua.bridge
          
          import android.content.Context
          import android.util.Log
          import android.webkit.JavascriptInterface
          import android.widget.Toast
          import com.lingualink.gtlingua.activity.MainActivity
          import org.json.JSONObject
          
          class GTLinguaBridge(private val context: Context) {
              
              companion object {
                  private const val TAG = "GTLinguaBridge"
              }
              
              @JavascriptInterface
              fun startVoiceRecognition() {
                  Log.d(TAG, "Voice recognition requested from GTLingua")
                  
                  val activity = context as? MainActivity
                  activity?.let {
                      // TODO: Start Deepgram voice recognition
                      Toast.makeText(context, "Starting voice recognition...", Toast.LENGTH_SHORT).show()
                  }
              }
              
              @JavascriptInterface
              fun stopVoiceRecognition() {
                  Log.d(TAG, "Stop voice recognition requested from GTLingua")
                  
                  val activity = context as? MainActivity
                  activity?.let {
                      // TODO: Stop Deepgram voice recognition
                      Toast.makeText(context, "Stopping voice recognition...", Toast.LENGTH_SHORT).show()
                  }
              }
              
              @JavascriptInterface
              fun onTranslationComplete(jsonData: String) {
                  Log.d(TAG, "Translation completed: $jsonData")
                  
                  try {
                      val data = JSONObject(jsonData)
                      val sourceText = data.optString("source", "")
                      val translatedText = data.optString("translation", "")
                      val sourceLang = data.optString("sourceLang", "")
                      val targetLang = data.optString("targetLang", "")
                      
                      Log.i(TAG, "Translation: '$sourceText' ($sourceLang) -> '$translatedText' ($targetLang)")
                      
                      // TODO: Store translation history, analytics, etc.
                      
                  } catch (e: Exception) {
                      Log.e(TAG, "Error parsing translation data", e)
                  }
              }
              
              @JavascriptInterface
              fun onVoiceRecognition(jsonData: String) {
                  Log.d(TAG, "Voice recognition result: $jsonData")
                  
                  try {
                      val data = JSONObject(jsonData)
                      val transcript = data.optString("text", "")
                      val confidence = data.optDouble("confidence", 0.0)
                      val language = data.optString("language", "")
                      
                      Log.i(TAG, "Voice recognized: '$transcript' (${confidence}% confidence, $language)")
                      
                      val activity = context as? MainActivity
                      activity?.onDeepgramResult(transcript, confidence.toFloat())
                      
                  } catch (e: Exception) {
                      Log.e(TAG, "Error parsing voice recognition data", e)
                  }
              }
              
              @JavascriptInterface
              fun logMessage(level: String, message: String) {
                  when (level.uppercase()) {
                      "ERROR" -> Log.e(TAG, "GTLingua: $message")
                      "WARN" -> Log.w(TAG, "GTLingua: $message")
                      "DEBUG" -> Log.d(TAG, "GTLingua: $message")
                      else -> Log.i(TAG, "GTLingua: $message")
                  }
              }
              
              @JavascriptInterface
              fun showToast(message: String) {
                  Toast.makeText(context, message, Toast.LENGTH_SHORT).show()
              }
              
              @JavascriptInterface
              fun getDeviceInfo(): String {
                  return JSONObject().apply {
                      put("platform", "android")
                      put("version", android.os.Build.VERSION.RELEASE)
                      put("model", android.os.Build.MODEL)
                      put("deepgramSupported", true)
                      put("webViewVersion", "enhanced")
                  }.toString()
              }
          }
