name: TestRigor Build - GTLingua Enhanced WebView + Deepgram

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GRADLE_OPTS: -Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
  ORG_GRADLE_PROJECT_android_useLegacyPackaging: true
  WEBVIEW_URL: "https://gtlingua.com"

jobs:
  build-testrigor:
    name: Build GTLingua Enhanced APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "=== SETTING UP ANDROID SDK ==="
          
          # Install Android SDK command line tools
          SDK_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip"
          wget -q $SDK_TOOLS_URL -O android-sdk-tools.zip
          
          # Create Android SDK directory
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Extract command line tools
          unzip -q android-sdk-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # Add to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # Install required packages
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          
          echo "✅ Android SDK setup complete"

      - name: Create Enhanced Build Configuration
        run: |
          echo "=== CREATING ENHANCED BUILD CONFIGURATION ==="
          
          # Backup originals
          [ -f "build.gradle" ] && mv build.gradle build.gradle.original
          [ -f "settings.gradle" ] && mv settings.gradle settings.gradle.original
          
          # Create minimal root build.gradle
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'com.android.library' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Create settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTLinguaEnhanced"
          include ':app'
          EOF
          
          # Create gradle.properties with enhanced WebView settings
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.caching=false
          
          android.useAndroidX=true
          android.enableJetifier=true
          android.useLegacyPackaging=true
          android.nonTransitiveRClass=false
          android.enableR8.fullMode=false
          android.enableDexingArtifactTransform.desugaring=false
          EOF
          
          # Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "✅ Enhanced configuration created"

      - name: Setup Gradle Wrapper
        run: |
          echo "=== SETTING UP GRADLE WRAPPER ==="
          
          mkdir -p gradle/wrapper
          
          echo "Downloading gradle-wrapper.jar..."
          wget -q -O gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar || {
              echo "Failed to download from GitHub, trying alternative..."
              wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
              unzip -q gradle-8.4-bin.zip
              cp gradle-8.4/lib/gradle-wrapper-8.4.jar gradle/wrapper/gradle-wrapper.jar
              rm -rf gradle-8.4 gradle-8.4-bin.zip
            }
          
          # Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          networkTimeout=30000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Download gradlew script
          wget -q -O gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew || {
              echo "Creating gradlew script manually..."
              cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME="$( cd "$( dirname "$0" )" && pwd )"
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          else
              JAVACMD="java"
          fi
          
          exec "$JAVACMD" \
            -cp "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          GRADLEW
            }
          
          chmod +x gradlew
          
          echo "✅ Gradle wrapper setup complete"

      - name: Create Enhanced Android Project
        run: |
          echo "=== CREATING ENHANCED ANDROID PROJECT ==="
          
          # Create directory structure
          mkdir -p app/src/main/java/com/lingualink/gtlingua/{activity,webview,deepgram,bridge,utils}
          mkdir -p app/src/main/res/{layout,values,drawable,xml,raw,color}
          mkdir -p app/src/main/assets
          
          # Create enhanced AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <!-- ENHANCED PERMISSIONS FOR WEBVIEW + DEEPGRAM -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              
              <!-- CRITICAL: Enhanced audio permissions for Deepgram -->
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAPTURE_AUDIO_OUTPUT"
                               tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                               android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                               android:maxSdkVersion="32" />
              
              <!-- Camera for OCR -->
              <uses-permission android:name="android.permission.CAMERA" />
              
              <!-- Location for context-aware translation -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              
              <!-- System permissions for enhanced functionality -->
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              
              <!-- Hardware features -->
              <uses-feature 
                  android:name="android.hardware.microphone" 
                  android:required="true" />
              <uses-feature 
                  android:name="android.hardware.camera" 
                  android:required="false" />
              <uses-feature 
                  android:name="android.hardware.audio.output" 
                  android:required="true" />
              <uses-feature 
                  android:name="android.hardware.touchscreen" 
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GTLingua"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  tools:targetApi="34">
                  
                  <!-- Enhanced Main Activity with WebView Focus -->
                  <activity
                      android:name=".activity.MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.GTLingua.Launcher"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|navigation"
                      android:windowSoftInputMode="adjustResize"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      
                      <!-- Handle text sharing -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      
                      <!-- Handle GTLingua URLs -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="gtlingua.com" />
                      </intent-filter>
                  </activity>
                  
                  <!-- Deepgram Service for enhanced audio processing -->
                  <service
                      android:name=".deepgram.DeepgramService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
                  
                  <!-- File provider for sharing -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.lingualink.gtlingua.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          
          </manifest>
          EOF
          
          echo "✅ Enhanced AndroidManifest.xml created"

      - name: Create Enhanced MainActivity
        run: |
          echo "=== CREATING ENHANCED MAIN ACTIVITY ==="
          
          # Create MainActivity.kt with full WebView + Deepgram integration
          cat > app/src/main/java/com/lingualink/gtlingua/activity/MainActivity.kt << 'EOF'
          package com.lingualink.gtlingua.activity
          
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.ServiceConnection
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.IBinder
          import android.util.Log
          import android.view.KeyEvent
          import android.view.View
          import android.webkit.*
          import android.widget.ProgressBar
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.lingualink.gtlingua.R
          import com.lingualink.gtlingua.bridge.GTLinguaBridge
          import com.lingualink.gtlingua.deepgram.DeepgramService
          import com.lingualink.gtlingua.webview.EnhancedWebChromeClient
          import com.lingualink.gtlingua.webview.EnhancedWebViewClient
          
          class MainActivity : AppCompatActivity() {
              
              companion object {
                  private const val TAG = "GTLinguaMain"
                  private const val PERMISSIONS_REQUEST_CODE = 1001
                  private const val GTLINGUA_URL = "https://gtlingua.com"
              }
              
              // Enhanced WebView with full Deepgram support
              private lateinit var webView: WebView
              private lateinit var progressBar: ProgressBar
              private lateinit var gtlinguaBridge: GTLinguaBridge
              
              // Deepgram service integration
              private var deepgramService: DeepgramService? = null
              private var isServiceBound = false
              
              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, service: IBinder?) {
                      val binder = service as DeepgramService.LocalBinder
                      deepgramService = binder.getService()
                      isServiceBound = true
                      Log.d(TAG, "Deepgram service connected")
                  }
                  
                  override fun onServiceDisconnected(name: ComponentName?) {
                      deepgramService = null
                      isServiceBound = false
                      Log.d(TAG, "Deepgram service disconnected")
                  }
              }
              
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  try {
                      initializeViews()
                      setupWebView()
                      checkPermissions()
                      
                      Log.d(TAG, "GTLingua Enhanced WebView initialized")
                      
                  } catch (e: Exception) {
                      Log.e(TAG, "Error in onCreate", e)
                      showErrorDialog("Initialization failed: ${e.message}")
                  }
              }
              
              private fun initializeViews() {
                  webView = findViewById(R.id.webView)
                  progressBar = findViewById(R.id.progressBar)
                  gtlinguaBridge = GTLinguaBridge(this)
              }
              
              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  // Enhanced WebView settings for GTLingua + Deepgram
                  val webSettings = webView.settings.apply {
                      // JavaScript and DOM
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      
                      // Media and Audio - CRITICAL for Deepgram
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      
                      // Performance
                      cacheMode = WebSettings.LOAD_DEFAULT
                      databaseEnabled = true
                      
                      // User experience
                      setSupportZoom(true)
                      builtInZoomControls = true
                      displayZoomControls = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      
                      // User agent for GTLingua compatibility
                      userAgentString = "GTLingua-Enhanced-Android/1.0 " + userAgentString
                  }
                  
                  // Enhanced JavaScript Bridge for GTLingua
                  webView.addJavascriptInterface(gtlinguaBridge, "GTLinguaAndroid")
                  
                  // Enhanced WebView clients
                  webView.webViewClient = EnhancedWebViewClient(this)
                  webView.webChromeClient = EnhancedWebChromeClient(this, progressBar)
                  
                  // Enable debugging in debug builds
                  if (BuildConfig.DEBUG) {
                      WebView.setWebContentsDebuggingEnabled(true)
                  }
              }
              
              private fun checkPermissions() {
                  val requiredPermissions = arrayOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.MODIFY_AUDIO_SETTINGS,
                      Manifest.permission.INTERNET,
                      Manifest.permission.ACCESS_NETWORK_STATE
                  )
                  
                  val permissionsToRequest = requiredPermissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  
                  if (permissionsToRequest.isNotEmpty()) {
                      Log.d(TAG, "Requesting permissions: ${permissionsToRequest.joinToString()}")
                      ActivityCompat.requestPermissions(
                          this,
                          permissionsToRequest.toTypedArray(),
                          PERMISSIONS_REQUEST_CODE
                      )
                  } else {
                      startDeepgramService()
                      loadGTLingua()
                  }
              }
              
              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  
                  if (requestCode == PERMISSIONS_REQUEST_CODE) {
                      val allGranted = grantResults.all { it == PackageManager.PERMISSION_GRANTED }
                      
                      if (allGranted) {
                          Log.d(TAG, "All permissions granted")
                          startDeepgramService()
                          loadGTLingua()
                      } else {
                          Log.w(TAG, "Some permissions denied")
                          showPermissionDialog()
                      }
                  }
              }
              
              private fun startDeepgramService() {
                  val intent = Intent(this, DeepgramService::class.java)
                  startService(intent)
                  bindService(intent, serviceConnection, Context.BIND_AUTO_CREATE)
              }
              
              private fun loadGTLingua() {
                  var url = GTLINGUA_URL
                  
                  // Handle incoming intent data
                  intent?.let { incomingIntent ->
                      when (incomingIntent.action) {
                          Intent.ACTION_SEND -> {
                              val sharedText = incomingIntent.getStringExtra(Intent.EXTRA_TEXT)
                              if (!sharedText.isNullOrEmpty()) {
                                  url += "?text=${Uri.encode(sharedText)}&mode=text"
                              }
                          }
                          Intent.ACTION_VIEW -> {
                              incomingIntent.data?.let { uri ->
                                  if (uri.host == "gtlingua.com") {
                                      url = uri.toString()
                                  }
                              }
                          }
                      }
                  }
                  
                  Log.d(TAG, "Loading GTLingua: $url")
                  
                  // Enhanced headers for GTLingua compatibility
                  val headers = mapOf(
                      "Accept" to "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
                      "Accept-Language" to "en-US,en;q=0.5",
                      "DNT" to "1",
                      "Upgrade-Insecure-Requests" to "1"
                  )
                  
                  webView.loadUrl(url, headers)
              }
              
              fun onDeepgramResult(transcript: String, confidence: Float) {
                  Log.d(TAG, "Deepgram result: $transcript (confidence: $confidence)")
                  
                  // Inject transcript into GTLingua
                  val jsCode = """
                      (function() {
                          try {
                              // Find text input elements
                              const textInputs = document.querySelectorAll('textarea, input[type="text"], [contenteditable="true"]');
                              if (textInputs.length > 0) {
                                  const input = textInputs[0];
                                  
                                  if (input.tagName === 'TEXTAREA' || input.tagName === 'INPUT') {
                                      input.value = '$transcript';
                                      input.dispatchEvent(new Event('input', { bubbles: true }));
                                  } else {
                                      input.textContent = '$transcript';
                                      input.dispatchEvent(new Event('input', { bubbles: true }));
                                  }
                                  
                                  // Trigger any translation if auto-translate is enabled
                                  const translateButton = document.querySelector('[data-translate], .translate-btn, button[title*="translate"]');
                                  if (translateButton) {
                                      translateButton.click();
                                  }
                                  
                                  console.log('Deepgram transcript injected:', '$transcript');
                              }
                          } catch (e) {
                              console.error('Error injecting Deepgram transcript:', e);
                          }
                      })();
                  """.trimIndent()
                  
                  webView.evaluateJavascript(jsCode) { result ->
                      Log.d(TAG, "Transcript injection result: $result")
                  }
              }
              
              private fun showPermissionDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("Permissions Required")
                      .setMessage("GTLingua requires microphone access for Deepgram speech recognition. Please grant permissions for full functionality.")
                      .setPositiveButton("Grant Permissions") { _, _ ->
                          checkPermissions()
                      }
                      .setNegativeButton("Continue Without") { _, _ ->
                          loadGTLingua()
                      }
                      .show()
              }
              
              private fun showErrorDialog(message: String) {
                  AlertDialog.Builder(this)
                      .setTitle("Error")
                      .setMessage(message)
                      .setPositiveButton("OK") { _, _ -> finish() }
                      .show()
              }
              
              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack()
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }
              
              override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  deepgramService?.resumeListening()
              }
              
              override fun onPause() {
                  webView.onPause()
                  deepgramService?.pauseListening()
                  super.onPause()
              }
              
              override fun onDestroy() {
                  if (isServiceBound) {
                      unbindService(serviceConnection)
                  }
                  stopService(Intent(this, DeepgramService::class.java))
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF
          
          echo "✅ Enhanced MainActivity created"

      - name: Create Enhanced WebView Components
        run: |
          echo "=== CREATING ENHANCED WEBVIEW COMPONENTS ==="
          
          # Create EnhancedWebViewClient.kt
          cat > app/src/main/java/com/lingualink/gtlingua/webview/EnhancedWebViewClient.kt << 'EOF'
          package com.lingualink.gtlingua.webview
          
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.http.SslError
          import android.util.Log
          import android.webkit.*
          import android.widget.Toast
          
          class EnhancedWebViewClient(private val context: Context) : WebViewClient() {
              
              companion object {
                  private const val TAG = "GTLinguaWebClient"
              }
              
              override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                  super.onPageStarted(view, url, favicon)
                  Log.d(TAG, "Page started loading: $url")
              }
              
              override fun onPageFinished(view: WebView?, url: String?) {
                  super.onPageFinished(view, url)
                  Log.d(TAG, "Page finished loading: $url")
                  
                  // Inject enhanced GTLingua integration
                  injectGTLinguaEnhancements(view)
              }
              
              override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                  val url = request?.url?.toString() ?: return false
                  
                  return when {
                      url.startsWith("https://gtlingua.com") -> {
                          Log.d(TAG, "Loading GTLingua URL: $url")
                          false // Let WebView handle it
                      }
                      url.startsWith("mailto:") || url.startsWith("tel:") -> {
                          // Handle external intents
                          true
                      }
                      else -> {
                          Log.d(TAG, "External URL detected: $url")
                          false
                      }
                  }
              }
              
              override fun onReceivedError(
                  view: WebView?,
                  request: WebResourceRequest?,
                  error: WebResourceError?
              ) {
                  super.onReceivedError(view, request, error)
                  Log.e(TAG, "WebView error: ${error?.description} (${error?.errorCode})")
                  
                  if (request?.url?.host == "gtlingua.com") {
                      Toast.makeText(context, "Failed to load GTLingua. Check internet connection.", Toast.LENGTH_LONG).show()
                  }
              }
              
              override fun onReceivedSslError(view: WebView?, handler: SslErrorHandler?, error: SslError?) {
                  Log.e(TAG, "SSL Error: ${error?.toString()}")
                  // For production, should handle SSL errors properly
                  handler?.proceed() // Only for development
              }
              
              private fun injectGTLinguaEnhancements(webView: WebView?) {
                  webView?.let { web ->
                      val jsCode = """
                          (function() {
                              console.log('GTLingua Enhanced Integration Loading...');
                              
                              // Enhanced Deepgram integration
                              window.GTLinguaEnhanced = {
                                  version: '1.0.0',
                                  deepgram: {
                                      enabled: true,
                                      autoStart: false,
                                      language: 'en-US'
                                  },
                                  
                                  // Enhanced voice control
                                  startVoiceRecognition: function() {
                                      if (window.GTLinguaAndroid) {
                                          console.log('Starting enhanced voice recognition');
                                          window.GTLinguaAndroid.startVoiceRecognition();
                                      }
                                  },
                                  
                                  stopVoiceRecognition: function() {
                                      if (window.GTLinguaAndroid) {
                                          console.log('Stopping enhanced voice recognition');
                                          window.GTLinguaAndroid.stopVoiceRecognition();
                                      }
                                  },
                                  
                                  // Enhanced translation callbacks
                                  onTranslationComplete: function(data) {
                                      if (window.GTLinguaAndroid) {
                                          console.log('Enhanced translation complete:', data);
                                          window.GTLinguaAndroid.onTranslationComplete(JSON.stringify(data));
                                      }
                                  },
                                  
                                  // Auto-detect and enhance GTLingua elements
                                  enhanceInterface: function() {
                                      // Find and enhance voice buttons
                                      const voiceButtons = document.querySelectorAll(
                                          '[data-voice], .voice-btn, button[aria-label*="voice"], [title*="voice"]'
                                      );
                                      
                                      voiceButtons.forEach(btn => {
                                          if (!btn.dataset.enhanced) {
                                              btn.addEventListener('click', () => {
                                                  console.log('Enhanced voice button clicked');
                                                  this.startVoiceRecognition();
                                              });
                                              btn.dataset.enhanced = 'true';
                                              btn.style.border = '2px solid #4F46E5';
                                              console.log('Enhanced voice button:', btn);
                                          }
                                      });
                                      
                                      // Find and monitor text inputs
                                      const textInputs = document.querySelectorAll(
                                          'textarea, input[type="text"], [contenteditable="true"]'
                                      );
                                      
                                      textInputs.forEach(input => {
                                          if (!input.dataset.enhanced) {
                                              input.addEventListener('input', (e) => {
                                                  console.log('Text input detected:', e.target.value || e.target.textContent);
                                              });
                                              input.dataset.enhanced = 'true';
                                          }
                                      });
                                      
                                      // Monitor for translation results
                                      const observer = new MutationObserver(mutations => {
                                          mutations.forEach(mutation => {
                                              if (mutation.type === 'childList') {
                                                  mutation.addedNodes.forEach(node => {
                                                      if (node.nodeType === 1 && node.textContent) {
                                                          // Check if this might be a translation result
                                                          if (node.className && 
                                                              (node.className.includes('translation') || 
                                                               node.className.includes('result'))) {
                                                              console.log('Possible translation result:', node.textContent);
                                                          }
                                                      }
                                                  });
                                              }
                                          });
                                      });
                                      
                                      observer.observe(document.body, {
                                          childList: true,
                                          subtree: true
                                      });
                                  }
                              };
                              
                              // Initialize enhanced interface
                              if (document.readyState === 'loading') {
                                  document.addEventListener('DOMContentLoaded', () => {
                                      window.GTLinguaEnhanced.enhanceInterface();
                                  });
                              } else {
                                  window.GTLinguaEnhanced.enhanceInterface();
                              }
                              
                              // Re-enhance after delays for dynamic content
                              setTimeout(() => window.GTLinguaEnhanced.enhanceInterface(), 2000);
                              setTimeout(() => window.GTLinguaEnhanced.enhanceInterface(), 5000);
                              
                              console.log('GTLingua Enhanced Integration Ready');
                          })();
                      """.trimIndent()
                      
                      web.evaluateJavascript(jsCode) { result ->
                          Log.d(TAG, "Enhanced integration injected: $result")
                      }
                  }
              }
          }
          EOF
          
          # Create EnhancedWebChromeClient.kt
          cat > app/src/main/java/com/lingualink/gtlingua/webview/EnhancedWebChromeClient.kt << 'EOF'
          package com.lingualink.gtlingua.webview
          
          import android.content.Context
          import android.util.Log
          import android.view.View
          import android.webkit.*
          import android.widget.ProgressBar
          
          class EnhancedWebChromeClient(
              private val context: Context,
              private val progressBar: ProgressBar
          ) : WebChromeClient() {
              
              companion object {
                  private const val TAG = "GTLinguaWebChrome"
              }
              
              override fun onProgressChanged(view: WebView?, newProgress: Int) {
                  super.onProgressChanged(view, newProgress)
                  
                  progressBar.progress = newProgress
                  progressBar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                  
                  if (newProgress == 100) {
                      Log.d(TAG, "GTLingua page fully loaded")
                  }
              }
              
              override fun onPermissionRequest(request: PermissionRequest?) {
                  request?.let { permissionRequest ->
                      Log.d(TAG, "Permission requested: ${permissionRequest.resources.joinToString()}")
                      
                      val requestedResources = permissionRequest.resources
                      val supportedResources = mutableListOf<String>()
                      
                      // CRITICAL: Auto-grant audio capture for Deepgram
                      if (requestedResources.contains(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) {
                          supportedResources.add(PermissionRequest.RESOURCE_AUDIO_CAPTURE)
                          Log.d(TAG, "Auto-granting microphone access for Deepgram")
                      }
                      
                      // Grant video capture if requested
                      if (requestedResources.contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {
                          supportedResources.add(PermissionRequest.RESOURCE_VIDEO_CAPTURE)
                          Log.d(TAG, "Auto-granting camera access")
                      }
                      
                      if (supportedResources.isNotEmpty()) {
                          permissionRequest.grant(supportedResources.toTypedArray())
                          Log.d(TAG, "Granted permissions: ${supportedResources.joinToString()}")
                      } else {
                          permissionRequest.deny()
                          Log.w(TAG, "Denied unsupported permissions")
                      }
                  }
              }
              
              override fun onConsoleMessage(consoleMessage: ConsoleMessage?): Boolean {
                  consoleMessage?.let { msg ->
                      val level = when (msg.messageLevel()) {
                          ConsoleMessage.MessageLevel.ERROR -> "ERROR"
                          ConsoleMessage.MessageLevel.WARNING -> "WARN"
                          ConsoleMessage.MessageLevel.DEBUG -> "DEBUG"
                          else -> "INFO"
                      }
                      
                      Log.d(TAG, "GTLingua Console [$level]: ${msg.message()} (${msg.sourceId()}:${msg.lineNumber()})")
                      
                      // Monitor for Deepgram-specific console messages
                      if (msg.message().contains("deepgram", ignoreCase = true) || 
                          msg.message().contains("speech", ignoreCase = true)) {
                          Log.i(TAG, "Deepgram activity detected: ${msg.message()}")
                      }
                  }
                  
                  return true
              }
              
              override fun onJsAlert(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                  Log.d(TAG, "GTLingua Alert: $message")
                  result?.confirm()
                  return true
              }
              
              override fun onJsConfirm(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                  Log.d(TAG, "GTLingua Confirm: $message")
                  result?.confirm()
                  return true
              }
          }
          EOF
          
          echo "✅ Enhanced WebView components created"

