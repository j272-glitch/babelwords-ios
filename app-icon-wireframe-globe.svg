<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563EB" stroke="none"/>
  
  <!-- Main globe outline -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Vertical meridian lines -->
  <ellipse cx="256" cy="256" rx="60" ry="180" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="120" ry="180" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="180" ry="180" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Horizontal latitude lines -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="180" ry="120" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Equator line (emphasized) -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Central meridian (emphasized) -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Corner accent dots for modern touch -->
  <circle cx="256" cy="76" r="8" fill="#60A5FA"/>
  <circle cx="256" cy="436" r="8" fill="#60A5FA"/>
  <circle cx="76" cy="256" r="8" fill="#60A5FA"/>
  <circle cx="436" cy="256" r="8" fill="#60A5FA"/>
  
  <!-- Central highlight dot -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.8"/>
  
</svg>