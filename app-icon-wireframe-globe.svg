<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with GTLingua theme color -->
  <rect width="512" height="512" fill="#4F46E5" rx="64"/>
  
  <!-- Globe wireframe matching GTLingua style -->
  <g transform="translate(256,256)">
    <!-- Main globe circle -->
    <circle r="160" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    
    <!-- Vertical meridian lines -->
    <ellipse rx="30" ry="160" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <ellipse rx="60" ry="160" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <ellipse rx="90" ry="160" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <ellipse rx="120" ry="160" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    
    <!-- Horizontal latitude lines -->
    <ellipse rx="160" ry="30" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <ellipse rx="160" ry="60" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <ellipse rx="160" ry="90" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <ellipse rx="160" ry="120" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    
    <!-- Primary equator line -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#FFFFFF" stroke-width="3.5" opacity="0.95"/>
    
    <!-- Primary meridian line -->
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#FFFFFF" stroke-width="3.5" opacity="0.95"/>
    
    <!-- Connection nodes at key intersections -->
    <circle cx="0" cy="-80" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="80" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-80" cy="0" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="80" cy="0" r="4" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Central communication hub -->
    <circle r="8" fill="#FFFFFF" opacity="0.95"/>
    <circle r="4" fill="#4F46E5"/>
  </g>
  
  <!-- Subtle corner radius accent -->
  <rect x="0" y="0" width="512" height="512" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1" rx="64"/>
</svg>