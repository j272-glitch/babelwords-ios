// Root build.gradle - AGP 8.7.2 compatible with Unity LevelPlay
plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

// Define common SDK versions used across the project
ext {
    // AGP and Gradle versions - Updated for compatibility
    agp_version = '8.7.2'
    gradle_version = '8.10'
    
    // Android SDK versions
    compile_sdk = 35
    target_sdk = 35
    min_sdk = 24
    build_tools_version = '35.0.0'
    
    // Kotlin version - Updated for AGP 8.7 compatibility
    kotlin_version = '1.9.24'
    
    // Unity LevelPlay / IronSource SDK versions
    ironsource_sdk_version = '7.9.0'
    admob_adapter_version = '4.3.44'
    facebook_adapter_version = '4.3.48'
    unity_ads_adapter_version = '4.3.38'
    
    // Google Play Services versions (for AdMob)
    play_services_ads_version = '23.5.0'
    play_services_ads_identifier_version = '18.0.1'
    play_services_basement_version = '18.3.0'
    play_services_base_version = '18.3.0'
    
    // AndroidX versions - Updated to latest stable
    androidx_core_version = '1.13.1'
    androidx_appcompat_version = '1.7.0'
    material_version = '1.12.0'
    
    // MultiDex
    multidex_version = '2.0.1'
    
    // TestRigor compatibility flags
    enableProguardInReleaseBuilds = false
    enableHermes = false
    enableShrinkResources = false
    useLegacyPackaging = true
    disableResourceOptimizations = true
    disableBinaryXmlOptimizations = true
    disablePngCrunching = true
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        // IronSource/Unity LevelPlay Maven repository
        maven { 
            url 'https://android-sdk.is.com/'
            content {
                includeGroup 'com.ironsource.sdk'
                includeGroup 'com.ironsource.adapters'
            }
        }
        
        // JitPack (if needed for other dependencies)
        maven { 
            url 'https://jitpack.io'
        }
    }
}

// Configure all subprojects for AGP 8.7
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                // SDK configuration
                compileSdk rootProject.ext.compile_sdk
                buildToolsVersion rootProject.ext.build_tools_version

                defaultConfig {
                    minSdk rootProject.ext.min_sdk
                    targetSdk rootProject.ext.target_sdk
                }

                // Java 17 required for AGP 8.7 and Gradle 8.10
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                // Kotlin options
                if (project.hasProperty('kotlin')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }

                // Build features - AGP 8.7 compatible
                buildFeatures {
                    buildConfig true
                    resValues true
                }

                // Packaging options - AGP 8.7 syntax
                packaging {
                    dex {
                        useLegacyPackaging = rootProject.ext.useLegacyPackaging
                    }
                    
                    jniLibs {
                        useLegacyPackaging = rootProject.ext.useLegacyPackaging
                    }
                    
                    resources {
                        excludes += '/META-INF/{AL2.0,LGPL2.1}'
                        excludes += '/META-INF/*.kotlin_module'
                    }
                }

                // Lint options - AGP 8.7 syntax
                lint {
                    checkReleaseBuilds false
                    abortOnError false
                    quiet true
                }
            }

            // androidComponents configuration - Fully supported in AGP 8.7
            androidComponents {
                beforeVariants(selector().all()) { variantBuilder ->
                    variantBuilder.enable = true
                }
                
                onVariants(selector().all()) { variant ->
                    // Additional variant configuration if needed
                }
            }
        }
    }
}

// Clean task
tasks.register('clean', Delete) {
    delete rootProject.buildDir
    delete fileTree(rootDir) {
        include '**/build'
        include '**/.gradle'
    }
}

// TestRigor-specific build task
tasks.register('buildForTestRigor') {
    dependsOn ':app:assembleDebug'
    doLast {
        println "\n================================"
        println "✅ APK BUILT FOR TESTRIGOR"
        println "================================"
        println "Location: app/build/outputs/apk/debug/app-debug.apk"
        println "AGP Version: ${agp_version}"
        println "Gradle Version: ${gradle_version}"
        println "Ready for TestRigor upload"
        println "================================\n"
    }
}

// Task to verify Unity LevelPlay configuration
tasks.register('verifyAdConfig') {
    doLast {
        println "\n========================================"
        println "Unity LevelPlay / IronSource Configuration"
        println "========================================"
        println "SDK Versions:"
        println "  IronSource SDK: ${ironsource_sdk_version}"
        println "  AdMob Adapter: ${admob_adapter_version}"
        println "  Facebook Adapter: ${facebook_adapter_version}"
        println "  Unity Ads Adapter: ${unity_ads_adapter_version}"
        println ""
        println "Google Play Services:"
        println "  Play Services Ads: ${play_services_ads_version}"
        println "  Ads Identifier: ${play_services_ads_identifier_version}"
        println "  Basement: ${play_services_basement_version}"
        println "  Base: ${play_services_base_version}"
        println ""
        println "Android Configuration:"
        println "  Compile SDK: ${compile_sdk}"
        println "  Target SDK: ${target_sdk}"
        println "  Min SDK: ${min_sdk}"
        println "  Build Tools: ${build_tools_version}"
        println ""
        println "Other:"
        println "  Kotlin: ${kotlin_version}"
        println "  MultiDex: ${multidex_version}"
        println "========================================\n"
    }
}

// Task to verify AGP version
tasks.register('verifyAGP') {
    doLast {
        println "\n========================================"
        println "Android Gradle Plugin Verification"
        println "========================================"
        println "AGP Version: ${agp_version}"
        println "Gradle Version: ${gradle_version} (from wrapper)"
        println "Kotlin Version: ${kotlin_version}"
        println "Java Version: ${System.getProperty('java.version')}"
        println ""
        println "Compatibility:"
        println "  ✅ AGP 8.7.2 + Gradle 8.10"
        println "  ✅ Java 17+"
        println "  ✅ Android SDK 35"
        println "  ✅ TestRigor Compatible"
        println "  ✅ androidComponents API Supported"
        println ""
        println "Key Features:"
        println "  ✅ Unity LevelPlay/IronSource Ready"
        println "  ✅ Google AdMob Integration"
        println "  ✅ Conversation Mode Support"
        println "  ✅ AAB Generation Enabled"
        println "========================================\n"
    }
}

// Task to show all build variants
tasks.register('showVariants') {
    dependsOn ':app:tasks'
    doLast {
        println "\n========================================"
        println "Available Build Tasks"
        println "========================================"
        println "Debug Builds:"
        println "  ./gradlew assembleDebug         → Build debug APK"
        println "  ./gradlew installDebug          → Install debug APK"
        println ""
        println "Release Builds:"
        println "  ./gradlew assembleRelease       → Build release APK"
        println "  ./gradlew bundleRelease         → Build release AAB (Play Store)"
        println ""
        println "TestRigor:"
        println "  ./gradlew buildForTestRigor     → Build & verify for TestRigor"
        println ""
        println "Verification:"
        println "  ./gradlew verifyAdConfig        → Check ad SDK versions"
        println "  ./gradlew verifyAGP             → Check AGP compatibility"
        println "  ./gradlew :app:diagnoseAabGeneration → Diagnose AAB issues"
        println ""
        println "Cleanup:"
        println "  ./gradlew clean                 → Clean all build outputs"
        println "========================================\n"
    }
}

// Task to verify complete build configuration
tasks.register('verifyBuildConfig') {
    doLast {
        println "\n========================================"
        println "Complete Build Configuration Check"
        println "========================================"
        
        // Check Gradle version
        def gradleVersion = gradle.gradleVersion
        println "Current Gradle Version: ${gradleVersion}"
        if (gradleVersion.startsWith("8.10")) {
            println "  ✅ Gradle 8.10 is correct for AGP 8.7"
        } else if (gradleVersion.startsWith("8.9")) {
            println "  ⚠️  Gradle 8.9 found - consider updating to 8.10"
        } else {
            println "  ❌ Incompatible Gradle version - requires 8.10"
        }
        
        // Check Java version
        def javaVersion = JavaVersion.current()
        println "\nJava Version: ${javaVersion}"
        if (javaVersion.isCompatibleWith(JavaVersion.VERSION_17)) {
            println "  ✅ Java 17+ compatible"
        } else {
            println "  ❌ Java 17+ required"
        }
        
        // Check configuration consistency
        println "\nConfiguration Consistency:"
        println "  AGP Version: ${agp_version}"
        println "  All build.gradle files: Should use ${agp_version}"
        println "  settings.gradle: Should use ${agp_version}"
        println "  gradle-wrapper.properties: Should use gradle-${gradle_version}-bin.zip"
        
        println "\nTestRigor Settings:"
        println "  Legacy Packaging: ${useLegacyPackaging}"
        println "  ProGuard/R8: ${enableProguardInReleaseBuilds ? 'Enabled' : 'Disabled'}"
        println "  Resource Shrinking: ${enableShrinkResources ? 'Enabled' : 'Disabled'}"
        
        println "\n✅ Build configuration verified"
        println "========================================\n"
    }
}

// AGP 8.7.2 compatibility check
gradle.projectsEvaluated {
    println "✅ Gradle configuration complete - AGP 8.7.2"
    println "   androidComponents API: Fully Supported"
    println "   TestRigor Compatibility: Maintained"
}
