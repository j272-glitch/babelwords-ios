plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34
    namespace 'com.lingualink.translator'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.lingualink.translator"
        minSdk 21
        targetSdk 34
        versionCode 69
        versionName "1.0.69-testrigor-fix"

        // NDK configuration for native libraries
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        // Ensure vector drawables are handled properly
        vectorDrawables {
            useSupportLibrary true
        }

        // MultiDex support
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            zipAlignEnabled true
        }
        release {
            minifyEnabled false  // Keep disabled for TestRigor compatibility
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            zipAlignEnabled true
        }
    }

    // UPDATED: Using new 'packaging' block (replaces deprecated packagingOptions)
    packaging {
        dex {
            useLegacyPackaging = true
        }

        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/MANIFEST.MF'
            excludes += '/META-INF/LICENSE'
            excludes += '/META-INF/LICENSE.txt'
            excludes += '/META-INF/license.txt'
            excludes += '/META-INF/NOTICE'
            excludes += '/META-INF/NOTICE.txt'
            excludes += '/META-INF/notice.txt'
            excludes += '/META-INF/ASL2.0'
            excludes += '/META-INF/*.kotlin_module'

            // Merge duplicates instead of excluding
            merges += '/META-INF/LICENSE'
            merges += '/META-INF/LICENSE.txt'
            merges += '/META-INF/NOTICE'
            merges += '/META-INF/NOTICE.txt'
        }

        jniLibs {
            useLegacyPackaging = true
        }
    }

    // UPDATED: AAPT options for Gradle 8.7 compatibility
    androidResources {
        noCompress 'apk', 'so', 'xml'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'

        // Disable PNG crunching for compatibility
        generateLocaleConfig = false
    }

    // Build features configuration
    buildFeatures {
        aidl false
        renderScript false
        shaders false
        buildConfig true
        resValues true
        viewBinding false
        dataBinding false
        compose false
    }

    // UPDATED: Lint options for Gradle 8.7
    lint {
        checkReleaseBuilds false
        abortOnError false
        checkDependencies false
        disable += ['InvalidPackage', 'MissingTranslation', 'ObsoleteLintCustomCheck']
        quiet true
        warningsAsErrors false
    }

    // Testing configuration
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }

        animationsDisabled = true
    }

    // Source sets configuration
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            kotlin.srcDirs = ['src/main/kotlin', 'src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// UPDATED: Android components configuration for Gradle 8.7
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        // Keep all variants enabled
        variantBuilder.enable = true
    }

    onVariants(selector().all()) { variant ->
        // Ensure legacy packaging is used for TestRigor compatibility
        variant.packaging.dex.useLegacyPackaging.set(true)
        variant.packaging.jniLibs.useLegacyPackaging.set(true)

        // Disable resource shrinking at the variant level
        variant.shrinkResources.set(false)
    }

    finalizeDsl { extension ->
        // Additional configuration after DSL is finalized
        extension.buildTypes.forEach { buildType ->
            buildType.crunchPngs = false  // Disable PNG crunching
        }
    }
}

dependencies {
    // UPDATED: Latest compatible versions for Gradle 8.7
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Material Design components
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // MultiDex support
    implementation 'androidx.multidex:multidex:2.0.1'

    // Additional compatibility libraries
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}

// UPDATED: Task configuration for Gradle 8.7
tasks.configureEach { task ->
    if (task.name.startsWith("package")) {
        task.doLast {
            println "APK packaging completed - ready for TestRigor"

            // List all APK outputs with better Gradle 8.7 syntax
            android.applicationVariants.configureEach { variant ->
                variant.outputs.configureEach { output ->
                    def outputFile = output.outputFile
                    if (outputFile != null && outputFile.name.endsWith('.apk')) {
                        println "Generated APK: ${outputFile.absolutePath}"
                        println "APK Size: ${outputFile.length() / 1024 / 1024} MB"
                    }
                }
            }
        }
    }
}

// Add a task to validate the APK structure
tasks.register('validateApk') {
    dependsOn 'assembleDebug'
    doLast {
        def apkFile = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (apkFile.exists()) {
            println "✓ APK file exists at: ${apkFile.absolutePath}"
            println "✓ APK size: ${apkFile.length() / 1024} KB"
        } else {
            throw new GradleException("APK file not found!")
        }
    }
}